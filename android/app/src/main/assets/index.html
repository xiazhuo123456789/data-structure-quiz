列","type":"judge","typeTitle":"判断题","no":"3.16","stem":"栈和队列都是线性结构，只是插入和删除操作受到限制。（　）","options":[],"code":"","answer":"√","explanation":"栈和队列的元素之间仍是\"一对一\"的线性关系，存在唯一的首元素与尾元素，除首尾外每个元素有且仅有一个直接前驱和一个直接后继，因此逻辑结构依旧是线性表。它们的特殊性在于运算被限定在端点：栈只允许在一端插删，队列允许在一端插入、另一端删除。所以准确的表述是\"操作受限的线性表\"，而不是\"非线性结构\"。这一区分在概念题中经常出现，混淆会把它们误判为非线性结构。","blocks":[],"answerKey":"T"},{"chapter":3,"chapterTitle":"第3章 栈和队列","type":"judge","typeTitle":"判断题","no":"3.17","stem":"循环队列是队列的一种链式存储结构。（　）","options":[],"code":"","answer":"×","explanation":"循环队列是队列的顺序存储结构，它把一维数组的首尾在逻辑上相连，用取模运算让 front 与 rear 在数组内循环回绕，从而解决了顺序队列\"假溢出\"的问题——即队尾指针到达数组末尾而数组前端仍有空闲空间时，无法再插入新元素的现象。\n队列的链式存储称为链队列，通常用带头结点的单链表实现，并附设队头、队尾两个指针。二者的区别在于是否依赖连续空间，以及是否需要处理指针回绕。故本题说法错误。","blocks":[],"answerKey":"F"},{"chapter":3,"chapterTitle":"第3章 栈和队列","type":"judge","typeTitle":"判断题","no":"3.18","stem":"任何一个递归过程都可以转换成非递归过程。（　）","options":[],"code":"","answer":"√","explanation":"从计算理论角度看，递归与迭代（配合显式栈）具有同等的表达能力：递归的本质是\"用系统栈保存中间状态\"，而系统栈不过是一段由编译器管理的内存，完全可以由程序员自己用数组或链表模拟。因此任何递归算法都能改写为非递归形式。\n需要区分的是\"改写\"的难易与\"是否有必要\"。尾递归可直接改为循环；树、图的深度优先遍历可用显式栈改写；而阿克曼函数一类非尾递归且结构复杂的递归，改写后需要自行维护状态机，代码可读性会显著下降。因此工程上常在\"递归简洁但深度受限\"与\"迭代繁琐但空间可控\"之间权衡。","blocks":[],"answerKey":"T"},{"chapter":3,"chapterTitle":"第3章 栈和队列","type":"short","typeTitle":"简答与计算分析题","no":"3.19","stem":"若元素的进栈次序为 A、B、C、D，试列举所有可能的出栈序列，并说明判断某序列合法的一般方法。","options":[],"code":"","answer":"共 14 种（卡特兰数 C₄ = 14），列举如下。","explanation":"ABCD、ABDC、ACBD、ACDB、ADCB、BACD、BADC、BCAD、BCDA、BDCA、CBAD、CBDA、CDBA、DCBA。\n可按\"第一个出栈元素是谁\"分类穷举，避免遗漏。\n以 A 开头（A 一出栈，B、C、D 尚未入栈或仍在栈中）：ABCD、ABDC、ACBD、ACDB、ADCB，共 5 种。\n以 B 开头（先压 A、B，弹 B）：后随元素的合法排列为 BACD、BADC、BCAD、BCDA、BDCA，共 5 种。\n以 C 开头（压 A、B、C，弹 C）：CBAD、CBDA、CDBA，共 3 种。\n以 D 开头（全部压栈后弹 D）：DCBA，共 1 种。\n合计 5+5+3+1 = 14 种，与卡特兰数一致（可验证：C₁=1，C₂=2，C₃=5，C₄=14）。\n一般判断方法有两条。其一是模拟法：按进栈次序逐步压栈，每步可选择\"继续压栈\"或\"弹出栈顶\"，若能走完并产出于给定序列，则合法；此法最可靠。其二是特征判别法：对输出序列中任一下标 i，其后所有比该元素小的元素必构成递减序列（因为在 i 之后出栈的更小元素，必然在它之前入栈且被压在它下面，只能逆序出栈）。例如 CABD 中，C 之后比 C 小的元素为 A、B，其出现次序为 A、B（递增），违反上述特征，故 CABD 非法。","blocks":[]},{"chapter":3,"chapterTitle":"第3章 栈和队列","type":"short","typeTitle":"简答与计算分析题","no":"3.20","stem":"循环队列中，队空与队满的判定条件会重合，试说明三种常用的区分方法及各自的代价。","options":[],"code":"","answer":"三种方法：少用一个存储单元、增设元素计数器、增设标志位。","explanation":"问题根源在于：若队头指针追上队尾表示队空，队尾指针追上队头表示队满，则两种情形下 front 与 rear 取值完全相同，单凭两个指针无法区分。\n方法一，少用一个单元。约定\"队尾指针的下一位置是队头\"时即认为队满，条件为 (rear+1)%MaxSize == front；队空仍为 rear == front。代价是牺牲一个存储单元，队列最大长度由 MaxSize 降为 MaxSize−1，优点是实现最简单、无须额外变量。\n方法二，增设计数器 count。插入时 count++、删除时 count−−，队空为 count==0、队满为 count==MaxSize。代价是每次操作多一次加减，且需额外一个整型空间，优点是空间利用率达到 100%，判空判满的条件也最直观。\n方法三，增设标志位 tag。约定 tag=0 表示最近一次操作是删除（此时若 rear==front 则为队空），tag=1 表示最近一次是插入（此时若 rear==front 则为队满）。代价是每次操作都要维护 tag，逻辑稍绕；优点是同样不浪费单元。\n工程上多采用方法一，因为顺序队列容量通常按上界预留，浪费一个单元可以忽略；若容量极度受限（如嵌入式场景），则采用方法二。","blocks":[]},{"chapter":3,"chapterTitle":"第3章 栈和队列","type":"short","typeTitle":"简答与计算分析题","no":"3.21","stem":"简述利用栈将中缀表达式转换为后缀表达式的算法步骤，并以 A+B*(C−D)−E/F 为例手工转换。","options":[],"code":"","answer":"转换结果为 A B C D − * + E F / −。","explanation":"算法步骤：设运算符栈 S，自左向右扫描中缀表达式。\n第一，遇到操作数，直接输出。\n第二，遇到运算符 op：若 S 为空或栈顶为左括号，则 op 入栈；否则当 op 的优先级不高于栈顶运算符优先级时，反复弹出栈顶并输出，直到该条件不成立，再把 op 入栈。注意\"不高于\"这一措辞保证了同级运算符左结合。\n第三，遇到左括号，直接入栈；遇到右括号，反复弹出并输出直到遇见左括号，左括号弹出但不输出。\n第四，扫描结束后，将栈中剩余运算符依次弹出输出。\n手工转换 A+B*(C−D)−E/F：输出 A；+ 入栈；输出 B；* 优先级高于 +，入栈；( 入栈；输出 C；− 入栈（栈顶为左括号）；输出 D；遇 )，弹出 − 输出并弹出左括号；此时栈顶为 *，遇下一个 −，其优先级低于 *，故弹出 * 输出，再比较栈顶 +，同级故弹出 + 输出，然后 − 入栈；输出 E；/ 优先级高于 −，入栈；输出 F；扫描结束，弹出 /、−。最终输出 A B C D − * + E F / −。\n验证：用栈对结果求值，应得 A + B*(C−D) − E/F，与原式一致。","blocks":[]},{"chapter":3,"chapterTitle":"第3章 栈和队列","type":"algo","typeTitle":"算法设计题","no":"3.22","stem":"试以数组实现顺序栈，给出初始化、判空、入栈、出栈、取栈顶元素五个基本操作。","options":[],"code":"","answer":"以 top 指向栈顶元素的下一个位置，空栈时 top=0。","explanation":"top 的约定有两种：指向栈顶元素，或指向栈顶元素的下一个位置。本实现取后者（教材约定），好处是空栈、判满、元素个数都可直接用 top 表达：空栈为 top==0，栈满为 top==MAXSIZE，元素个数为 top。\n[BLOCK:0]\n五个操作均为 O(1) 时间、O(1) 辅助空间。注意两处易错：其一，--S->top 与 S->top-- 的区别——前者先减后用，取出的是原栈顶元素，正确；后者会先取出未赋值的单元。其二，出栈前必须判空，入栈前必须判满，否则会越界读写。","blocks":[{"type":"code","text":"#define MAXSIZE 100\ntypedef struct {\n    ElemType data[MAXSIZE];\n    int top;                          /* 栈顶元素的下一个位置 */\n} SqStack;\n\nStatus InitStack(SqStack *S) { S->top = 0; return OK; }\nint StackEmpty(SqStack S) { return S.top == 0; }\nint StackLength(SqStack S) { return S.top; }\n\nStatus Push(SqStack *S, ElemType e) {\n    if (S->top >= MAXSIZE) return ERROR;    /* 栈满 */\n    S->data[S->top++] = e;\n    return OK;\n}\n\nStatus Pop(SqStack *S, ElemType *e) {\n    if (S->top == 0) return ERROR;          /* 栈空 */\n    *e = S->data[--S->top];\n    return OK;\n}\n\nStatus GetTop(SqStack S, ElemType *e) {\n    if (S.top == 0) return ERROR;\n    *e = S.data[S.top - 1];\n    return OK;\n}"}]},{"chapter":3,"chapterTitle":"第3章 栈和队列","type":"algo","typeTitle":"算法设计题","no":"3.23","stem":"试以数组实现循环队列，给出初始化、判空、判满、入队、出队与求队长六个操作（采用少用一个单元的方式）。","options":[],"code":"","answer":"front 指向队头元素，rear 指向队尾元素的下一个位置。","explanation":"在\"少用一个单元\"的约定下：队空为 front==rear；队满为 (rear+1)%MAXSIZE==front；队长为 (rear−front+MAXSIZE)%MAXSIZE。\n[BLOCK:0]\n全部操作为 O(1)。关键点是\"指针移动必须取模\"：写成 Q->rear++ 而不取模，指针会在到达 MAXSIZE 后越界，这正是普通顺序队列\"假溢出\"的来源。另外要注意 front 只增不减、但取模后能回绕，故不能用 rear−front 的正负判断队列长度。","blocks":[{"type":"code","text":"#define MAXSIZE 100\ntypedef struct {\n    ElemType data[MAXSIZE];\n    int front, rear;\n} SqQueue;\n\nStatus InitQueue(SqQueue *Q) { Q->front = Q->rear = 0; return OK; }\nint QueueEmpty(SqQueue Q) { return Q.front == Q.rear; }\nint QueueFull(SqQueue Q) { return (Q.rear + 1) % MAXSIZE == Q.front; }\nint QueueLength(SqQueue Q) { return (Q.rear - Q.front + MAXSIZE) % MAXSIZE; }\n\nStatus EnQueue(SqQueue *Q, ElemType e) {\n    if ((Q->rear + 1) % MAXSIZE == Q->front) return ERROR;\n    Q->data[Q->rear] = e;\n    Q->rear = (Q->rear + 1) % MAXSIZE;\n    return OK;\n}\n\nStatus DeQueue(SqQueue *Q, ElemType *e) {\n    if (Q->front == Q->rear) return ERROR;\n    *e = Q->data[Q->front];\n    Q->front = (Q->front + 1) % MAXSIZE;\n    return OK;\n}"}]},{"chapter":3,"chapterTitle":"第3章 栈和队列","type":"algo","typeTitle":"算法设计题","no":"3.24","stem":"试设计算法，检验一个表达式中的圆括号、方括号、花括号是否配对，并指出第一个不匹配的位置。","options":[],"code":"","answer":"用栈：遇左括号入栈，遇右括号与栈顶比较，失配即报错；扫描结束栈空则配对正确。","explanation":"括号配对的核心是\"最近未匹配的左括号最先被匹配\"，这正是后进先出的语义。算法：自左向右扫描字符数组，遇 (、[、{ 则入栈；遇 )、]、} 时先判栈空（栈空说明右括号多余），再弹栈顶并检查类型是否对应（不对应说明类型错配）；扫描结束后若栈非空，说明左括号多余。\n[BLOCK:0]\n时间 O(n)，空间最坏 O(n)（如全为左括号时栈深为 n）。三个必须覆盖的失败情形是：右括号多余、类型错配、左括号多余；缺任一条，程序都会漏报错误。","blocks":[{"type":"code","text":"int BracketMatch(char s[], int n) {\n    SqStack S; ElemType e;\n    InitStack(&S);\n    for (int i = 0; i < n; i++) {\n        if (s[i]=='(' || s[i]=='[' || s[i]=='{') Push(&S, s[i]);\n        else if (s[i]==')' || s[i]==']' || s[i]=='}') {\n            if (StackEmpty(S)) return i + 1;          /* 右括号多余 */\n            Pop(&S, &e);\n            if ((s[i]==')' && e!='(') || (s[i]==']' && e!='[') || (s[i]=='}' && e!='{'))\n                return i + 1;                          /* 类型不匹配 */\n        }\n    }\n    return StackEmpty(S) ? 0 : n + 1;                  /* 0 表示配对正确 */\n}"}]},{"chapter":3,"chapterTitle":"第3章 栈和队列","type":"algo","typeTitle":"算法设计题","no":"3.25","stem":"试设计算法，对以字符串形式给出的后缀表达式求值（假设只含个位数字与 +、−、*、/ 四种运算符）。","options":[],"code":"","answer":"用栈：遇数字入栈；遇运算符弹出两数，以\"后弹出者为左操作数\"求值后压回。","explanation":"后缀表达式无须考虑括号与优先级，求值只需一遍扫描。关键在于操作数的次序：先弹出的是右操作数 b、后弹出的是左操作数 a，计算 a op b；若颠倒，减法和除法会得到错误结果。除法还需处理除数为零的情形。\n[BLOCK:0]\n时间 O(n)，空间 O(n)。循环结束时栈中应恰好剩一个元素，若剩余多个或栈空，则说明表达式本身有误——完备的实现应加上这一合法性检查。","blocks":[{"type":"code","text":"double EvalRPN(char s[], int n) {\n    double stack[MAXSIZE], a, b;\n    int top = 0;\n    for (int i = 0; i < n; i++) {\n        if (s[i] >= '0' && s[i] <= '9') stack[top++] = s[i] - '0';\n        else if (s[i]==' ' || s[i]=='\\t') continue;\n        else {\n            b = stack[--top];                 /* 右操作数 */\n            a = stack[--top];                 /* 左操作数 */\n            switch (s[i]) {\n                case '+': stack[top++] = a + b; break;\n                case '-': stack[top++] = a - b; break;\n                case '*': stack[top++] = a * b; break;\n                case '/': if (b == 0) return 0.0/0.0;\n                          stack[top++] = a / b; break;\n            }\n        }\n    }\n    return stack[--top];\n}"}]},{"chapter":4,"chapterTitle":"第4章 串","type":"choice","typeTitle":"选择题","no":"4.1","stem":"串是（　）。","options":[{"key":"A","text":"少于一个或多个字符组成的有限序列"},{"key":"B","text":"零个或多个字符组成的有限序列"},{"key":"C","text":"一个或多个字符组成的有限序列"},{"key":"D","text":"零个或多个字符组成的无限序列"}],"code":"","answer":"B","explanation":"串（字符串）是由零个或多个字符组成的有限序列，通常记作 S = \"c₁c₂…cₙ\"（n≥0）。n 称为串的长度，n=0 时的串称为空串，记作 \"\"（或 Φ）。\"零个\"这一限定不可少，否则空串将不合法，而空串在串运算中是不可回避的状态（例如求子串越界时通常返回空串）。\"有限\"也不可少，与线性表的定义一致。故答案为 B。","blocks":[],"answerKey":"B"},{"chapter":4,"chapterTitle":"第4章 串","type":"choice","typeTitle":"选择题","no":"4.2","stem":"空串与空格串的关系是（　）。","options":[{"key":"A","text":"二者相同"},{"key":"B","text":"空串长度为 0，空格串长度大于 0"},{"key":"C","text":"空串的长度大于空格串"},{"key":"D","text":"二者都由空格字符组成"}],"code":"","answer":"B","explanation":"空串是不含任何字符的串，长度为 0；空格串是由一个或多个空格字符组成的串，长度等于空格字符的个数，其内容并非\"没有\"，而是一串空白。二者在字符串比较、长度计算、判空运算中的结果完全不同：StrLength(\"\") = 0，而 StrLength(\"   \") = 3。\n这一区分在模式匹配与文本处理中尤其重要：若把空串与空格串混为一谈，会出现\"文本非空却判定为空\"或\"空行被当作有内容\"的错误。故答案为 B。","blocks":[],"answerKey":"B"},{"chapter":4,"chapterTitle":"第4章 串","type":"choice","typeTitle":"选择题","no":"4.3","stem":"若串 S = \"software\"，则 S 的子串（含空串）个数为（　）。","options":[{"key":"A","text":"36"},{"key":"B","text":"45"},{"key":"C","text":"46"},{"key":"D","text":"37"}],"code":"","answer":"D","explanation":"长度为 n 的串，其子串由\"起始位置\"与\"长度\"共同确定：起始位置有 n 种，从第 i 个字符起可取的子串长度有 n−i+1 种，故非空子串个数为 ∑(i=1→n)(n−i+1) = n(n+1)/2；再加上空串这一个，总数为 n(n+1)/2+1。\n\"software\" 由 s、o、f、t、w、a、r、e 共 8 个字符构成，故非空子串 8×9/2 = 36 个，含空串为 37 个，选 D。A 项 36 漏计空串；B 项 45 对应 n=9 时的非空子串数；C 项 46 对应 n=9 时含空串的子串数，二者都是数错串长的结果。本题同时考查两个易错点：是否计入空串、串长是否数对。","blocks":[],"answerKey":"D"},{"chapter":4,"chapterTitle":"第4章 串","type":"choice","typeTitle":"选择题","no":"4.4","stem":"在朴素模式匹配（BF 算法）中，若主串长度为 n、模式串长度为 m，则最坏情况下的比较次数为（　）。","options":[{"key":"A","text":"n + m"},{"key":"B","text":"n × m"},{"key":"C","text":"n"},{"key":"D","text":"m"}],"code":"","answer":"B","explanation":"BF 算法的做法是：从主串第 pos 个字符起与模式串逐字符比较，一旦失配就把主串指针回溯到本趟起始位置的下一位，重新开始。最坏情况出现在\"每趟都比较到模式串最后一个字符才失配\"时——例如主串为 \"aaaaaab\"、模式串为 \"aaab\"，每趟都比较 4 次，共约 n−m+1 趟，总比较次数为 m×(n−m+1)，即 O(n×m)。\nA 项 n+m 是 KMP 算法的量级；C、D 项分别是只看主串或只看模式串的错误估计。BF 的低效根源在于\"主串指针回溯\"，KMP 的改进正是利用已匹配的信息避免回溯。故答案为 B。","blocks":[],"answerKey":"B"},{"chapter":4,"chapterTitle":"第4章 串","type":"choice","typeTitle":"选择题","no":"4.5","stem":"KMP 算法的时间复杂度为（　）。","options":[{"key":"A","text":"O(n×m)"},{"key":"B","text":"O(n + m)"},{"key":"C","text":"O(n)"},{"key":"D","text":"O(m)"}],"code":"","answer":"B","explanation":"KMP 由两部分构成：求 next 数组与进行匹配。求 next 的过程本质是对模式串自身做匹配，指针不回退，时间为 O(m)；匹配过程中主串指针 i 只前进不后退，模式串指针 j 虽会回退，但每次回退都对应此前的一次前进，总回退次数不超过总前进次数，故匹配时间为 O(n)。二者相加为 O(n+m)。\n需要说明的是，KMP 的优势并不体现在渐进复杂度的\"降阶\"上（BF 的最坏为 O(nm)，KMP 为 O(n+m)），而体现在\"最坏情况有保证\"以及\"主串指针不回退、可流式处理\"——后者使 KMP 适用于主串无法回退的场合（如从外设逐字符读入）。故答案为 B。","blocks":[],"answerKey":"B"},{"chapter":4,"chapterTitle":"第4章 串","type":"choice","typeTitle":"选择题","no":"4.6","stem":"两个串相等的充分必要条件是（　）。","options":[{"key":"A","text":"两个串的长度相等"},{"key":"B","text":"两个串所含字符相同"},{"key":"C","text":"两个串的长度相等且对应位置上的字符相同"},{"key":"D","text":"两个串的存储结构相同"}],"code":"","answer":"C","explanation":"串相等要求长度与内容同时一致。仅长度相等（A）显然不够；仅字符集合相同（B）也不够——\"abc\" 与 \"cba\" 所含字符相同但作为串并不相等，因为串是有序序列，次序是它的一部分。\n需要补充的是\"串的比较\"：教材中定义了串的比较规则，即按对应字符的字符编码逐位比较，第一次出现差异处编码小者对应的串较小；若所有对应字符相同，则长度短者较小。这一规则与\"相等\"的定义相容，也是串排序的基础。D 项存储结构属于实现层面，与串的值无关。故答案为 C。","blocks":[],"answerKey":"C"},{"chapter":4,"chapterTitle":"第4章 串","type":"choice","typeTitle":"选择题","no":"4.7","stem":"在串的块链存储结构中，\"结点大小\"指的是（　）。","options":[{"key":"A","text":"每个结点中指针域所占的字节数"},{"key":"B","text":"每个结点中存放的字符个数"},{"key":"C","text":"链表中结点的总个数"},{"key":"D","text":"每个字符占用的存储单元数"}],"code":"","answer":"B","explanation":"块链存储把串分成若干块，每块作为一个结点存入单链表，结点内含一个数据域（存放若干个字符）与一个指针域。\"结点大小\"即数据域能容纳的字符个数，它直接决定存储密度：结点越大，指针域的相对开销越小，存储密度越高，但最后一个结点往往填不满，造成内部碎片；结点越小，空间利用越灵活，但指针开销增大，链式结构的优势被削弱。\n若结点大小为 1，块链结构退化为每结点存一个字符的普通链表，此时存储密度仅为 1/(1+指针大小)，非常低。故答案为 B。","blocks":[],"answerKey":"B"},{"chapter":4,"chapterTitle":"第4章 串","type":"choice","typeTitle":"选择题","no":"4.8","stem":"设串 S 的长度为 n，则 SubString(Sub, S, pos, len) 操作的功能是（　）。","options":[{"key":"A","text":"用 Sub 返回 S 中第 pos 个字符起长度为 len 的子串"},{"key":"B","text":"用 Sub 返回 S 中前 len 个字符组成的子串"},{"key":"C","text":"返回 S 中第 pos 个字符的位置"},{"key":"D","text":"用 Sub 返回 S 中从第 pos 个字符起到串尾的子串"}],"code":"","answer":"A","explanation":"求子串操作需要两个参数：起始位置 pos（1≤pos≤n）与子串长度 len（0≤len≤n−pos+1）。若参数越界（pos 大于串长，或 pos+len−1 超过串长），按教材约定返回空串或返回错误状态，具体以题目的约定为准。\n注意 len 允许为 0，此时返回空串，这是合法操作而非错误——许多实现在此处的边界判断写成 len <= 0 就报错，与定义不符。B 项描述的是取前缀，D 项描述的是取后缀（相当于 len 取 n−pos+1）。故答案为 A。","blocks":[],"answerKey":"A"},{"chapter":4,"chapterTitle":"第4章 串","type":"choice","typeTitle":"选择题","no":"4.9","stem":"KMP 算法中 next[j] 的含义是（　）。","options":[{"key":"A","text":"模式串中第 j 个字符的编码值"},{"key":"B","text":"模式串前 j−1 个字符中，最长相等前后缀的长度加 1"},{"key":"C","text":"主串中第 j 个字符失配后应跳转到的位置"},{"key":"D","text":"模式串中第 j 个字符之前与主串已匹配的字符个数"}],"code":"","answer":"B","explanation":"next[j] 刻画的是模式串自身的结构性质：它表示模式串的前 j−1 个字符（即 p₁…pⱼ₋₁）中，最长的\"既是前缀又是后缀\"的真子串的长度，再加 1（即该前缀之后的下一个字符的位置）。按教材约定 next[1]=0。\n其用途是：当主串第 i 个字符与模式串第 j 个字符失配时，无须回溯主串指针，只需令 j = next[j]，即把模式串右移到\"已匹配部分的最长相等前后缀\"对齐的位置，继续比较。这样跳过的字符必然不可能匹配，因而不会漏解。\nA 项与算法无关；C 项混淆了主串与模式串的下标；D 项描述的是已匹配长度而非模式串自身的结构。故答案为 B。","blocks":[],"answerKey":"B"},{"chapter":4,"chapterTitle":"第4章 串","type":"choice","typeTitle":"选择题","no":"4.10","stem":"设主串 T = \"ababcabcacbab\"，模式串 P = \"abcac\"，采用 KMP 算法匹配。若某趟比较在模式串第 4 个字符处失配，则应将模式串右移（　）位后继续比较。","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"4"}],"code":"","answer":"B","explanation":"先求 P = \"abcac\" 在 j=4 处的 next 值。next[j] 等于 p₁…pⱼ₋₁ 的最长相等真前后缀长度加 1。j=4 时考察 \"aba\"，其最长相等真前后缀为 \"a\"（长度 1），故 next[4] = 1+1 = 2。\n失配发生在 j=4，此时令 j = next[4] = 2，即模式串第 2 个字符移到原第 4 个字符的位置，右移量为 4−2 = 2 位，故选 B。\n跳跃的合理性可这样理解：已经匹配成功的部分是 \"abc\"，把它与模式串自身比较，其最长相等前后缀为 \"a\"，说明只有长度为 1 的前缀有可能继续匹配，其余右移量都会因模式串自身的结构而被排除。一般地，右移量 = 已匹配长度 − 最长相等前后缀长度 = 3 − 1 = 2，与按 next 计算的结果一致。","blocks":[],"answerKey":"B"},{"chapter":4,"chapterTitle":"第4章 串","type":"blank","typeTitle":"填空题","no":"4.11","stem":"串的长度是指________。","options":[],"code":"","answer":"串中所含字符的个数","explanation":"串长即字符个数，空串长度为 0。需要与\"存储时占用的字节数\"区分：在定长顺序存储中，串变量所占空间是固定的 MAXSTRLEN，与当前串长无关；在堆分配存储中，占用空间与串长加一（末尾的结束标记）有关。另外在 C 语言中，strlen 统计的是第一个 '\\0' 之前的字符个数，因此串中不能含有 '\\0'，这一点与教材中\"串可含任意字符\"的抽象定义存在差异，编程实现时须注意。","blocks":[],"blanks":1,"answerParts":["串中所含字符的个数"]},{"chapter":4,"chapterTitle":"第4章 串","type":"blank","typeTitle":"填空题","no":"4.12","stem":"长度分别为 3 和 5 的两个空格串，其长度之差为________。","options":[],"code":"","answer":"2","explanation":"空格串的长度等于空格字符的个数，故长度分别为 3 与 5，差为 2。本题的用意在于确认\"空格是字符\"这一事实：空格在 ASCII 中的编码为 32，是一个实实在在的字符，会被计入串长，也会参与串比较。容易混淆的是：空串（\"\"，长度 0）与空格串（\" \"，长度 1）不同；而 \"a b\" 与 \"ab\" 也不相等，前者长度为 3。","blocks":[],"blanks":1,"answerParts":["2"]},{"chapter":4,"chapterTitle":"第4章 串","type":"blank","typeTitle":"填空题","no":"4.13","stem":"模式串 P = \"ababaaab\" 的 next 数组（下标从 1 开始，next[1]=0）为________。","options":[],"code":"","answer":"0，1，1，2，3，4，2，2","explanation":"逐位计算，next[j] 等于 p₁…pⱼ₋₁ 的最长相等真前后缀长度加 1：\nj=1：约定 next[1]=0。\nj=2：考察 \"a\"，无真前缀，next[2]=1。\nj=3：考察 \"ab\"，\"a\" 与 \"b\" 不等，next[3]=1。\nj=4：考察 \"aba\"，\"a\"=\"a\"，长度 1，next[4]=2。\nj=5：考察 \"abab\"，\"ab\"=\"ab\"，长度 2，next[5]=3。\nj=6：考察 \"ababa\"，\"aba\"=\"aba\"，长度 3，next[6]=4。\nj=7：考察 \"ababaa\"，长度 3 的 \"aba\" 与 \"baa\" 不等、长度 2 的 \"ab\" 与 \"aa\" 不等、长度 1 的 \"a\" 与 \"a\" 相等，next[7]=2。\nj=8：考察 \"ababaaa\"，同理只有长度 1 的 \"a\" 匹配，next[8]=2。\n故 next = 0,1,1,2,3,4,2,2。校验方法：把该数组代回匹配过程，若每次失配后的右移都不跳过可能的解，且不产生多余的比较，则结果正确。","blocks":[],"blanks":1,"answerParts":["0，1，1，2，3，4，2，2"]},{"chapter":4,"chapterTitle":"第4章 串","type":"blank","typeTitle":"填空题","no":"4.14","stem":"长度为 n 的串，其非空子串的个数为________，含空串的子串个数为________。","options":[],"code":"","answer":"n(n+1)/2；n(n+1)/2 + 1","explanation":"推导见 4.3 题：起始位置有 n 种，从第 i 个字符起有 n−i+1 种长度，求和得 n(n+1)/2。含空串时加 1。\n需要注意两个易错点：一是\"子串\"要求字符连续，与\"子序列\"不同——子序列只要求相对次序不变，可以不连续，其个数为 2ⁿ−1（非空）；二是教材中有时把\"串本身\"与\"空串\"是否计入作为不同口径，答题时应按题目要求处理，若题目未说明，通常按\"含串本身与空串\"计。","blocks":[],"blanks":2,"answerParts":["n(n+1)/2","n(n+1)/2 + 1"]},{"chapter":4,"chapterTitle":"第4章 串","type":"blank","typeTitle":"填空题","no":"4.15","stem":"在 KMP 算法中，当主串指针 i 与模式串指针 j 失配时，应执行的操作是________。","options":[],"code":"","answer":"i 不变，令 j = next[j]，继续比较；若 j 变为 0，则 i 与 j 同时增 1","explanation":"失配时主串指针不回退，这是 KMP 与 BF 的本质区别。j = next[j] 的含义是把模式串右移，使已匹配部分的最长相等前缀对齐到当前主串位置。若 next[j] 为 0，说明模式串的第 1 个字符也无法与当前位置匹配，此时模式串整体右移一位，即 i 与 j 同时加 1（等价于从主串下一位置重新开始匹配第一个字符）。\n这一操作保证了 i 单调递增，是 KMP 达到 O(n+m) 的关键。实现中常见的错误是忘记处理 j==0 的分支，导致死循环或数组下标越界。","blocks":[],"blanks":1,"answerParts":["i 不变，令 j = next[j]，继续比较；若 j 变为 0，则 i 与 j 同时增 1"]},{"chapter":4,"chapterTitle":"第4章 串","type":"judge","typeTitle":"判断题","no":"4.16","stem":"空串是空白串。（　）","options":[],"code":"","answer":"×","explanation":"空串是不含任何字符的串，长度为 0；空白串（空格串）是由一个或多个空格组成的串，长度大于 0。二者在长度、内容、比较结果上都不同：空串是任何串的子串，而空格串不是。这一区分在文本处理中是基本要求，例如判断一行是否为空，应检查长度为 0，而不是检查是否含有空格字符。","blocks":[],"answerKey":"F"},{"chapter":4,"chapterTitle":"第4章 串","type":"judge","typeTitle":"判断题","no":"4.17","stem":"在串的块链存储结构中，结点内存放的字符数越多，存储密度越高。（　）","options":[],"code":"","answer":"√","explanation":"存储密度定义为\"数据元素本身占用的存储量 / 结点结构占用的存储总量\"。设结点存放 k 个字符、每个字符占 1 个单元、指针占 p 个单元，则密度为 k/(k+p)。k 增大时该比值单调上升并趋近于 1，故结点越大存储密度越高。\n但结点大小并非越大越好：结点过大时，最后一个结点往往有大量空位无法利用（内部碎片），且插入、删除字符时需要在结点内搬移，操作变复杂。因此块链存储的结点大小需在\"空间利用率\"与\"操作灵活性\"之间折中，实际多取 8 至 80 个字符。","blocks":[],"answerKey":"T"},{"chapter":4,"chapterTitle":"第4章 串","type":"judge","typeTitle":"判断题","no":"4.18","stem":"KMP 算法中模式串的 next 数组只与模式串本身有关，与主串无关。（　）","options":[],"code":"","answer":"√","explanation":"next 数组刻画的是模式串自身的周期性质，即\"每个前缀的最长相等前后缀长度\"，其计算过程只用到模式串的字符，完全不需要主串参与。因此对同一个模式串，无论主串是什么，next 数组都相同，可以预先算好并重复使用。\n这一性质有重要的工程意义：当需要在大量文本中反复搜索同一模式（如编译器的关键字扫描、入侵检测的特征串匹配）时，next 数组只需计算一次，匹配阶段的开销降为纯 O(n)。这也是 KMP 相对 BF 在实际应用中更有价值的另一层原因。","blocks":[],"answerKey":"T"},{"chapter":4,"chapterTitle":"第4章 串","type":"short","typeTitle":"简答与计算分析题","no":"4.19","stem":"对模式串 P = \"ababaaab\"，计算 next 数组与 nextval 数组，并以表格形式给出推导过程。","options":[],"code":"","answer":"next = 0,1,1,2,3,4,2,2；nextval = 0,1,0,1,0,4,2,1。","explanation":"next 的推导见 4.13 题。nextval 是在 next 基础上的优化：若 p[j] == p[next[j]]，说明按 next 回退后仍会在同一字符处失配，回退是无效的，故令 nextval[j] = nextval[next[j]]，一次退到底；否则 nextval[j] = next[j]。\n[BLOCK:0]\n逐位说明：j=2，p[2]='b' 与 p[1]='a' 不等，nextval[2]=next[2]=1。j=3，p[3]='a' 与 p[1]='a' 相等，nextval[3]=nextval[1]=0。j=4，p[4]='b' 与 p[2]='b' 相等，nextval[4]=nextval[2]=1。j=5，p[5]='a' 与 p[3]='a' 相等，nextval[5]=nextval[3]=0。j=6，p[6]='a' 与 p[4]='b' 不等，nextval[6]=4。j=7，p[7]='a' 与 p[2]='b' 不等，nextval[7]=2。j=8，p[8]='b' 与 p[2]='b' 相等，nextval[8]=nextval[2]=1。\n校验：代入 \"ababaaab\" 与主串 \"abababaababaaab\" 匹配，用 nextval 时的比较次数应少于用 next；若二者相同，说明该模式串没有可利用的连续相同字符，优化无效。","blocks":[{"type":"table","rows":[["j","1","2","3","4","5","6","7","8"],["p[j]","a","b","a","b","a","a","a","b"],["next[j]","0","1","1","2","3","4","2","2"],["p[next[j]]","—","a","a","b","a","b","b","b"],["比较结果","—","不等","相等","相等","相等","不等","不等","相等"],["nextval[j]","0","1","0","1","0","4","2","1"]]}]},{"chapter":4,"chapterTitle":"第4章 串","type":"short","typeTitle":"简答与计算分析题","no":"4.20","stem":"试举例说明朴素模式匹配算法的最坏情况，并计算该情况下的比较次数。","options":[],"code":"","answer":"最坏情况如主串 T = \"aaaaaab\"（n=7）、模式串 P = \"aaab\"（m=4），比较次数为 m×(n−m+1) = 4×4 = 16。","explanation":"BF 算法从主串第 pos 位起逐字符比较，失配后主串指针回溯到本趟起点的下一位。最坏情况的特征是\"每趟都比较到模式串的最后一个字符才失配\"，从而每趟都浪费了前 m−1 次比较。\n以 T = \"aaaaaab\"、P = \"aaab\" 为例：第 1 趟比较 a-a、a-a、a-a、a-b 失配（4 次）；第 2 趟从第 2 位起，同样比较 4 次后失配；……直到第 4 趟才完全匹配。共 4 趟、每趟 4 次，合计 16 次。一般地，趟数为 n−m+1，每趟 m 次，故为 m(n−m+1)，当 m 与 n 同阶时约为 n²/4，即 O(nm)。\nKMP 在该例中只需约 n+m 次比较，因为它利用\"已匹配的 aaaa 中，前三个 a 可以与后续位置复用\"这一信息，避免了回溯。这组数据也是教材中说明 KMP 优越性的标准反例，建议记住。","blocks":[]},{"chapter":4,"chapterTitle":"第4章 串","type":"short","typeTitle":"简答与计算分析题","no":"4.21","stem":"试比较串的三种存储表示（定长顺序存储、堆分配存储、块链存储）的优缺点。","options":[],"code":"","answer":"比较如下。","explanation":"[BLOCK:0]\n选择依据主要是三点。若串长可预估且操作以\"取子串、比较\"为主，定长顺序存储最划算，因为随机访问和连续比较的常数因子最小。若串长变化大、需要频繁拼接，堆分配存储更合适，Concat、SubString 都可直接申请新空间，且与 C 语言的 malloc、strcpy 语义贴合，是实际系统中最常用的方式。若串极长（如文本编辑器的文档缓冲区）且需要频繁在中间插删，块链存储可避免整体搬移，代价是访问变慢。\n值得补充的是，教材中对\"串\"的抽象定义允许串含任意字符，而 C 语言的以 '\\0' 结尾的实现限制了字符集，这是抽象定义与具体实现之间的差异，编程时应以具体语言的约定为准。","blocks":[{"type":"table","rows":[["存储方式","结构特点","优点","缺点"],["定长顺序存储","用定长数组存放，另设 length 记录串长","实现简单，随机访问第 i 个字符为 O(1)","串长受 MAXSTRLEN 限制，超出部分被截断；空间固定，易浪费"],["堆分配存储","按实际串长动态申请连续空间，用指针指向首址","串长不受限，空间按需分配，无截断","需手动管理内存；插入字符可能触发 realloc 与整体搬迁"],["块链存储","分成若干块，每块一结点，用单链表连接","插入删除灵活，不需连续空间，便于分块处理","存储密度低（指针开销），随机访问需 O(n/块大小) 跳转，实现复杂"]]}]},{"chapter":4,"chapterTitle":"第4章 串","type":"algo","typeTitle":"算法设计题","no":"4.22","stem":"试以定长顺序存储实现串的赋值、求长、连接与求子串四个基本操作。","options":[],"code":"","answer":"以 SString 结构（字符数组 + 长度）承载，各操作按下述约定处理越界。","explanation":"定长顺序存储的关键在于\"越界时如何截断\"：连接操作若总长超过 MAXSTRLEN，按教材约定返回 ERROR（也可约定为截断并返回 ERROR 以外的状态以提示未截断成功）；求子串若参数越界，返回空串或 ERROR。这些约定必须与调用方一致，否则会出现\"看似成功实则丢数据\"的隐蔽错误。\n[BLOCK:0]\n四个操作的时间复杂度分别为 O(n)、O(1)、O(m+n)、O(len)，除连接需按三种情形分别处理外，其余无特殊技巧。0 号单元存长度是教材的经典约定，好处是求长为 O(1)（无须像 C 字符串那样扫描到 '\\0'），且长度上限为 255 时用一个字节即可表示。","blocks":[{"type":"code","text":"#define MAXSTRLEN 255\ntypedef unsigned char SString[MAXSTRLEN + 1];   /* 0 号单元存长度 */\n\nStatus StrAssign(SString T, char *chars) {\n    int i;\n    for (i = 0; chars[i] != '\\0' && i < MAXSTRLEN; i++)\n        T[i + 1] = chars[i];\n    T[0] = i;\n    return OK;\n}\n\nint StrLength(SString S) { return S[0]; }\n\nStatus Concat(SString T, SString S1, SString S2) {\n    int i;\n    if (S1[0] + S2[0] <= MAXSTRLEN) {          /* 未超出 */\n        for (i = 1; i <= S1[0]; i++) T[i] = S1[i];\n        for (i = 1; i <= S2[0]; i++) T[S1[0] + i] = S2[i];\n        T[0] = S1[0] + S2[0];\n        return OK;\n    } else if (S1[0] < MAXSTRLEN) {            /* S2 部分截断 */\n        for (i = 1; i <= S1[0]; i++) T[i] = S1[i];\n        for (i = 1; i <= MAXSTRLEN - S1[0]; i++) T[S1[0] + i] = S2[i];\n        T[0] = MAXSTRLEN;\n        return ERROR;\n    } else {                                    /* S1 已满，S2 全部舍弃 */\n        for (i = 1; i <= MAXSTRLEN; i++) T[i] = S1[i];\n        T[0] = MAXSTRLEN;\n        return ERROR;\n    }\n}\n\nStatus SubString(SString Sub, SString S, int pos, int len) {\n    int i;\n    if (pos < 1 || pos > S[0] || len < 0 || pos + len - 1 > S[0])\n        return ERROR;\n    for (i = 1; i <= len; i++) Sub[i] = S[pos + i - 1];\n    Sub[0] = len;\n    return OK;\n}"}]},{"chapter":4,"chapterTitle":"第4章 串","type":"algo","typeTitle":"算法设计题","no":"4.23","stem":"试设计算法，实现朴素的模式匹配（BF 算法），返回模式串在主串中第一次出现的位置。","options":[],"code":"","answer":"双指针回溯法，失配时主串指针回退到本趟起点的下一位。","explanation":"设主串 S 与模式串 T 均以 0 号单元存长度、字符从 1 号开始。用 i 指示主串、j 指示模式串，初始 i=pos、j=1。匹配成功则 i、j 同时后移；失配则 i 回退到 i−j+2（本趟起点的下一位）、j 重置为 1。当 j > T[0] 时全部匹配成功，返回 i−T[0]；当 i > S[0] 时说明主串已扫描完毕，返回 0 表示失败。\n[BLOCK:0]\n时间复杂度：最好 O(m)（首趟即匹配），最坏 O(n×m)，平均约为 O(n+m)（在随机文本上）。空间 O(1)。回退公式 i = i − j + 2 的推导：本趟的起始位置是 i−j+1，故下一趟起点为 i−j+2。这个式子务必记牢，写错一位就会漏掉或重复比较，导致结果错误。","blocks":[{"type":"code","text":"int Index_BF(SString S, SString T, int pos) {\n    int i = pos, j = 1;\n    while (i <= S[0] && j <= T[0]) {\n        if (S[i] == T[j]) { i++; j++; }        /* 继续比较后继字符 */\n        else { i = i - j + 2; j = 1; }         /* 指针回退，重新开始 */\n    }\n    if (j > T[0]) return i - T[0];             /* 匹配成功 */\n    return 0;                                  /* 失败 */\n}"}]},{"chapter":4,"chapterTitle":"第4章 串","type":"algo","typeTitle":"算法设计题","no":"4.24","stem":"试设计算法，计算模式串的 next 数组，并在此基础上实现 KMP 匹配。","options":[],"code":"","answer":"next 的求解本质是\"模式串与自身匹配\"，可用双指针递推实现。","explanation":"求 next 时，把模式串同时当作\"主串\"与\"模式串\"：i 指示主串位置（即当前正在求 next 的位置），j 指示前缀长度。若 p[i]==p[j]，则最长相等前后缀长度加 1，next[i]=j+1，i、j 同时后移；若不等，则 j 回退到 next[j]，继续比较；若 j 回退到 0，说明无相等前后缀，next[i]=1，i 后移、j 置 1。\n[BLOCK:0]\nGetNext 的时间为 O(m)，Index_KMP 的时间为 O(n)，合计 O(n+m)；空间为 next 数组 O(m)。两处 j == 0 的判断不可省：它对应\"模式串首位也无法匹配，整体右移一位\"的情形，省略会导致死循环。","blocks":[{"type":"code","text":"void GetNext(SString T, int next[]) {\n    int i = 1, j = 0;\n    next[1] = 0;\n    while (i < T[0]) {\n        if (j == 0 || T[i] == T[j]) { i++; j++; next[i] = j; }\n        else j = next[j];                       /* 前缀回退 */\n    }\n}\n\nint Index_KMP(SString S, SString T, int pos) {\n    int next[MAXSTRLEN + 1];\n    int i = pos, j = 1;\n    GetNext(T, next);\n    while (i <= S[0] && j <= T[0]) {\n        if (j == 0 || S[i] == T[j]) { i++; j++; }\n        else j = next[j];                       /* 主串指针不回退 */\n    }\n    if (j > T[0]) return i - T[0];\n    return 0;\n}"}]},{"chapter":4,"chapterTitle":"第4章 串","type":"algo","typeTitle":"算法设计题","no":"4.25","stem":"试设计算法，统计串 S 中每个字符出现的次数，并删除 S 中所有值为 c 的字符（就地完成）。","options":[],"code":"","answer":"统计用计数数组（按字符集大小定长）；删除用\"读写双指针\"就地覆盖。","explanation":"统计部分：开辟大小为字符集长度（如 256）的计数数组并清零，遍历串一次，以字符的编码值为下标累加，时间 O(n)，空间 O(字符集大小)，与串长无关，属常数空间。\n删除部分：设读指针 i 与写指针 k，初值均为 1。i 逐位扫描，若 S[i] != c，则把 S[i] 写到 S[k] 并令 k 加一；否则跳过。扫描结束后令 S[0] = k−1 更新长度。这样一趟完成，未删除的字符按原相对次序前移，时间 O(n)，空间 O(1)，是典型的\"就地删除\"范式。\n[BLOCK:0]\n两个算法均为 O(n) 时间。删除算法中 k 永远不超过 i，故覆盖不会破坏尚未读取的字符——这是\"就地删除\"能够成立的关键，也是与\"逆置\"类算法在指针推进方向上的重要区别。","blocks":[{"type":"code","text":"void CharCount(SString S, int cnt[]) {\n    int i;\n    for (i = 0; i < 256; i++) cnt[i] = 0;\n    for (i = 1; i <= S[0]; i++) cnt[(unsigned char)S[i]]++;\n}\n\nvoid DeleteChar(SString S, char c) {\n    int i, k = 1;\n    for (i = 1; i <= S[0]; i++)\n        if (S[i] != c) S[k++] = S[i];\n    S[0] = k - 1;\n}"}]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"choice","typeTitle":"选择题","no":"5.1","stem":"设二维数组 A[1..10][1..20] 按行优先顺序存储，每个元素占 4 个字节，A[1][1] 的存储地址为 1000，则 A[5][10] 的存储地址为（　）。","options":[{"key":"A","text":"1336"},{"key":"B","text":"1356"},{"key":"C","text":"1376"},{"key":"D","text":"1396"}],"code":"","answer":"B","explanation":"按行优先存储时，元素按\"行号递增、行内列号递增\"的次序排成一列，A[i][j] 之前共有 (i−1) 个完整行与 (j−1) 个同行元素，故\nLOC(A[i][j]) = LOC(A[1][1]) + [(i−1)×n + (j−1)]×L\n其中 n 为每行的列数（本题 n=20），L 为每个元素的字节数。代入 i=5、j=10 得偏移量为 [(5−1)×20 + (10−1)]×4 = (80+9)×4 = 356，故地址为 1000+356 = 1356，选 B。\n三个常见错算：把 n 误取为行数 10（得 1000+(4×10+9)×4=1196）；忘记减 1（得 (5×20+10)×4=440，地址 1440）；按列优先计算（得 (9×10+4)×4=376，地址 1376，即 C 项）。C 项正是列优先的结果，是本题设置的主要干扰项。","blocks":[],"answerKey":"B"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"choice","typeTitle":"选择题","no":"5.2","stem":"将 n 阶对称矩阵压缩存储，只存下三角部分（含主对角线），所需存储单元个数为（　）。","options":[{"key":"A","text":"n²"},{"key":"B","text":"n(n+1)/2"},{"key":"C","text":"n(n−1)/2"},{"key":"D","text":"n(n+1)"}],"code":"","answer":"B","explanation":"对称矩阵满足 a_ij = a_ji，因此只需存储其中一半。下三角部分（含对角线）的元素个数为 1+2+…+n = n(n+1)/2，这正是所需单元数，可节省近一半空间。\nC 项 n(n−1)/2 是\"不含主对角线\"的下三角元素个数；D 项 n(n+1) 是把上下三角都算了一遍；A 项 n² 是未压缩时的元素总数。与之类似，n 阶上三角矩阵（含对角线）同样需 n(n+1)/2 个单元，而严格上三角（不含对角线）需 n(n−1)/2 个。本题答案为 B。","blocks":[],"answerKey":"B"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"choice","typeTitle":"选择题","no":"5.3","stem":"稀疏矩阵常用的两种压缩存储表示是（　）。","options":[{"key":"A","text":"三元组表和十字链表"},{"key":"B","text":"顺序表和链表"},{"key":"C","text":"邻接矩阵和邻接表"},{"key":"D","text":"二叉链表和三叉链表"}],"code":"","answer":"A","explanation":"稀疏矩阵的非零元素很少且分布无规律，若按二维数组存储，绝大部分空间被零占据，浪费严重。压缩存储的思路是\"只存非零元素及其位置\"，基本方法有三元组表示：把每个非零元素记为 (行号, 列号, 值)，所有三元组按行优先次序排成顺序表，即三元组顺序表；当需要按行或按列灵活插入删除时，改用十字链表——每个非零元素结点同时挂在所在行链表与所在列链表上，行、列各设头结点数组。\nB 项过于笼统，未指出具体结构；C 项是图的存储结构；D 项是树的存储结构，均不属于矩阵压缩。故答案为 A。","blocks":[],"answerKey":"A"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"choice","typeTitle":"选择题","no":"5.4","stem":"广义表 L = (a, (b, c), (d)) 的长度和深度分别为（　）。","options":[{"key":"A","text":"3 和 2"},{"key":"B","text":"3 和 3"},{"key":"C","text":"2 和 3"},{"key":"D","text":"4 和 2"}],"code":"","answer":"A","explanation":"长度指最外层元素的个数（每个元素无论是原子还是子表都计为 1 个），L 的最外层有 a、(b,c)、(d) 三个元素，故长度为 3。深度指括号的最大嵌套层数，规定原子的深度为 0、空表的深度为 1；子表 (b,c) 与 (d) 的深度均为 1+0 = 1，故 L 的深度为 1+1 = 2。\n注意区分长度与深度的计量对象：长度只看\"最外层有几个元素\"，不关心元素内部；深度只看\"括号套了几层\"，与元素个数无关。B 项把元素个数误当作深度，C 项把最外层元素数错算为 2，D 项把子表内部元素也计入长度。故答案为 A。","blocks":[],"answerKey":"A"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"choice","typeTitle":"选择题","no":"5.5","stem":"已知广义表 L = ((a, b), (c, d))，则 Head(L) 与 Tail(L) 分别为（　）。","options":[{"key":"A","text":"(a, b) 与 ((c, d))"},{"key":"B","text":"a 与 ((c, d))"},{"key":"C","text":"(a, b) 与 (c, d)"},{"key":"D","text":"a 与 (c, d)"}],"code":"","answer":"A","explanation":"Head 取广义表的第一个元素，该元素可以是原子也可以是子表，原样取出而不拆开。L 的第一个元素是子表 (a,b)，故 Head(L) = (a,b)。Tail 取\"去掉表头后剩余元素组成的表\"，注意结果必定是一个表（即使只剩一个元素，也要用括号括起来），故 Tail(L) = ((c,d))，这是一个长度为 1、唯一的元素是子表 (c,d) 的广义表。\nB 项的错误在于把 Head 拆到了原子层，Head 只取一层，不递归；D 项的错误在于 Tail 丢掉了外层括号，把\"表\"写成了\"子表\"。记忆要点：Head 可以取出原子或子表，Tail 的结果永远是表。故答案为 A。","blocks":[],"answerKey":"A"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"choice","typeTitle":"选择题","no":"5.6","stem":"二维数组 A[10][20]（两维下标均从 0 开始）所含元素个数为（　）。","options":[{"key":"A","text":"30"},{"key":"B","text":"200"},{"key":"C","text":"190"},{"key":"D","text":"20"}],"code":"","answer":"B","explanation":"下标从 0 开始时，A[0..9][0..19] 的第一维取值 0 至 9 共 10 个，第二维取值 0 至 19 共 20 个，元素总数为 10×20 = 200。\n若写成 A[10][20] 而按\"1 至 10、1 至 20\"理解，元素个数同样是 200，容易掩盖错误；但在地址计算时两种约定的公式不同，必须看清题目给出的下界。A 项 30 是把维长相加；C 项 190 是误按 10×19 计算；D 项 20 只取了第二维。故答案为 B。","blocks":[],"answerKey":"B"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"choice","typeTitle":"选择题","no":"5.7","stem":"设 n 阶对称矩阵 A 的下三角（含主对角线）按行优先存入一维数组 B[0..]，则元素 a_ij（i≥j，下标从 1 开始）在 B 中的下标为（　）。","options":[{"key":"A","text":"i(i−1)/2 + j − 1"},{"key":"B","text":"j(j−1)/2 + i − 1"},{"key":"C","text":"i(i+1)/2 + j"},{"key":"D","text":"i×n + j"}],"code":"","answer":"A","explanation":"按行优先存储下三角时，a_ij 之前有完整的 i−1 行，第 1 行 1 个、第 2 行 2 个、……、第 i−1 行 i−1 个，共 1+2+…+(i−1) = i(i−1)/2 个元素；在本行中，a_ij 之前还有 j−1 个元素。由于数组下标从 0 开始，故 k = i(i−1)/2 + (j−1) = i(i−1)/2 + j − 1，选 A。\n校验：a₁₁ 得 k=0（第一个元素），a₂₁ 得 k=1，a₂₂ 得 k=2，a₃₃ 得 k=5，与\"按行排列\"的实际次序一致。B 项是\"按列优先\"或\"用上三角公式\"的结果；C 项是上三角按行优先的公式形态，且缺少减 1；D 项是未压缩时的行优先地址。当 i<j 时，利用对称性取 a_ji，代入同一公式即可。","blocks":[],"answerKey":"A"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"choice","typeTitle":"选择题","no":"5.8","stem":"十字链表适用于存储（　）。","options":[{"key":"A","text":"稀疏矩阵"},{"key":"B","text":"对称矩阵"},{"key":"C","text":"三角矩阵"},{"key":"D","text":"三对角矩阵"}],"code":"","answer":"A","explanation":"十字链表的每个非零元素结点含五个域：行下标、列下标、值、指向同列下一元素的指针（down）、指向同行下一元素的指针（right）；另设两个头指针数组，分别指向各行的第一个非零元素与各列的第一个非零元素。这样既能按行遍历，也能按列遍历，且插入、删除非零元素只需修改指针，不必像三元组顺序表那样搬移数据。\n对称矩阵、三角矩阵、三对角矩阵的非零元素分布有规律，用下标公式即可压缩到一维数组，无须链式结构；只有稀疏矩阵的非零元素位置无规律且数量动态变化，才需要十字链表。故答案为 A。","blocks":[],"answerKey":"A"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"choice","typeTitle":"选择题","no":"5.9","stem":"下列关于数组的叙述中，错误的是（　）。","options":[{"key":"A","text":"数组可视为线性表的推广"},{"key":"B","text":"二维数组可看成每个元素又是线性表的线性表"},{"key":"C","text":"数组只能采用顺序存储结构"},{"key":"D","text":"数组一旦建立，其维数与各维的长度不再改变"}],"code":"","answer":"C","explanation":"数组的逻辑结构可以递归地定义：一维数组是线性表；二维数组可视为每个元素本身又是一个一维数组的线性表，故 A、B 正确。数组的维数与维界在建立时确定，之后不再改变，其运算只有存取元素与修改元素，没有插入与删除——正因为\"结构静态\"，数组才能用公式直接计算元素地址，D 正确。\nC 项错误：数组同样可以用链式方式存储，例如用单链表按行优先次序依次链接所有元素。只是链式存储会丧失随机存取能力，地址无法计算，访问第 k 个元素需 O(k) 时间，因此实际几乎不用。故答案为 C。","blocks":[],"answerKey":"C"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"choice","typeTitle":"选择题","no":"5.10","stem":"广义表的表头 Head 可以是（　）。","options":[{"key":"A","text":"只能是原子"},{"key":"B","text":"只能是子表"},{"key":"C","text":"可以是原子，也可以是子表"},{"key":"D","text":"只能是空表"}],"code":"","answer":"C","explanation":"广义表 LS = (α₁, α₂, …, αₙ) 中，每个 αᵢ 既可以是单个元素（原子），也可以是一个子表，因此表头作为 α₁ 自然可以是二者之一。例如 L₁ = (a, (b,c)) 的 Head 为原子 a，而 L₂ = ((a,b), c) 的 Head 为子表 (a,b)。\n与之相对，表尾 Tail 的结果必定是广义表——这一点常被用来出判断题。此外，空表 () 没有表头也没有表尾，对其求 Head 或 Tail 属非法操作，实现时应返回错误状态而非空值。故答案为 C。","blocks":[],"answerKey":"C"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"blank","typeTitle":"填空题","no":"5.11","stem":"二维数组 A[m][n]（下标从 0 开始）按行优先顺序存储，每个元素占 L 个字节，A[0][0] 的地址为 LOC，则 A[i][j] 的地址为________。","options":[],"code":"","answer":"LOC + (i×n + j)×L","explanation":"按行优先时，A[i][j] 之前有 i 个完整行（每行 n 个元素）与本行中的 j 个元素，共 i×n+j 个元素，乘以每个元素的字节数即为偏移量。若改为按列优先，则 A[i][j] 之前有 j 个完整列（每列 m 个元素）与本列中的 i 个元素，地址为 LOC + (j×m + i)×L。\n两个公式的差别只在于\"先数完哪个方向\"，但一旦记混，结果会相差很大。记忆方法：行优先时行号的系数是\"每行元素个数 n\"，列优先时列号的系数是\"每列元素个数 m\"。若下标从 1 开始，把上式中的 i、j 分别替换为 i−1、j−1 即可。","blocks":[],"blanks":1,"answerParts":["LOC + (i×n + j)×L"]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"blank","typeTitle":"填空题","no":"5.12","stem":"将 n 阶对称矩阵 A 压缩存储，只存下三角（含主对角线），共需________个存储单元；此时 a_ij（i<j）的值应取________。","options":[],"code":"","answer":"n(n+1)/2；a_ji","explanation":"下三角（含对角线）的元素个数为 1+2+…+n = n(n+1)/2。压缩存储只保留这一半，上三角的元素不再单独存放，访问 a_ij（i<j）时利用对称性转为访问 a_ji（此时 j<i，落在下三角内），代入下标公式即可。\n这一做法的前提是严格对称，即 a_ij = a_ji 对所有 i、j 成立。若矩阵只是\"三角矩阵\"而非对称矩阵（上三角元素全为常数 c），则压缩时另需一个单元存放该常数，访问上三角元素时直接返回 c，不能套用对称矩阵的做法——这是两类压缩存储的关键区别。","blocks":[],"blanks":2,"answerParts":["n(n+1)/2","a_ji"]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"blank","typeTitle":"填空题","no":"5.13","stem":"广义表的深度是指________；并规定原子的深度为________，空表的深度为________。","options":[],"code":"","answer":"广义表展开后括号的最大嵌套层数；0；1","explanation":"深度的递归定义为：若广义表为空表，深度为 1；若广义表非空，则深度等于其各元素深度的最大值加 1，其中原子的深度为 0。例如 (a,(b,c)) 的深度为 1+max(0,1) = 2；((a)) 的深度为 3；() 的深度为 1。\n\"原子深度为 0、空表深度为 1\"这两条约定必须记住，否则递归的基准情形会写错。求深度的算法正是该定义的直接翻译：遍历各元素，遇原子取 0、遇子表递归求深度，取最大值后加 1。","blocks":[],"blanks":3,"answerParts":["广义表展开后括号的最大嵌套层数","0","1"]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"blank","typeTitle":"填空题","no":"5.14","stem":"稀疏矩阵的三元组 (i, j, a_ij) 中，i 与 j 分别表示该非零元素所在的________与________。","options":[],"code":"","answer":"行号；列号","explanation":"三元组把非零元素的\"位置\"与\"值\"一并记录，从而在丢失二维数组结构的情况下仍能还原矩阵。所有三元组通常按行优先（行号小的在前，同行则列号小的在前）排成一个顺序表，这种有序性对矩阵转置、相加等运算至关重要——转置时若三元组无序，就必须先排序，代价由 O(列数+非零元数) 升至 O(非零元数×log)。\n此外，三元组顺序表还需记录矩阵的总行数、总列数与非零元素个数，否则无法确定矩阵的规模，也无法在转置时分配空间。","blocks":[],"blanks":2,"answerParts":["行号","列号"]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"blank","typeTitle":"填空题","no":"5.15","stem":"广义表 L = (a, (b, c)) 的长度为________，深度为________，Tail(L) 为________。","options":[],"code":"","answer":"2；2；((b, c))","explanation":"最外层元素为 a 与 (b,c)，共 2 个，故长度为 2。a 的深度为 0，(b,c) 的深度为 1，取最大值加 1 得 2，故深度为 2。Tail 去掉表头 a 后，剩余元素 (b,c) 组成一个表，即 ((b,c))——注意外层必须再加一对括号，因为 Tail 的结果是广义表而非子表。\n若继续运算，Head(Tail(L)) = (b,c)，Tail(Tail(L)) = ()。这类复合运算在考试中经常出现，做法是从内向外逐步化简，每步都明确结果\"是原子还是表\"。","blocks":[],"blanks":3,"answerParts":["2","2","((b, c))"]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"judge","typeTitle":"判断题","no":"5.16","stem":"数组是一种非线性结构。（　）","options":[],"code":"","answer":"×","explanation":"数组的逻辑结构仍是线性的：一维数组就是线性表；二维数组可以看成\"每个元素又是一个线性表的线性表\"，其元素之间的次序关系由下标唯一确定，不存在一对多或多对多的关系。因此数组属于线性结构（准确说是线性表的推广）。\n容易混淆的是\"多维\"与\"非线性\"两个概念：维数增加只是把线性关系嵌套了若干层，并未改变元素之间\"有唯一前驱与后继\"的性质；而树、图之所以是非线性结构，是因为一个元素可以对应多个后继。判断题中若把\"多维数组\"当作非线性结构，即属概念混淆。","blocks":[],"answerKey":"F"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"judge","typeTitle":"判断题","no":"5.17","stem":"稀疏矩阵经压缩存储后，仍能像二维数组一样随机存取任一元素。（　）","options":[],"code":"","answer":"×","explanation":"压缩存储以\"丢失位置信息\"为代价换取空间：三元组顺序表只记录非零元素的位置与值，要访问任意元素 a_ij，必须先在三元组表中查找，而查找需顺序扫描或折半查找，时间为 O(非零元数) 或 O(log(非零元数))，不再具备 O(1) 的随机存取能力。\n若采用十字链表，虽然可以按行或按列较快地定位，但仍需沿着链表跳转，同样不是随机存取。这是\"空间与时间\"权衡的典型例证：压缩存储节省了空间，代价是访问效率下降。若应用以随机存取为主而矩阵又确实稀疏，通常宁可选择不压缩，或采用\"行索引 + 三元组\"的折中方案。","blocks":[],"answerKey":"F"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"judge","typeTitle":"判断题","no":"5.18","stem":"广义表可以是其自身的一个子表。（　）","options":[],"code":"","answer":"√","explanation":"广义表的定义允许递归，即允许多个广义表共享同一子表，也允许广义表包含自身。经典例子是 L = (a, L)，其展开形式为 (a,(a,(a,…)))，是一个无限表。这类表称为递归表，在逻辑上合法，但深度为无穷大，实际实现时用指针引用实现共享（而非真正展开），因此不会耗尽空间。\n递归表的存在说明\"广义表\"比\"树\"更一般：树不允许结点指向祖先，而广义表通过共享与自引用可以获得图甚至无穷结构。不过教材中的多数算法（如求深度）需对递归表作特殊说明，否则会陷入无限递归。","blocks":[],"answerKey":"T"},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"short","typeTitle":"简答与计算分析题","no":"5.19","stem":"设二维数组 A[1..8][1..6] 按列优先顺序存储，每个元素占 2 个字节，A[1][1] 的地址为 1000。求 A[6][4] 的存储地址，并说明若改为按行优先存储，结果如何变化。","options":[],"code":"","answer":"按列优先为 1058；按行优先为 1066。","explanation":"按列优先时，A[i][j] 之前有 j−1 个完整列（每列 8 个元素）与本列中的 i−1 个元素，故\nLOC(A[i][j]) = LOC(A[1][1]) + [(j−1)×m + (i−1)]×L\n其中 m 为行数（本题 m=8，即每列元素个数）。代入 i=6、j=4、L=2，得偏移量 [(4−1)×8 + (6−1)]×2 = (24+5)×2 = 58，故地址为 1000+58 = 1058。\n若改为按行优先，则 A[i][j] 之前有 i−1 个完整行（每行 6 个元素）与 j−1 个同行元素，偏移量为 [(6−1)×6 + (4−1)]×2 = (30+3)×2 = 66，地址为 1000+66 = 1066。\n两种次序下同一元素的地址并不相同，这说明\"存储次序\"是地址计算的前提。答题时必须先明确题目采用哪种次序，再写出公式代值，不要凭直觉相加：本题中列优先的偏移为 58、行优先为 66，差异虽小，但矩阵规模一大，误差会成倍放大。","blocks":[]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"short","typeTitle":"简答与计算分析题","no":"5.20","stem":"试比较稀疏矩阵的两种压缩存储表示（三元组顺序表与十字链表），并说明各自的适用场合。","options":[],"code":"","answer":"比较如下。","explanation":"[BLOCK:0]\n选择依据是运算的类型。若矩阵建立后不再变动，只需进行转置、相加、相乘等批量运算，三元组顺序表最合适——它空间开销小、缓存友好，且转置可用\"快速转置\"算法在 O(列数+非零元数) 时间内完成。\n若矩阵的非零元素会频繁增删（如有限元分析中逐步组装的刚度矩阵、稀疏矩阵求解过程中的消元），必须用十字链表，否则每次插删都要 O(非零元数) 的搬移代价，整体不可接受。\n值得强调的是，\"压缩存储\"并不等于\"高效访问\"。三元组与十字链表都放弃了 O(1) 的随机存取，这是节省空间的必然代价；而对称矩阵、三角矩阵的压缩之所以仍能 O(1) 访问，是因为它们的非零元素分布有规律、位置可由公式算出，这一点与稀疏矩阵本质不同。","blocks":[{"type":"table","rows":[["比较项","三元组顺序表","十字链表"],["存储形式","顺序存储，按行优先排列 (i, j, value)","链式存储，结点同时挂入行链与列链"],["随机访问","不能，需顺序或折半查找","不能，需沿链跳转"],["按行遍历","快，天然有序","快，沿行链即可"],["按列遍历","慢，需重新排序或扫描全表","快，沿列链即可"],["插入、删除非零元","慢，需搬移其后所有三元组","快，仅修改指针"],["空间开销","每个非零元 3 个域，无指针开销","每个结点 5 个域，另有行列头指针数组"],["实现难度","简单","较复杂"]]}]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"short","typeTitle":"简答与计算分析题","no":"5.21","stem":"设广义表 L = ((a, b), c, (d, (e)))，求 L 的长度、深度以及 Head(L)、Tail(L)、Head(Tail(L))、Tail(Tail(L)) 的值。","options":[],"code":"","answer":"长度 3，深度 3；Head(L) = (a,b)，Tail(L) = (c, (d,(e)))，Head(Tail(L)) = c，Tail(Tail(L)) = ((d,(e)))。","explanation":"长度看最外层元素个数：(a,b)、c、(d,(e)) 共 3 个，故长度为 3。\n深度按递归定义计算：元素 (a,b) 的深度为 1+0 = 1；原子 c 的深度为 0；元素 (d,(e)) 的深度为 1+max(0, 深度((e)))，而 (e) 的深度为 1+0 = 1，故 (d,(e)) 的深度为 1+1 = 2。三者取最大值 2，再加 1，得 L 的深度为 3。\nHead(L) 取第一个元素，原样取出，为子表 (a,b)。Tail(L) 去掉表头后，剩余元素 c 与 (d,(e)) 组成表，为 (c, (d,(e)))。\nHead(Tail(L))：先算 Tail(L) = (c, (d,(e)))，再取其第一个元素，得原子 c。Tail(Tail(L))：对 (c, (d,(e))) 去掉表头 c，剩余元素 (d,(e)) 组成表，得 ((d,(e)))。\n四个结果中，凡 Tail 的结果都是表（带外层括号），凡 Head 的结果可能是原子也可能是子表——这一规律可用于自查。","blocks":[]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"algo","typeTitle":"算法设计题","no":"5.22","stem":"设稀疏矩阵以三元组顺序表存储（按行优先有序）。试设计算法实现矩阵的快速转置，要求时间复杂度为 O(列数 + 非零元数)。","options":[],"code":"","answer":"先统计每列的非零元个数，再累加求出每列第一个非零元在转置结果中的位置，最后一趟扫描直接归位。","explanation":"普通转置的思路是\"按列扫描原矩阵\"，需对每一列扫描全部三元组，时间 O(列数×非零元数)，当列数较大时不可接受。快速转置的关键在于\"预知位置\"：转置后，原矩阵第 j 列的元素变成第 j 行，而三元组仍按行优先排列，因此原矩阵第 j 列的所有非零元在结果中必然连续存放。只要预先算出每一列的第一个非零元应放的位置，就能一趟扫描直接归位。\n具体分三步。第一步，扫描三元组表，用数组 num[j] 统计原矩阵第 j 列的非零元个数。第二步，用 cpot[j] 表示第 j 列第一个非零元在转置结果中的下标，递推得 cpot[1]=1，cpot[j]=cpot[j−1]+num[j−1]。第三步，再扫描一遍三元组表，对每个三元组 (i,j,v)，把它放到结果表的 cpot[j] 位置，并使 cpot[j] 加一（为同列的下一个元素让位）。\n[BLOCK:0]\n时间 O(列数 + 非零元数)，空间 O(列数)，均优于普通转置的 O(列数×非零元数)。三处易错：一是 cpot 的起始值应为 1 而非 0（教材中三元组表下标从 1 开始）；二是 cpot[col]++ 不可漏，否则同列元素会互相覆盖；三是空矩阵需单独返回，否则 cpot[1] 的赋值会越界。","blocks":[{"type":"code","text":"#define MAXSIZE 1000\ntypedef struct { int i, j; ElemType e; } Triple;\ntypedef struct { Triple data[MAXSIZE + 1]; int mu, nu, tu; } TSMatrix;\n\nStatus FastTranspose(TSMatrix M, TSMatrix *T) {\n    int num[MAXSIZE], cpot[MAXSIZE], col, t, q;\n    T->mu = M.nu; T->nu = M.mu; T->tu = M.tu;\n    if (T->tu == 0) return OK;\n    for (col = 1; col <= M.nu; col++) num[col] = 0;\n    for (t = 1; t <= M.tu; t++) num[M.data[t].j]++;       /* 统计每列非零元个数 */\n    cpot[1] = 1;\n    for (col = 2; col <= M.nu; col++)\n        cpot[col] = cpot[col - 1] + num[col - 1];          /* 求每列首个元素的存放位置 */\n    for (t = 1; t <= M.tu; t++) {\n        col = M.data[t].j;\n        q = cpot[col];\n        T->data[q].i = M.data[t].j;                        /* 行列互换 */\n        T->data[q].j = M.data[t].i;\n        T->data[q].e = M.data[t].e;\n        cpot[col]++;\n    }\n    return OK;\n}"}]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"algo","typeTitle":"算法设计题","no":"5.23","stem":"设两个稀疏矩阵 A 与 B 均以三元组顺序表存储，且行、列数相同。试设计算法求 C = A + B。","options":[],"code":"","answer":"按行优先次序对两个三元组表做\"归并\"，行号相同再比较列号；列号相同则值相加，和为零则不存入。","explanation":"由于两个三元组表都按行优先有序，可以将它们视为两条有序链，用双指针 pa、pb 同步推进，比较 (i,j) 的次序：若 A 的当前元素位置在前，直接存入 C；若 B 的在前，存入 B 的元素；若位置相同，则值相加，若和为 0 则两指针同时后移、不产生新元素（这体现了稀疏矩阵\"零不存储\"的约定），否则存入和值。\n[BLOCK:0]\n时间 O(A.tu + B.tu)，空间 O(A.tu + B.tu)（结果表）。三个易错点：一是两处\"剩余部分\"的收尾循环不可漏，否则会丢元素；二是和为零时必须丢弃该元素，否则结果不再是标准的三元组表；三是行列数不一致时应返回错误，而非默默计算。","blocks":[{"type":"code","text":"Status AddTSMatrix(TSMatrix A, TSMatrix B, TSMatrix *C) {\n    if (A.mu != B.mu || A.nu != B.nu) return ERROR;\n    int pa = 1, pb = 1, pc = 0;\n    ElemType sum;\n    while (pa <= A.tu && pb <= B.tu) {\n        if (A.data[pa].i < B.data[pb].i ||\n           (A.data[pa].i == B.data[pb].i && A.data[pa].j < B.data[pb].j)) {\n            C->data[++pc] = A.data[pa++];\n        } else if (A.data[pa].i > B.data[pb].i ||\n                  (A.data[pa].i == B.data[pb].i && A.data[pa].j > B.data[pb].j)) {\n            C->data[++pc] = B.data[pb++];\n        } else {                                   /* 位置相同 */\n            sum = A.data[pa].e + B.data[pb].e;\n            if (sum != 0) {\n                C->data[++pc] = A.data[pa];\n                C->data[pc].e = sum;\n            }\n            pa++; pb++;\n        }\n    }\n    while (pa <= A.tu) C->data[++pc] = A.data[pa++];   /* 处理剩余部分 */\n    while (pb <= B.tu) C->data[++pc] = B.data[pb++];\n    C->mu = A.mu; C->nu = A.nu; C->tu = pc;\n    return OK;\n}"}]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"algo","typeTitle":"算法设计题","no":"5.24","stem":"设广义表采用\"头尾链表\"存储（每个结点含 tag 标志、原子值或子表指针）。试设计递归算法求广义表的深度。","options":[],"code":"","answer":"按定义递归：空表深度为 1，原子深度为 0，表的深度等于各元素深度的最大值加 1。","explanation":"头尾链表结构中，每个表结点含 hp（表头指针）与 tp（表尾指针）；原子结点的 tag 为 0，表结点的 tag 为 1。求深度的递归过程是：若指针为空，返回 1（空表）；若是原子，返回 0；若是表，则对表头求深度，再对表尾递归求深度，取二者较大值，最后加 1。注意表尾本身仍是一个表，因此对 tp 的递归调用返回的已是\"表尾的深度\"，无须再加 1。\n[BLOCK:0]\n时间 O(表中结点数)，空间 O(深度)（递归栈）。三个易错点：一是空表返回 1 而非 0，这与\"原子深度为 0\"共同构成递归的基准；二是遍历时沿 tp 逐层推进、对每层的 hp 递归，不能只算第一个元素；三是遇到递归表（自引用）会无限递归，实际系统需加访问标记或深度上限。","blocks":[{"type":"code","text":"typedef enum { ATOM, LIST } ElemTag;\ntypedef struct GLNode {\n    ElemTag tag;\n    union {\n        char atom;\n        struct { struct GLNode *hp, *tp; } ptr;\n    } un;\n} *GList;\n\nint GListDepth(GList L) {\n    int max = 0, dep;\n    GList p;\n    if (L == NULL) return 1;                   /* 空表深度为 1 */\n    if (L->tag == ATOM) return 0;              /* 原子深度为 0 */\n    for (p = L; p != NULL; p = p->un.ptr.tp) { /* 沿表尾指针遍历各元素 */\n        dep = GListDepth(p->un.ptr.hp);        /* 对表头递归求深度 */\n        if (dep > max) max = dep;\n    }\n    return max + 1;                            /* 各元素深度的最大值加 1 */\n}"}]},{"chapter":5,"chapterTitle":"第5章 数组和广义表","type":"algo","typeTitle":"算法设计题","no":"5.25","stem":"设 n 阶对称矩阵按行优先压缩存入一维数组 sa[0..n(n+1)/2−1]。试设计两个函数，分别实现\"由 (i, j) 求压缩下标 k\"与\"由压缩下标 k 反求 (i, j)\"，并实现元素的存取。","options":[],"code":"","answer":"正向映射 k = i(i−1)/2 + j − 1（i≥j 时）；反向映射先由 k 定出所在行 i，再算列 j。","explanation":"正向映射的推导见 5.7 题：k 等于前 i−1 行的元素总数 i(i−1)/2 加上本行内的偏移 j−1。当 i<j 时利用对称性交换 i、j 即可。\n反向映射稍复杂：给定 k，需要找出满足 i(i−1)/2 ≤ k < i(i+1)/2 的 i，即\"k 落在第 i 行\"。可直接用求根公式估算 i ≈ ⌈(√(8k+1)−1)/2⌉，再用循环校正；也可用简单的 while 循环递增 i，因 i 至多 n，代价可接受。确定 i 后，j = k − i(i−1)/2 + 1。\n[BLOCK:0]\nIndex 与 Get 为 O(1)，Locate 最坏 O(n)（可用开方估算降为 O(1)）。关键收益在于 Set：由于只存一份数据，修改 a_ij 时其对称位置 a_ji 自动同步，不会出现\"两侧不一致\"的错误——这正是对称矩阵压缩存储相对于\"存两份\"的额外好处。若把上三角元素也存下来，反而必须维护两处一致性，出错风险更大。","blocks":[{"type":"code","text":"typedef struct { ElemType sa[MAXLEN]; int n; } SymMatrix;\n\nint Index(int i, int j) {                      /* (i,j) -> k，下标从 1 开始 */\n    int t;\n    if (i < j) { t = i; i = j; j = t; }        /* 利用对称性 */\n    return i * (i - 1) / 2 + j - 1;\n}\n\nvoid Locate(int k, int *i, int *j) {           /* k -> (i,j) */\n    int row = 1;\n    while (k >= row * (row + 1) / 2) row++;    /* 找 k 所在的行 */\n    *i = row;\n    *j = k - row * (row - 1) / 2 + 1;\n}\n\nElemType Get(SymMatrix M, int i, int j) { return M.sa[Index(i, j)]; }\n\nvoid Set(SymMatrix *M, int i, int j, ElemType e) {\n    M->sa[Index(i, j)] = e;                    /* 对称位置自动同步 */\n}"}]},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随1","stem":"某系统通信时只出现 C、A、S、T、B 五种字符，出现频率依次为 2、4、2、3、3。试设计一组 Huffman 编码，并计算带权路径长度 WPL。","options":[],"answer":"一组可行编码：A=00，C=010，S=011，T=10，B=11；WPL=32。（Huffman 编码不唯一，左右子树交换会得到另一组同样优的编码。）","explanation":"合并过程：C(2)+S(2)=4；T(3)+B(3)=6；A(4)+4=8；6+8=14。按左 0 右 1 编号，得到 A=00，C=010，S=011，T=10，B=11。WPL=2×3+4×2+2×3+3×2+3×2=6+8+6+6+6=32。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随2","stem":"权值分别为 7、5、2、4 的四个叶子结点构造哈夫曼树，求最小的带权路径长度 WPL。","options":[],"answer":"WPL=35。","explanation":"先合并最小的 2 和 4 得 6；再合并 5 和 6 得 11；最后合并 7 和 11 得 18。四个叶子的深度分别为 1、2、3、3，WPL=7×1+5×2+2×3+4×3=7+10+6+12=35。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随3","stem":"画出下面二叉树对应的中序线索二叉树。树的结构：A 的左孩子是 B、右孩子是 C；B 的左孩子是 D、右孩子是 E；C 的左孩子是 F、右孩子是 G；D 的左孩子是 H、右孩子是 I。","options":[],"answer":"中序序列为 H、D、I、B、E、A、F、C、G。空指针线索为：H 的左指针指向前驱（头结点），H 的右指针指向 D；I 的左指针指向 D，右指针指向 B；E 的左指针指向 B，右指针指向 A；F 的左指针指向 A，右指针指向 C；G 的左指针指向 C，右指针指向后继（头结点）。其余左右孩子本来就不空的指针保持原样，并把对应标志位设为 0。","explanation":"中序遍历得到 H D I B E A F C G。线索化规则：结点没有左孩子时，左指针指向前驱；没有右孩子时，右指针指向后继。第一个结点 H 的前驱和最后一个结点 G 的后继都指向头结点。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随4","stem":"已知一棵二叉树的中序序列为 BDCEAFHG，后序序列为 DECBHGFA，请画出这棵二叉树。","options":[],"answer":"根结点是 A。A 的左孩子是 B，B 的右孩子是 C，C 的左孩子是 D、右孩子是 E；A 的右孩子是 F，F 的右孩子是 G，G 的左孩子是 H。","explanation":"后序最后一个是根 A。在中序中 A 左边是 BDCE，右边是 FHG。左子树后序为 DECB，根为 B；B 在中序中位于最前，说明 B 没有左子树，DCE 都属于 B 的右子树。右子树同理：F 为根，F 没有左子树，HG 在 F 右边，G 为根、H 为 G 的左孩子。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随5","stem":"用二叉树表示算术表达式，树的结构：根为 +，左孩子为 *，右孩子为 E；左 * 的左孩子为 *、右孩子为 D；下层 * 的左孩子为 /、右孩子为 C；/ 的左孩子为 A、右孩子为 B。写出该表达式的先序遍历序列。","options":[],"answer":"先序遍历序列：+ * * / A B C D E。","explanation":"先序遍历按“根、左、右”递归：先访问根 +，进入左子树访问 *，再访问下一层 *，再访问 /，然后 A、B；回溯访问 C、D；最后访问右子树的 E。对应的中缀表达式为 ((A/B)*C)*D+E。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"blank","typeTitle":"填空题","no":"随6","stem":"一棵完全二叉树有 5000 个结点，它的叶结点个数是____。","options":["2500"],"answer":"2500","explanation":"完全二叉树中，结点总数 n=5000 为偶数，所以度为 1 的结点只有 1 个；由 n=n0+n1+n2、n2=n0-1 可得 5000=n0+1+(n0-1)，解得 n0=2500。也可以直接记偶数个结点的完全二叉树叶子数为 n/2。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"blank","typeTitle":"填空题","no":"随7","stem":"具有 3 个结点的二叉树可能有____种不同形态，普通树有____种不同形态。","options":["5","2"],"answer":"5；2","explanation":"3 个结点的二叉树按 Catalan 数计算共有 C3=5 种形态。普通树的子女不分左右，3 个结点只有两种：三个结点连成一条链，或一个根带两个子女。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随8","stem":"广义表 A=(a,b,(c,d),(e,(f,g)))，求 GetHead(GetTail(GetHead(GetTail(GetTail(A)))))。","options":[],"answer":"结果是原子 d。","explanation":"Tail(A)=(b,(c,d),(e,(f,g)))；再取表尾得 ((c,d),(e,(f,g)))；取表头得 (c,d)；取表尾得 (d)；再取表头得到原子 d。注意 GetHead((d)) 取的是表中第一个元素 d，不是子表 (d)。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"blank","typeTitle":"填空题","no":"随9","stem":"设二维数组 A[10,20]，每个元素占 2 个字节，A[0][0] 的存储地址为 100。按行优先存储时 A[6][6] 的地址为____，按列优先存储时 A[6][6] 的地址为____。","options":["352","232"],"answer":"352；232","explanation":"按行优先：LOC(A[6][6])=100+(6×20+6)×2=100+126×2=352。按列优先：LOC(A[6][6])=100+(6×10+6)×2=100+66×2=232。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"blank","typeTitle":"填空题","no":"随10","stem":"设二维数组 A[m][n] 按行优先顺序存储，A[0][0] 的地址为 644，A[2][2] 的地址为 676，每个元素占 1 个存储单元。A[3][3] 的地址是____。","options":["692"],"answer":"692","explanation":"A[2][2] 相对 A[0][0] 的偏移量为 2n+2，所以 2n+2=676-644=32，解得 n=15。A[3][3] 的偏移量为 3×15+3=48，地址为 644+48=692。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随11","stem":"BF 算法分析中，S=aaaaaba，T=ba。每趟不成功的匹配都发生在 T 的第一个字符与 S 对应字符比较；若第 i 个位置匹配成功，共比较 (i-1+m) 次；假定每个位置上匹配成功的概率相等。求 p_i。","options":[],"answer":"p_i=1/(n-m+1)。本题 n=7、m=2，所以 p_i=1/6。","explanation":"模式串长度为 m，主串长度为 n，可能的起始位置共有 n-m+1 个。各位置匹配成功的概率相等，因此每个位置的成功概率 p_i=1/(n-m+1)。本题 7-2+1=6，故 p_i=1/6。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"blank","typeTitle":"填空题","no":"随12","stem":"主串 13 位，子串 3 位，BF 算法最多比较多少次才能完成匹配检查？____ 次。","options":["33"],"answer":"33","explanation":"BF 最多有 n-m+1=13-3+1=11 个起始位置，每个位置最坏比较 m=3 次，所以最多比较 11×3=33 次。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随13","stem":"写出循环队列的入队操作（元素 e 入队）。","options":[],"answer":"if((Q.rear+1)%MAXQSIZE==Q.front) return ERROR;  // 队满\nQ.base[Q.rear]=e;\nQ.rear=(Q.rear+1)%MAXQSIZE;\nreturn OK;","explanation":"循环队列用少用一个存储单元来区分队空和队满。队满条件是 (rear+1)%MAXQSIZE==front；队空条件是 front==rear。入队先判满，再把 e 放到 rear 位置，最后 rear 后移并取模。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随14","stem":"写出循环队列的出队操作，并说明队空、队满的判定条件。","options":[],"answer":"出队：if(Q.front==Q.rear) return ERROR;  // 队空\ne=Q.base[Q.front];\nQ.front=(Q.front+1)%MAXQSIZE;\nreturn OK;\n队空：front==rear；队满：(rear+1)%MAXQSIZE==front。","explanation":"出队先判断 front 和 rear 是否相等；不相等时取出 front 位置元素，再让 front 后移并取模。循环队列牺牲一个单元，因此队满不是 front==rear，而是 rear 再走一步就追上 front。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"choice","typeTitle":"选择题","no":"随15","stem":"设栈 S 和队列 Q 的初始状态为空，元素 e1、e2、e3、e4、e5、e6 依次通过栈 S，一个元素出栈后即进入队列 Q。若 6 个元素出队的序列是 e2、e4、e3、e6、e5、e1，则栈 S 的容量至少应该是（　）。","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"4"},{"key":"D","text":"6"}],"answer":"B. 3","explanation":"队列先进先出，所以出队序列就是出栈序列：2、4、3、6、5、1。模拟：入 1、2，出 2；入 3、4，出 4、3；此时栈内最多同时有 1、3、4 三个元素；再入 5、6，出 6、5，最后出 1。最大深度为 3。","blocks":[],"set":"exercise","auto":false,"answerKey":"B"},{"chapter":0,"chapterTitle":"随堂练习","type":"blank","typeTitle":"填空题","no":"随16","stem":"五阶汉诺塔从 A 柱移动到 C 柱，最少需要移动____次。","options":["31"],"answer":"31","explanation":"n 阶汉诺塔的最少移动次数为 2^n-1。五阶为 2^5-1=32-1=31 次。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"choice","typeTitle":"选择题","no":"随17","stem":"设递归算法 int X(int n){ if(n<=3) return 1; else return X(n-2)+X(n-4)+1; }，则计算 X(X(8)) 时共需要计算 X 函数（　）次。","options":[{"key":"A","text":"8"},{"key":"B","text":"9"},{"key":"C","text":"16"},{"key":"D","text":"18"}],"answer":"D. 18","explanation":"先算 X(8)：X(4)=X(2)+X(0)+1=3，X(6)=X(4)+X(2)+1=5，X(8)=X(6)+X(4)+1=9；计算 X(8) 共调用 9 次。再算 X(9)：X(5)=X(3)+X(1)+1=3，X(7)=X(5)+X(3)+1=5，X(9)=X(7)+X(5)+1=9，也需要 9 次。合计 9+9=18 次。","blocks":[],"set":"exercise","auto":false,"answerKey":"D"},{"chapter":0,"chapterTitle":"随堂练习","type":"blank","typeTitle":"填空题","no":"随18","stem":"a、b、c、d 依次入栈，可能得到的出栈序列共有____种。","options":["14"],"answer":"14","explanation":"4 个元素的合法出栈序列数为 Catalan 数 C4=14。全部为：abcd、abdc、acbd、acdb、adcb、bacd、badc、bcad、bcda、bdca、cbad、cbda、cdba、dcba。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随19","stem":"a、b、c、d、e 依次入栈，要求出栈序列以元素 c 打头，共有多少种可能？请全部写出。","options":[],"answer":"共 9 种：cbade、cbaed、cbdae、cbdea、cbeda、cdbae、cdbea、cdeba、cedba。","explanation":"要让 c 第一个出栈，必须先入 a、b、c，然后弹出 c，此时栈内从底到顶为 a、b。之后 d、e 可按合法栈操作穿插进出。枚举所有合法出栈序列并筛选首元素为 c，得到上述 9 种。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随20","stem":"a、b、c、d、e 依次入栈，要求出栈序列以元素 d 打头，共有多少种可能？请全部写出。","options":[],"answer":"共 4 种：dcbae、dcbea、dceba、decba。","explanation":"要让 d 第一个出栈，必须先入 a、b、c、d，再弹出 d，此时栈内从底到顶为 a、b、c。剩余 e 尚未入栈，在后续合适位置入栈并弹出。枚举合法序列并筛选首元素为 d，得到上述 4 种。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"choice","typeTitle":"选择题","no":"随21","stem":"若一个栈的入栈序列是 1、2、3、…、n，其输出序列为 p1、p2、…、pn。若 p1=n，则 pi 为（　）。","options":[{"key":"A","text":"i"},{"key":"B","text":"n-i"},{"key":"C","text":"n-i+1"},{"key":"D","text":"不确定"}],"answer":"C. n-i+1","explanation":"p1=n 说明先把 1 到 n 全部入栈，再依次弹出。栈顶先出 n，然后 n-1、n-2……所以第 i 个输出 pi=n-i+1。","blocks":[],"set":"exercise","auto":false,"answerKey":"C"},{"chapter":0,"chapterTitle":"随堂练习","type":"choice","typeTitle":"选择题","no":"随22","stem":"在一个具有 n 个单元的顺序栈中，假设以地址高端作为栈底，以 top 作为栈顶指针，则进栈时 top 的变化为（　）。","options":[{"key":"A","text":"top 不变"},{"key":"B","text":"top=0"},{"key":"C","text":"top++"},{"key":"D","text":"top--"}],"answer":"D. top--","explanation":"栈底在高地址，栈顶向低地址方向增长。进栈时先把元素放到 top 指向的位置，再让 top 向低地址移动，所以是 top--。","blocks":[],"set":"exercise","auto":false,"answerKey":"D"},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随23","stem":"如果栈的输入序列为 1、2、3、4、5、6，能否得到 435612 和 135426 的出栈序列？分别说明理由。","options":[],"answer":"435612 不能得到；135426 可以得到。","explanation":"435612：要第一个出 4，必须先入 1、2、3、4 后弹出 4，再弹出 3；此时栈顶是 2，5 还没入栈，必须先弹出 2 才能继续，所以 4、3 后面不可能直接接 5，序列不合法。135426：入 1 出 1；入 2、3 出 3；入 4、5 出 5、4；出 2；入 6 出 6，合法。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随24","stem":"写出顺序栈的进栈操作 Push(S,e)，要求包含栈满判断。","options":[],"answer":"if(S.top-S.base==S.stacksize) return ERROR;  // 栈满\n*S.top++=e;\nreturn OK;","explanation":"顺序栈用 top 指向栈顶元素的下一个位置。栈满条件是 top-base==stacksize。进栈时把 e 赋给 top 当前指向的位置，然后 top 加 1。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随25","stem":"约瑟夫问题：39 个犹太人与 Josephus 及他的朋友躲到一个洞中，41 个人围成圆圈，从第 1 个人开始报数，每报到第 3 个人就自杀，再由下一个人重新报数，直到所有人自杀身亡。Josephus 和他的朋友应站在哪两个位置才能最后存活？","options":[],"answer":"应站在第 16 位和第 31 位。","explanation":"这是步长为 3 的约瑟夫环。按 1 到 41 编号，每数到 3 删除一人，从下一人继续。依次删除后，最后剩下的两个位置是 16 和 31。可以用数组或循环链表模拟验证。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随26","stem":"在单链表上删除结点 a_i（p 指向 a_{i-1}，r 指向 a_i）。写出删除操作的关键语句，并说明各指针的变化。","options":[],"answer":"r=p->next;        // r 指向要删除的 a_i\np->next=r->next;  // 让 a_{i-1} 跳过 a_i，指向 a_{i+1}\nfree(r);          // 释放 a_i 结点","explanation":"删除单链表结点要先用 r 保存 a_i 的地址；再修改 p 的 next，使其指向 r 的 next，即 a_{i+1}；最后 free(r) 把结点归还存储池。顺序不能反，否则会丢失后继结点地址。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随27","stem":"顺序表删除元素的平均移动次数是多少？设表长为 n，删除第 i 个元素（1≤i≤n）。","options":[],"answer":"平均移动次数为 (n-1)/2。","explanation":"删除第 i 个元素需要把第 i+1 到第 n 个元素依次前移，移动次数为 n-i。对 i=1 到 n 求平均：[(n-1)+(n-2)+…+0]/n = n(n-1)/2/n = (n-1)/2。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随28","stem":"顺序表插入元素的平均移动次数是多少？设表长为 n，共有 n+1 个可插入位置。","options":[],"answer":"平均移动次数为 n/2。","explanation":"在最后一个元素之后插入不需要移动；在最前面插入要移动 n 个元素；一般位置移动次数从 n 递减到 0。平均为 [n+(n-1)+…+0]/(n+1)=n(n+1)/2/(n+1)=n/2。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随29","stem":"将一维数组 a 中的 n 个数逆序存放到原数组。算法 1 用临时变量 t 交换 a[i] 与 a[n-i-1]；算法 2 另开数组 b，先倒序复制到 b，再复制回 a。分别写出两个算法的空间复杂度。","options":[],"answer":"算法 1 的空间复杂度为 O(1)；算法 2 的空间复杂度为 O(n)。","explanation":"算法 1 只用了 i 和 t 两个辅助变量，辅助空间与 n 无关，是 O(1)。算法 2 额外开辟了长度为 n 的数组 b，辅助空间随 n 线性增长，是 O(n)。","blocks":[],"set":"exercise","auto":false},{"chapter":0,"chapterTitle":"随堂练习","type":"short","typeTitle":"简答计算题","no":"随30","stem":"求下列三重循环中语句 x=x+1 的语句频度，并写出时间复杂度：\nfor(i=1;i<=n;i++)\n  for(j=1;j<=i;j++)\n    for(k=1;k<=j;k++)\n      x=x+1;","options":[],"answer":"语句频度 = n(n+1)(n+2)/6；时间复杂度为 O(n^3)。","explanation":"最内层执行次数为 j；对 j=1..i 求和得 i(i+1)/2；再对 i=1..n 求和：Σ i(i+1)/2 = 1/2[Σi^2+Σi] = 1/2[n(n+1)(2n+1)/6+n(n+1)/2] = n(n+1)(n+2)/6。最高次为 n^3，所以时间复杂度 O(n^3)。","blocks":[],"set":"exercise","auto":false}],"appendix":[{"kind":"h1","text":"附录 常用公式与复杂度速查"},{"kind":"p","text":"下表汇总本册第1至5章反复用到的公式与结论，供做题时核对。"},{"kind":"table","rows":[["内容","公式／结论","备注"],["顺序表插入移动次数","n−i+1","第 i 个位置，1≤i≤n+1"],["顺序表插入平均移动","n/2","等概率"],["顺序表删除移动次数","n−i","删除第 i 个元素"],["顺序表删除平均移动","(n−1)/2","等概率"],["循环队列元素个数","(rear−front+MaxSize)%MaxSize","通用"],["循环队列判满（少用一单元）","(rear+1)%MaxSize==front","判空为 rear==front"],["n 个元素出栈序列数","(1/(n+1))·C(2n,n)","卡特兰数"],["串的非空子串数","n(n+1)/2","含空串再加 1"],["朴素匹配最坏比较次数","m(n−m+1)","即 O(nm)"],["KMP 时间复杂度","O(n const TYPE_ORDER = ['choice','blank','judge','short','algo'];

/* ---------------- 工具 ---------------- */
function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ toast('本地存储写入失败，可能是容量不足'); }
}
function shuffle(list){
  const a = list.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function fmtClock(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return (h? String(h)+':':'') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function fmtDate(ts){
  const d = new Date(ts);
  return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function normText(v){
  return String(v === null || v === undefined ? '' : v)
    .trim().toLowerCase()
    .replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[−–—]/g,'-').replace(/[，、]/g,',').replace(/；/g,';').replace(/：/g,':')
    .replace(/[“”‘’"']/g,'').replace(/\s+/g,'');
}

/* ---------------- 题库标准化 ---------------- */
function normalizeQuestion(raw, index){
  const q = Object.assign({}, raw || {});
  q.uid = q.uid || 'q' + index;
  q.stem = String(q.stem || '').trim();
  q.answer = String(q.answer || '').trim();
  q.explanation = String(q.explanation || '').trim();
  q.options = Array.isArray(q.options) ? q.options.map(o => ({key:String(o.key||'').toUpperCase(), text:String(o.text||'').trim()})) : [];
  q.blocks = Array.isArray(q.blocks) ? q.blocks : [];
  q.type = q.type || 'short';
  q.chapter = Number(q.chapter || 0);
  q.no = q.no || (index + 1);
  q.typeTitle = q.typeTitle || TYPE_LABEL[q.type] || '';
  q.answerKey = q.answerKey || '';
  q.answerParts = Array.isArray(q.answerParts) ? q.answerParts : [];
  q.blanks = Number(q.blanks || 0) || 1;
  q.auto = typeof q.auto === 'boolean' ? q.auto : true;

  if(q.type === 'choice'){
    const m = q.answer.match(/[A-Ha-h]/);
    q.answerKey = (m ? m[0] : '').toUpperCase();
  } else if(q.type === 'judge'){
    const s = q.answer;
    q.answerKey = (s.indexOf('√') >= 0 || s.indexOf('对') >= 0 || s.indexOf('正确') >= 0) ? 'T' : 'F';
    if(s.indexOf('×') >= 0 || s.indexOf('错') >= 0) q.answerKey = 'F';
  } else if(q.type === 'blank'){
    let parts = q.answerParts.length ? q.answerParts.map(String) : q.answer.split(/[；;]/).map(t => t.trim()).filter(Boolean);
    const marks = (q.stem.match(/_{3,}/g) || []).length;
    const blankNo = Number(q.blanks) || marks || 1;
    if(parts.length === blankNo && parts.every(t => t.length <= 40)){
      q.blanks = blankNo; q.answerParts = parts; q.auto = true;
    } else {
      q.blanks = 1; q.answerParts = [q.answer]; q.auto = false;
    }
  }
  return q;
}

function normalizeBank(raw){
  const src = Array.isArray(raw) ? {questions: raw} : (raw || {});
  const rawQs = Array.isArray(src.questions) ? src.questions : [];
  if(!rawQs.length) throw new Error('题库里没有识别到题目');
  const questions = rawQs.map(normalizeQuestion);

  const seen = {};
  questions.forEach((q, i) => {
    let base = String(q.uid || ('q' + i));
    let n = 2;
    while(seen[base]){ base = (q.no || 'q') + '-' + n++; }
    seen[base] = 1;
    q.uid = base;
  });

  let chapters = [];
  if(Array.isArray(src.chapters) && src.chapters.length){
    chapters = src.chapters.map(c => ({no:Number(c.no || 0), title:String(c.title || '')})).filter(c => c.title);
  }
  if(!chapters.length){
    const map = {};
    questions.forEach(q => {
      const no = q.chapter || 0;
      if(!map[no]) map[no] = q.chapterTitle || (q.chapter ? '第' + no + '章' : '未分章');
    });
    chapters = Object.keys(map).map(no => ({no:Number(no), title:map[no]}));
  }
  chapters.sort((a,b) => a.no - b.no);
  chapters.forEach(c => {
    const q = questions.find(x => x.chapter === c.no && x.chapterTitle);
    if(!c.title && q) c.title = q.chapterTitle;
  });
  questions.forEach(q => {
    const c = chapters.find(c => c.no === q.chapter);
    if(c) q.chapterTitle = c.title;
  });

  const meta = Object.assign({title:'题库', source:'', count:questions.length}, src.meta || {});
  meta.count = questions.length;

  return {
    meta,
    chapters,
    questions,
    appendix: Array.isArray(src.appendix) ? src.appendix : []
  };
}

function chapterTitle(no){
  const c = state.bank.chapters.find(c => c.no === no);
  return c ? c.title : ('第' + no + '章');
}

function loadBank(){
  const saved = load(LS.bank, null);
  try{ return normalizeBank(saved || BUILTIN_BANK); }
  catch(e){
    if(saved){ localStorage.removeItem(LS.bank); try{ return normalizeBank(BUILTIN_BANK); }catch(e2){} }
    throw e;
  }
}

/* ---------------- 会话 ---------------- */
function availableQuestions(cfg){
  const bank = state.bank;
  return bank.questions.filter(q => {
    if(cfg.chapters.indexOf(q.chapter) < 0) return false;
    if(q.set === 'exercise') return cfg.types.indexOf('exercise') >= 0;
    return cfg.types.indexOf(q.type) >= 0;
  });
}
function createSession(mode, questions, cfg){
  return {
    id: 'p' + Date.now(),
    mode,
    cfg: clone(cfg),
    questions: questions.map(clone),
    answers: {},
    submittedQ: {},
    revealedQ: {},
    selfEval: {},
    overrides: {},
    submitted: false,
    ended: false,
    index: 0,
    startedAt: Date.now(),
    endsAt: (mode === 'exam' && cfg.minutes) ? Date.now() + cfg.minutes * 60000 : 0,
    finishedAt: null
  };
}
function saveSession(){
  if(state.session) save(LS.session, state.session);
}
function currentQuestion(){
  const s = state.session;
  return s ? s.questions[s.index] : null;
}
function getAnswer(q){
  const s = state.session;
  if(!s) return null;
  return s.answers[q.uid] || null;
}
function setAnswer(q, patch){
  const s = state.session;
  if(!s || s.submitted) return;
  if(s.mode === 'practice' && s.submittedQ[q.uid]) return;
  const cur = Object.assign({}, s.answers[q.uid] || {});
  Object.assign(cur, patch);
  s.answers[q.uid] = cur;
  saveSession();
}
function isAnswered(q, a){
  if(!a) return false;
  if(q.type === 'choice') return !!a.choice;
  if(q.type === 'judge') return !!a.judge;
  if(q.type === 'blank') return !!(a.blanks && a.blanks.some(v => String(v || '').trim()));
  return !!String(a.text || '').trim();
}
function answeredCount(s){
  return s.questions.filter(q => isAnswered(q, s.answers[q.uid])).length;
}

/* ---------------- 判分 ---------------- */
function evaluate(q, s){
  const a = s.answers[q.uid] || null;
  if(s.overrides && s.overrides[q.uid]) return {status:'correct', score:1, manual:false, override:true};
  if(q.type === 'short' || q.type === 'algo') return {status:'manual', score:0, manual:true};
  if(q.type === 'choice'){
    if(!a || !a.choice) return {status:'blank', score:0, manual:false};
    return a.choice === q.answerKey ? {status:'correct', score:1, manual:false} : {status:'wrong', score:0, manual:false};
  }
  if(q.type === 'judge'){
    if(!a || !a.judge) return {status:'blank', score:0, manual:false};
    return a.judge === q.answerKey ? {status:'correct', score:1, manual:false} : {status:'wrong', score:0, manual:false};
  }
  if(q.type === 'blank'){
    if(!q.auto) return {status:'manual', score:0, manual:true};
    const ins = (a && a.blanks) ? a.blanks : [];
    if(!ins.some(v => String(v || '').trim())) return {status:'blank', score:0, manual:false};
    const ok = q.answerParts.every((p, i) => normText(ins[i]) === normText(p));
    return ok ? {status:'correct', score:1, manual:false} : {status:'wrong', score:0, manual:false};
  }
  return {status:'manual', score:0, manual:true};
}
function computeScore(s){
  let score = 0, right = 0, objectiveTotal = 0, manualTotal = 0, manualDone = 0, blank = 0;
  s.questions.forEach(q => {
    const r = evaluate(q, s);
    if(!isAnswered(q, s.answers[q.uid])) blank++;
    if(r.manual){
      manualTotal++;
      const se = s.selfEval[q.uid];
      if(se === 'full'){ score += 1; manualDone++; }
      else if(se === 'partial'){ score += 0.5; manualDone++; }
    } else {
      objectiveTotal++;
      if(r.status === 'correct'){ score += 1; right++; }
    }
  });
  return {
    score,
    right,
    objectiveTotal,
    manualTotal,
    manualDone,
    blank,
    total: s.questions.length,
    rate: s.questions.length ? score / s.questions.length : 0
  };
}
function statusOf(q, s){
  if(s.mode === 'practice' && !s.submittedQ[q.uid] && !s.ended) return 'todo';
  const r = evaluate(q, s);
  if(r.manual){
    const se = s.selfEval[q.uid];
    if(!se) return 'manual';
    return se === 'none' ? 'wrong' : 'manual';
  }
  return r.status;
}
function correctAnswerText(q){
  if(q.type === 'choice'){
    const opt = q.options.find(o => o.key === q.answerKey);
    return q.answerKey + (opt ? '. ' + opt.text : '');
  }
  if(q.type === 'judge') return q.answerKey === 'T' ? '√ 正确' : '× 错误';
  if(q.type === 'blank'){
    if(q.answerParts.length > 1) return q.answerParts.map((p,i) => (i+1) + '. ' + p).join('；');
    return q.answerParts[0] || q.answer;
  }
  return q.answer;
}
function userAnswerText(q, a){
  if(!a) return '未作答';
  if(q.type === 'choice'){
    if(!a.choice) return '未作答';
    const opt = q.options.find(o => o.key === a.choice);
    return a.choice + (opt ? '. ' + opt.text : '');
  }
  if(q.type === 'judge') return a.judge ? (a.judge === 'T' ? '√ 正确' : '× 错误') : '未作答';
  if(q.type === 'blank'){
    const v = (a.blanks || []).map(t => String(t || '').trim());
    if(!v.some(Boolean)) return '未作答';
    return v.map((t,i) => (q.blanks > 1 ? (i+1) + '. ' : '') + (t || '（空）')).join('；');
  }
  return String(a.text || '').trim() || '未作答';
}

/* ---------------- 错题本与记录 ---------------- */
function addWrong(q){
  const idx = state.wrong.findIndex(w => w.q.uid === q.uid);
  if(idx >= 0){
    state.wrong[idx].count = (state.wrong[idx].count || 1) + 1;
    state.wrong[idx].lastAt = Date.now();
  } else {
    state.wrong.unshift({q: clone(q), count: 1, at: Date.now(), lastAt: Date.now()});
  }
  state.wrong = state.wrong.slice(0, 400);
  save(LS.wrong, state.wrong);
}
function pushHistory(s){
  const stat = computeScore(s);
  state.history.unshift({
    at: Date.now(),
    sid: s.id,
    mode: s.mode,
    total: s.questions.length,
    score: stat.score,
    correct: stat.right,
    objectiveTotal: stat.objectiveTotal,
    duration: Math.floor((Date.now() - s.startedAt) / 1000),
    snap: {
      id: s.id,
      mode: s.mode,
      cfg: clone(s.cfg),
      questions: clone(s.questions),
      answers: clone(s.answers),
      submittedQ: clone(s.submittedQ || {}),
      revealedQ: clone(s.revealedQ || {}),
      selfEval: clone(s.selfEval || {}),
      overrides: clone(s.overrides || {}),
      startedAt: s.startedAt,
      finishedAt: s.finishedAt || Date.now()
    }
  });
  state.history = state.history.slice(0, 30);
  save(LS.history, state.history);
}
function syncHistory(s){
  if(!s || !s.id) return;
  const h = state.history.find(x => x.sid === s.id || (x.snap && x.snap.id === s.id));
  if(!h) return;
  const stat = computeScore(s);
  h.score = stat.score;
  h.correct = stat.right;
  h.objectiveTotal = stat.objectiveTotal;
  h.duration = Math.floor(((s.finishedAt || Date.now()) - s.startedAt) / 1000);
  if(h.snap){
    h.snap.selfEval = clone(s.selfEval || {});
    h.snap.overrides = clone(s.overrides || {});
    h.snap.answers = clone(s.answers || {});
    h.snap.submittedQ = clone(s.submittedQ || {});
  }
  save(LS.history, state.history);
}

/* ---------------- 开始 / 交卷 ---------------- */
function startSession(mode, questions, cfg){
  if(!questions.length){ toast('没有可用的题目'); return false; }
  state.session = createSession(mode, questions, cfg);
  saveSession();
  state.view = 'quiz';
  state.ui.index = 0;
  render();
  window.scrollTo(0, 0);
  return true;
}
async function startFromSetup(){
  const cfg = state.setup;
  const pool = availableQuestions(cfg);
  if(!pool.length){ toast('当前筛选条件下没有题目'); return; }
  const list = cfg.order === 'random' ? shuffle(pool) : pool.slice();
  const count = cfg.count === 'all' ? list.length : Math.min(Number(cfg.count) || 10, list.length);
  const picked = list.slice(0, count);
  if(state.session && !state.session.ended && state.view !== 'quiz'){
    const ok = await dialog({title:'开始新的一套？', message:'当前有一套未完成的练习，开始新试卷会覆盖它。', ok:'覆盖并开始'});
    if(!ok) return;
  }
  startSession(cfg.mode, picked, cfg);
}
async function submitPaper(auto){
  const s = state.session;
  if(!s || s.submitted) return;
  if(!auto){
    const un = s.questions.filter(q => !isAnswered(q, s.answers[q.uid])).length;
    if(un > 0){
      const ok = await dialog({title:'确认交卷？', message:`还有 ${un} 道题未作答。交卷后才能看到答案，之后不能再修改。`, ok:'确认交卷'});
      if(!ok) return;
    }
  }
  s.submitted = true;
  s.ended = true;
  s.finishedAt = Date.now();
  s.questions.forEach(q => {
    const r = evaluate(q, s);
    if(!r.manual && r.status === 'wrong') addWrong(q);
  });
  pushHistory(s);
  saveSession();
  state.view = 'result';
  state.ui.resultFilter = 'all';
  render();
  if(auto) toast('作答时间已到，系统已自动交卷');
}
async function endPractice(){
  const s = state.session;
  if(!s) return;
  const un = s.questions.filter(q => !s.submittedQ[q.uid]).length;
  const ok = await dialog({title:'结束本次练习？', message: un ? `还有 ${un} 道题没有提交过。结束后可以查看整卷结果。` : '所有题目都已提交，可以查看整卷结果。', ok:'结束练习'});
  if(!ok) return;
  s.ended = true;
  s.finishedAt = Date.now();
  pushHistory(s);
  saveSession();
  state.view = 'result';
  state.ui.resultFilter = 'all';
  render();
}

/* ---------------- 题目渲染 ---------------- */
function tableHTML(rows){
  if(!rows || !rows.length) return '';
  let html = '<div class="tbl-wrap"><table>';
  rows.forEach((row, ri) => {
    html += '<tr>';
    row.forEach(cell => {
      html += ri === 0 ? `<th>${esc(cell)}</th>` : `<td>${esc(cell)}</td>`;
    });
    html += '</tr>';
  });
  return html + '</table></div>';
}
function blocksHTML(q){
  return (q.blocks || []).map((b, i) => {
    if(b.type === 'code') return `<pre class="code">${esc(b.text)}</pre>`;
    if(b.type === 'table') return tableHTML(b.rows);
    return '';
  }).join('');
}
function renderFlow(text, q){
  const raw = String(text || '');
  const parts = raw.split(/\[BLOCK:(\d+)\]/g);
  let html = '';
  for(let i=0;i<parts.length;i++){
    if(i % 2 === 1){
      const b = (q.blocks || [])[Number(parts[i])];
      if(b){ html += b.type === 'code' ? `<pre class="code">${esc(b.text)}</pre>` : tableHTML(b.rows); }
    } else {
      html += esc(parts[i]).replace(/\n/g, '<br>');
    }
  }
  return html;
}
function stemParts(q, a, interactive){
  const raw = String(q.stem || '');
  const segments = raw.split(/\[BLOCK:(\d+)\]/g);
  let out = '';
  let blankIndex = 0;
  for(let i=0;i<segments.length;i++){
    if(i % 2 === 1){
      const b = (q.blocks || [])[Number(segments[i])];
      if(b){ out += b.type === 'code' ? `<pre class="code">${esc(b.text)}</pre>` : tableHTML(b.rows); }
      continue;
    }
    let h = esc(segments[i]);
    if(q.type === 'blank' && interactive){
      h = h.replace(/_{3,}/g, () => {
        const bi = blankIndex++;
        const v = (a && a.blanks && a.blanks[bi]) ? a.blanks[bi] : '';
        const len = q.auto && q.answerParts[bi] ? q.answerParts[bi].length : 6;
        const w = Math.max(110, Math.min(340, len * 16 + 40));
        return `<input class="blank-input" data-field="blank" data-bi="${bi}" value="${esc(v)}" placeholder="第${bi+1}空" style="width:${w}px" autocomplete="off" spellcheck="false">`;
      });
    } else if(q.type === 'blank'){
      h = h.replace(/_{3,}/g, () => {
        const bi = blankIndex++;
        const v = (a && a.blanks && a.blanks[bi]) || '';
        return `<span class="blank-fill">${v ? esc(v) : '________'}</span>`;
      });
    }
    const slot = a && a.choice ? a.choice : (a && a.judge ? (a.judge === 'T' ? '√' : '×') : '　');
    h = h.replace(/（\s*[　\s]\s*）/g, `（<b class="slot">${esc(slot)}</b>）`);
    h = h.replace(/\n/g, '<br>');
    out += h;
  }
  return out;
}
function optionsHTML(q, a, locked){
  return '<div class="options">' + q.options.map(o => {
    const on = a && a.choice === o.key;
    return `<button class="opt ${on ? 'on' : ''}" ${locked ? 'disabled' : ''} data-act="pick" data-key="${esc(o.key)}"><span class="key">${esc(o.key)}</span><span class="text">${esc(o.text)}</span></button>`;
  }).join('') + '</div>';
}
function judgeHTML(a, locked){
  const t = a && a.judge === 'T', f = a && a.judge === 'F';
  return `<div class="judge-row">
    <button class="jbtn ${t ? 'on' : ''}" ${locked ? 'disabled' : ''} data-act="judge" data-v="T"><span class="sym">√</span><span>正确</span></button>

}
function selfEvalHTML(q, s){

/* ---------------- 视图：结果 ---------------- */
function reviewItemHTML(q, s){
  const a = s.answers[q.uid] || null;
  const r = evaluate(q, s);
  const st = statusOf(q, s);
  let pill = '';
  if(r.manual){
    const se = s.selfEval[q.uid];
    pill = state.ui.historyMode ? '<span class="pill manual">参考答案</span>' : se === 'full' ? '<span class="pill right">已掌握</span>' : se === 'partial' ? '<span class="pill manual">部分掌握</span>' : se === 'none' ? '<span class="pill wrong">未掌握</span>' : '<span class="pill manual">待自评</span>';
  } else if(st === 'correct'){
    pill = '<span class="pill right">正确</span>';
  } else if(isAnswered(q, a)){
    pill = '<span class="pill wrong">错误</span>';
  } else {
    pill = '<span class="pill blank">未答</span>';
  }
  const opts = q.type === 'choice' ? '<div style="margin:6px 0 8px">' + q.options.map(o =>
    `<div class="rev-opt ${o.key === q.answerKey ? 'right' : ''} ${a && a.choice === o.key ? 'mine' : ''}">${esc(o.key)}. ${esc(o.text)}</div>`).join('') + '</div>' : '';

  return `<article class="rev ${state.ui.historyMode ? 'open' : ''}" data-uid="${esc(q.uid)}">
    <div class="rev-top" data-act="toggle-rev">
      <span class="no">${esc(q.no)}</span>
      <span class="tt">${esc((q.set === 'exercise' ? '随堂 · ' : '') + (TYPE_LABEL[q.type] || ''))}</span>
      <span class="stemline">${esc(String(q.stem).replace(/\[BLOCK:\d+\]/g,'').replace(/\s+/g,' ').replace(/_{3,}/g,'____'))}</span>
      ${pill}
      <span style="color:var(--muted);font-size:12px;transform:rotate(90deg)">›</span>
    </div>
    <div class="rev-body">
      <div class="rev-stem">${stemParts(q, a, false)}</div>
      ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ''}
      ${opts}
      <div class="rev-ans">
        <span>你的答案：<b>${esc(userAnswerText(q, a))}</b></span>
        <span>参考答案：<b class="ok">${esc(correctAnswerText(q))}</b></span>
      </div>
      ${r.manual && !state.ui.historyMode ? selfEvalHTML(q, s) : ''}
      <div class="exp"><div class="exp-title">解　析</div><div class="exp-body">${renderFlow(q.explanation, q)}</div></div>
    </div>
  </article>`;
}
function resultView(){
  const s = state.session;
  if(!s) return homeView();
  const stat = computeScore(s);
  const hAt = state.ui.historyMode ? (state.history[state.ui.historyIndex] && state.history[state.ui.historyIndex].at) || s.finishedAt || Date.now() : 0;
  const filter = state.ui.resultFilter;
  const minutes = Math.floor((s.finishedAt || Date.now()) - s.startedAt) / 60000;
  const items = s.questions.filter(q => {
    const r = evaluate(q, s);
    if(filter === 'all') return true;
    if(filter === 'wrong'){
      if(r.manual) return s.selfEval[q.uid] === 'none' || !isAnswered(q, s.answers[q.uid]);
      return r.status === 'wrong' || r.status === 'blank';
    }
    if(filter === 'blank') return !isAnswered(q, s.answers[q.uid]);
    if(filter === 'manual') return r.manual;
    return true;
  });
  const wrongInPaper = s.questions.filter(q => {
    const r = evaluate(q, s);
    if(r.manual) return s.selfEval[q.uid] === 'none' || !isAnswered(q, s.answers[q.uid]);
    return r.status === 'wrong' || r.status === 'blank';
  });
  const scoreText = Number.isInteger(stat.score) ? stat.score : stat.score.toFixed(1);

  return `<div class="wrap">
    ${topbar('home')}
    <div class="page-head">
      <div><h2>${state.ui.historyMode ? '历史练习记录' : (s.mode === 'exam' ? '考试结果' : '练习结果')}</h2>
      <p>${state.ui.historyMode
        ? `回看 ${fmtDate(hAt)} 完成的${s.mode === 'exam' ? '考试' : '练习'}，只读模式。用时 ${fmtClock(Math.floor(((s.finishedAt || Date.now()) - s.startedAt) / 1000))}`
        : `${s.mode === 'exam' ? '整卷已批改，答案与解析现已解锁。' : '本次练习已结束，可以逐题核对。'}用时 ${fmtClock(Math.floor((s.finishedAt - s.startedAt) / 1000))}`}</p></div>
      <div class="chips">
        ${state.ui.historyMode
          ? `<button class="btn" data-act="close-history">返回练习记录</button>`
          : `<button class="btn" data-act="go" data-view="home">返回首页</button>
             <button class="btn primary" data-act="again" data-mode="${s.mode}">再来一套</button>`}
      </div>
    </div>

    <div class="result-grid">
      <div class="score-card">
        <div class="lbl">SCORE</div>
        <div class="big"><b>${scoreText}</b><span>/ ${s.questions.length}</span></div>
        <div class="sub">得分率 ${Math.round(stat.rate * 100)}% · 主观题按自评计分（完全 1 分 / 部分 0.5 分）</div>
        <div class="ring"></div>
      </div>
      <div class="mini-grid">
        <div class="mini-card"><b>${stat.right}/${stat.objectiveTotal}</b><span>客观题正确</span></div>
        <div class="mini-card"><b>${stat.manualDone}/${stat.manualTotal}</b><span>主观题已自评</span></div>
        <div class="mini-card"><b>${stat.blank}</b><span>未作答</span></div>
        <div class="mini-card"><b>${Math.round(minutes)}</b><span>用时（分钟）</span></div>
      </div>
    </div>

    ${!state.ui.historyMode && stat.manualTotal > stat.manualDone ? `<div class="panel" style="padding:14px 18px;margin-bottom:14px"><div class="hint">还有 <b>${stat.manualTotal - stat.manualDone}</b> 道主观题（简答、算法或需要人工判断的填空题）没有自评。展开题目后可选择「完全掌握 / 部分掌握 / 未掌握」，得分会随之更新。</div></div>` : ''}

    <div class="section-head"><h2>逐题回顾</h2><span>${items.length} 题</span></div>
    <div class="filters">
      ${[['all','全部'],['wrong','错题与未答'],['blank','未作答'],['manual','主观题']].map(([v,l]) =>
        `<button class="chip small ${filter === v ? 'on' : ''}" data-act="result-filter" data-v="${v}">${l}</button>`).join('')}
    </div>
    <div class="rev-list">
      ${items.length ? items.map(q => reviewItemHTML(q, s)).join('') : '<div class="panel empty">这一栏没有题目。</div>'}
    </div>

    <div class="result-actions">
      ${state.ui.historyMode
        ? `<button class="btn primary" data-act="close-history">返回练习记录</button>`
        : `${wrongInPaper.length ? `<button class="btn primary" data-act="retry-paper-wrong">再练这套的错题（${wrongInPaper.length} 题）</button>` : ''}
           <button class="btn" data-act="go" data-view="wrong">打开错题本</button>
           <button class="btn" data-act="go" data-view="home">返回首页</button>`}
    </div>
  </div>`;
}

function updateTimer(){
  const el = document.getElementById('timer');

  if(!el || state.view !== 'quiz' || !s) return;
  const now = Date.now();
  if(s.mode === 'exam' && s.endsAt && !s.submitted){
    const rem = Math.max(0, s.endsAt - now);
