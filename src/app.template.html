        if(b.kind === 'h2') return `<h3>${esc(b.text)}</h3>`;
        if(b.kind === 'table') return tableHTML(b.rows);
        return `<p>${esc(b.text)}</p>`;
      }).join('') : `<div class="empty">当前题库没有附带公式页。</div>`}
    </section>
  </div>`;
}

/* ---------------- 渲染入口 ---------------- */
function render(){
  let html = '';
  switch(state.view){
    case 'home': html = homeView(); break;
    case 'setup': html = setupView(); break;
    case 'quiz': html = quizView(); break;
    case 'result': html = resultView(); break;
    case 'wrong': html = wrongView(); break;
    case 'bank': html = bankView(); break;
    case 'formula': html = formulaView(); break;
    default: html = homeView();
  }
  app().innerHTML = html;
  document.body.dataset.view = state.view;
  updateTimer();
  if(state.view === 'quiz') requestAnimationFrame(initRevealCards);
}
function updateTimer(){
  const el = document.getElementById('timer');
  const s = state.session;
  if(!el || state.view !== 'quiz' || !s) return;
  const now = Date.now();
  if(s.mode === 'exam' && s.endsAt && !s.submitted){
    const rem = Math.max(0, s.endsAt - now);
    el.textContent = fmtClock(rem / 1000);
    el.classList.toggle('warn', rem < 300000);
  } else {
    el.textContent = fmtClock((now - s.startedAt) / 1000);
    el.classList.remove('warn');
  }
}
function updateAnsweredBadges(){
  const s = state.session;
  if(!s) return;
  const n = answeredCount(s);
  document.querySelectorAll('[data-answered]').forEach(el => { el.textContent = n; });
}

/* ---------------- 撕封条 ---------------- */
let foilCtx = null;
function foilCrackle(volume = .06, frequency = 3200){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!foilCtx) foilCtx = new AC();
    if(foilCtx.state === 'suspended') foilCtx.resume();
    const dur = .055;
    const len = Math.max(1, Math.floor(foilCtx.sampleRate * dur));
    const buffer = foilCtx.createBuffer(1, len, foilCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < len; i++){
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.4);
    }
    const src = foilCtx.createBufferSource();
    src.buffer = buffer;
    const bp = foilCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = frequency;
    bp.Q.value = .72;
    const gain = foilCtx.createGain();
    gain.gain.value = volume;
    src.connect(bp); bp.connect(gain); gain.connect(foilCtx.destination);
    src.start();
  }catch(e){}
}
function initRevealCards(){
  const shell = document.querySelector('.reveal-shell.sealed');
  if(!shell) return;
  const cover = shell.querySelector('[data-cover]');
  if(!cover) return;

  let dragging = false, startY = 0, base = 0, moved = false, lastY = 0, lastSoundY = 0;
  const set = p => shell.style.setProperty('--peel', String(Math.max(0, Math.min(1, p))));
  const get = () => {
    const v = parseFloat(shell.style.getPropertyValue('--peel') || '0');
    return Number.isFinite(v) ? v : 0;
  };
  const complete = () => {
    if(!shell.classList.contains('sealed')) return;
    shell.classList.remove('dragging', 'springback');
    shell.classList.add('snap');
    set(1);
    const s = state.session;
    if(s){
      s.revealedQ = s.revealedQ || {};
      s.revealedQ[shell.dataset.uid] = true;
      saveSession();
    }
    foilCrackle(.1, 4400);
    setTimeout(() => {
      shell.classList.remove('sealed', 'snap');
      shell.classList.add('revealed', 'celebrate');
      setTimeout(() => shell.classList.remove('celebrate'), 1300);
    }, 340);
  };
  const springBack = () => {
    shell.classList.remove('dragging');
    shell.classList.add('springback');
    set(0);
    setTimeout(() => shell.classList.remove('springback'), 520);
  };

  cover.addEventListener('pointerdown', e => {
    if(!shell.classList.contains('sealed')) return;
    dragging = true; moved = false;
    startY = lastY = lastSoundY = e.clientY;
    base = get();
    shell.classList.remove('springback', 'snap');
    shell.classList.add('dragging');
    cover.setPointerCapture(e.pointerId);
    foilCrackle(.075, 2500);
    e.preventDefault();
  });
  cover.addEventListener('pointermove', e => {
    if(!dragging) return;
    const h = Math.max(150, shell.offsetHeight);
    const dy = e.clientY - startY;
    if(Math.abs(dy) > 7) moved = true;
    set(base + dy / h * 1.28);
    if(Math.abs(e.clientY - lastSoundY) > 42){
      lastSoundY = e.clientY;
      foilCrackle(.045, 3600 + Math.random() * 900);
    }
    e.preventDefault();
  });
  const finish = e => {
    if(!dragging) return;
    dragging = false;
    try{ cover.releasePointerCapture(e.pointerId); }catch(err){}
    shell.classList.remove('dragging');
    if(get() > .54 || (moved && e.clientY - startY > 78)) complete();
    else springBack();
  };
  cover.addEventListener('pointerup', finish);
  cover.addEventListener('pointercancel', finish);
  cover.addEventListener('click', () => { if(!moved) complete(); });
  cover.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); complete(); }
  });
}
function tick(){
  updateTimer();
  const s = state.session;
  if(state.view === 'quiz' && s && s.mode === 'exam' && s.endsAt && !s.submitted && s.endsAt <= Date.now()){
    submitPaper(true);
  }
}

/* ---------------- 交互杂项 ---------------- */
let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
}
function dialog({title, message, ok = '确定', cancel = '取消', danger = false}){
  return new Promise(resolve => {
    const mask = document.createElement('div');
    mask.className = 'modal';
    mask.innerHTML = `<div class="modal-card">
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn" data-v="0">${esc(cancel)}</button>
        <button class="btn ${danger ? 'danger' : 'primary'}" data-v="1">${esc(ok)}</button>
      </div>
    </div>`;
    document.body.appendChild(mask);
    mask.addEventListener('click', e => {
      const b = e.target.closest('[data-v]');
      if(b){ mask.remove(); resolve(b.dataset.v === '1'); }
      else if(e.target === mask){ mask.remove(); resolve(false); }
    });
  });
}
function resetSetup(){
  state.setup = {
    mode: state.setup.mode || 'practice',
    chapters: state.bank.chapters.map(c => c.no),
    types: TYPE_ORDER.filter(t => state.bank.questions.some(q => q.type === t)),
    count: 25,
    order: 'random',
    minutes: 60
  };
}
function go(view){
  if(view === 'quiz' && !state.session){ state.view = 'home'; render(); return; }
  state.view = view;
  render();
}
function jumpTo(i){
  const s = state.session;
  if(!s) return;
  s.index = Math.max(0, Math.min(s.questions.length - 1, i));
  saveSession();
  render();
  const card = document.querySelector('.qcard');
  if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
}
function overrideCorrect(uid){
  const s = state.session;
  if(!s) return;
  s.overrides[uid] = true;
  state.wrong = state.wrong.filter(w => w.q.uid !== uid);
  save(LS.wrong, state.wrong);
  saveSession();
  render();
  toast('已标记为正确，并从错题本移除');
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const s = state.session;

  switch(act){
    case 'go': {
      const view = el.dataset.view;
      const mode = el.dataset.mode;
      if(view === 'setup' && mode) state.setup.mode = mode;
      go(view);
      break;
    }
    case 'resume':
      if(state.session){ state.view = 'quiz'; render(); window.scrollTo(0, 0); }
      break;
    case 'pick': {
      if(!s || s.submitted) return;
      const q = currentQuestion();
      if(!q || q.type !== 'choice') return;
      if(s.mode === 'practice' && s.submittedQ[q.uid]) return;
      setAnswer(q, {choice: el.dataset.key});
      updateAnsweredBadges();
      render();
      break;
    }
    case 'judge': {
      if(!s || s.submitted) return;
      const q = currentQuestion();
      if(!q || q.type !== 'judge') return;
      if(s.mode === 'practice' && s.submittedQ[q.uid]) return;
      setAnswer(q, {judge: el.dataset.v});
      updateAnsweredBadges();
      render();
      break;
    }
    case 'jump': {
      jumpTo(Number(el.dataset.i));
      break;
    }
    case 'prev': {
      if(s) jumpTo(s.index - 1);
      break;
    }
    case 'next': {
      if(!s) break;
      if(s.index >= s.questions.length - 1){ toast('已经是最后一题了'); break; }
      jumpTo(s.index + 1);
      break;
    }
    case 'submit-question': {
      if(!s) break;
      const q = currentQuestion();
      const a = s.answers[q.uid];
      if(!isAnswered(q, a)){ toast('先写下你的答案再提交'); break; }
      s.submittedQ[q.uid] = true;
      const r = evaluate(q, s);
      if(!r.manual && r.status === 'wrong') addWrong(q);
      saveSession();
      render();
      const fb = document.querySelector('.feedback');
      if(fb) fb.scrollIntoView({behavior:'smooth', block:'nearest'});
      break;
    }
    case 'reveal': {
      if(!s) break;
      const q = currentQuestion();
      s.submittedQ[q.uid] = true;
      s.revealedQ = s.revealedQ || {};
      s.revealedQ[q.uid] = true;
      saveSession();
      render();
      break;
    }
    case 'override': {
      overrideCorrect(el.dataset.uid);
      break;
    }
    case 'selfeval': {
      if(!s) break;
      const uid = el.dataset.uid;
      s.selfEval[uid] = el.dataset.v;
      saveSession();
      if(state.view === 'result'){
        render();
      } else {
        render();
      }
      break;
    }
    case 'submit-paper': {
      await submitPaper(false);
      break;
    }
    case 'end-practice': {
      await endPractice();
      break;
    }
    case 'exit-quiz': {
      if(!s) break;
      const ok = await dialog({title:'退出答题？', message:'当前作答进度会保留，可以从首页「继续答题」回到这里。', ok:'退出'});
      if(ok){ state.view = 'home'; render(); }
      break;
    }
    case 'result-filter': {
      state.ui.resultFilter = el.dataset.v;
      render();
      break;
    }
    case 'toggle-rev': {
      const card = el.closest('.rev');
      if(card) card.classList.toggle('open');
      break;
    }
    case 'again': {
      state.setup.mode = el.dataset.mode || 'practice';
      state.view = 'setup';
      render();
      break;
    }
    case 'retry-paper-wrong': {
      if(!s) break;
      const wrongQs = s.questions.filter(q => {
        const r = evaluate(q, s);
        if(r.manual) return s.selfEval[q.uid] === 'none' || !isAnswered(q, s.answers[q.uid]);
        return r.status === 'wrong' || r.status === 'blank';
      });
      if(!wrongQs.length){ toast('这套没有错题'); break; }
      startSession('practice', wrongQs, {chapters: [], types: [], count: wrongQs.length, order: 'random', minutes: 0});
      break;
    }
    case 'start-wrong': {
      if(!state.wrong.length){ toast('错题本是空的'); break; }
      const qs = state.wrong.map(w => normalizeQuestion(w.q, 0));
      startSession('practice', qs, {chapters: [], types: [], count: qs.length, order: 'random', minutes: 0});
      break;
    }
    case 'remove-wrong': {
      state.wrong = state.wrong.filter(w => w.q.uid !== el.dataset.uid);
      save(LS.wrong, state.wrong);
      render();
      break;
    }
    case 'clear-wrong': {
      const ok = await dialog({title:'清空错题本？', message:'所有收录的错题会从本机删除，题目本身不受影响。', ok:'清空', danger:true});
      if(ok){ state.wrong = []; save(LS.wrong, state.wrong); render(); }
      break;
    }
    case 'set-mode': {
      state.setup.mode = el.dataset.v;
      render();
      break;
    }
    case 'toggle-chapter': {
      const v = Number(el.dataset.v);
      const i = state.setup.chapters.indexOf(v);
      if(i >= 0) state.setup.chapters.splice(i, 1); else state.setup.chapters.push(v);
      render();
      break;
    }
    case 'select-all-ch': {
      state.setup.chapters = state.bank.chapters.map(c => c.no);
      render();
      break;
    }
    case 'select-none-ch': {
      state.setup.chapters = [];
      render();
      break;
    }
    case 'toggle-type': {
      const v = el.dataset.v;
      const i = state.setup.types.indexOf(v);
      if(i >= 0) state.setup.types.splice(i, 1); else state.setup.types.push(v);
      render();
      break;
    }
    case 'select-all-type': {
      state.setup.types = TYPE_ORDER.filter(t => state.bank.questions.some(q => q.type === t));
      render();
      break;
    }
    case 'select-none-type': {
      state.setup.types = [];
      render();
      break;
    }
    case 'set-count': {
      state.setup.count = el.dataset.v === 'all' ? 'all' : Number(el.dataset.v);
      render();
      break;
    }
    case 'set-order': {
      state.setup.order = el.dataset.v;
      render();
      break;
    }
    case 'set-minutes': {
      state.setup.minutes = Number(el.dataset.v);
      render();
      break;
    }
    case 'start-paper': {
      await startFromSetup();
      break;
    }
    case 'import-json': {
      const input = document.getElementById('fileInput');
      if(input) input.click();
      break;
    }
    case 'export-bank': {
      exportBank();
      break;
    }
    case 'restore-bank': {
      const ok = await dialog({title:'恢复内置题库？', message:'当前导入的题库会被内置的 125 题题库替换（原文件不会丢失，可提前导出备份）。', ok:'恢复内置'});
      if(!ok) break;
      localStorage.removeItem(LS.bank);
      state.bank = normalizeBank(BUILTIN_BANK);
      resetSetup();
      toast('已恢复内置题库');
      render();
      break;
    }
    case 'import-text': {
      const ta = document.getElementById('textBank');
      if(!ta || !ta.value.trim()){ toast('先把文本粘贴进来'); break; }
      try{
        const raw = parseTextBank(ta.value);
        await applyImportedBank(raw, '文本题库', ta);
      }catch(err){
        toast(err.message || '文本识别失败');
      }
      break;
    }
  }
});

document.addEventListener('input', (e) => {
  const s = state.session;
  if(!s || s.submitted) return;
  const t = e.target;
  if(t.dataset.field === 'blank'){
    const q = currentQuestion();
    if(!q) return;
    if(s.mode === 'practice' && s.submittedQ[q.uid]) return;
    const cur = Object.assign({}, s.answers[q.uid] || {});
    const arr = Array.isArray(cur.blanks) ? cur.blanks.slice() : [];
    arr[Number(t.dataset.bi)] = t.value;
    cur.blanks = arr;
    s.answers[q.uid] = cur;
    saveSession();
    updateAnsweredBadges();
  } else if(t.dataset.field === 'text'){
    const q = currentQuestion();
    if(!q) return;
    if(s.mode === 'practice' && s.submittedQ[q.uid]) return;
    const cur = Object.assign({}, s.answers[q.uid] || {});
    cur.text = t.value;
    s.answers[q.uid] = cur;
    saveSession();
    updateAnsweredBadges();
  }
});

document.addEventListener('change', (e) => {
  if(e.target && e.target.id === 'fileInput'){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const raw = JSON.parse(String(reader.result || ''));
        await applyImportedBank(raw, file.name.replace(/\.json$/i, ''), null);
      }catch(err){
        toast('文件不是有效的 JSON 题库：' + (err.message || '解析失败'));
      }
      e.target.value = '';
    };
    reader.readAsText(file, 'utf-8');
  }
});

document.addEventListener('keydown', (e) => {
  if(state.view !== 'quiz' || !state.session || state.session.submitted) return;
  const tag = (e.target.tagName || '').toUpperCase();
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  const q = currentQuestion();
  if(!q) return;
  if(q.type === 'choice'){
    const k = e.key.toUpperCase();
    if(/^[A-H]$/.test(k)){
      const opt = q.options.find(o => o.key === k);
      if(opt){
        e.preventDefault();
        setAnswer(q, {choice:k});
        updateAnsweredBadges();
        render();
      }
    }
  }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); jumpTo(state.session.index - 1); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); jumpTo(state.session.index + 1); }
});

/* ---------------- 导入 / 导出实现 ---------------- */
const SECTION_MAP = {'选择题':'choice','填空题':'blank','判断题':'judge','简答与计算分析题':'short','简答计算题':'short','简答题':'short','算法设计题':'algo','算法题':'algo'};
function parseTextBank(text){
  const lines = String(text).replace(/\r/g,'').split('\n');
  const questions = [];
  let chapters = [];
  let chapter = {no: 0, title: '导入题库'};
  let type = 'short';
  let q = null;
  let zone = 'stem';

  function push(){
    if(!q) return;
    if(String(q.stem || '').trim() || String(q.answer || '').trim()) questions.push(q);
    q = null;
  }

  for(const rawLine of lines){
    const line = rawLine.trim();
    if(!line) continue;
    if(line.startsWith('#')){
      push();
      const title = line.replace(/^#+\s*/, '');
      const cm = title.match(/第\s*(\d+)\s*章/);
      if(cm && !SECTION_MAP[title.replace(/^[一二三四五六七八九十]+、\s*/,'')]){
        chapter = {no: Number(cm[1]), title};
        if(!chapters.some(c => c.no === chapter.no)) chapters.push(chapter);
      } else {
        const name = title.replace(/^[一二三四五六七八九十]+、\s*/, '');
        type = SECTION_MAP[name] || type;
      }
      continue;
    }
    const mq = line.match(/^(\d+(?:\.\d+)?)\s*[.、．]?\s+(.*)$/);
    if(mq){
      push();
      q = {
        chapter: chapter.no,
        chapterTitle: chapter.title,
        type,
        no: mq[1].replace(/\s/g,''),
        stem: mq[2],
        options: [],
        answer: '',
        explanation: '',
        blocks: []
      };
      zone = 'stem';
      continue;
    }
    if(!q) continue;
    const ma = line.match(/^答案\s*[：:]\s*(.*)$/);
    if(ma){ q.answer = ma[1].trim(); zone = 'answer'; continue; }
    const me = line.match(/^解析\s*[：:]\s*(.*)$/);
    if(me){ q.explanation = me[1].trim(); zone = 'exp'; continue; }
    const mo = line.match(/^([A-H])\s*[.、．]\s+(.*)$/);
    if(mo && zone === 'stem'){ q.options.push({key: mo[1], text: mo[2].trim()}); continue; }
    if(zone === 'exp') q.explanation += '\n' + line;
    else if(zone === 'stem' && !q.answer) q.stem += '\n' + line;
    else q.explanation = (q.explanation ? q.explanation + '\n' : '') + line;
  }
  push();
  if(!questions.length) throw new Error('没有识别到题目，请检查格式');
  return {meta: {title: '导入的文本题库', source: '文本粘贴'}, chapters, questions};
}
async function applyImportedBank(raw, label, textarea){
  let bank;
  try{ bank = normalizeBank(raw); }
  catch(err){ toast(err.message || '题库格式不正确'); return; }
  const ok = await dialog({
    title: '导入题库？',
    message: `识别到「${bank.meta.title || label}」共 ${bank.questions.length} 道题、${bank.chapters.length} 个章节。导入后会替换当前题库（当前题库可先导出备份）。`,
    ok: '导入并替换'
  });
  if(!ok) return;
  state.bank = bank;
  save(LS.bank, bank);
  if(textarea) textarea.value = '';
  resetSetup();
  state.view = 'bank';
  render();
  toast(`已导入 ${bank.questions.length} 道题`);
}
function exportBank(){
  const bank = state.bank;
  const text = JSON.stringify(bank, null, 1);
  const date = new Date();
  const filename = `${(bank.meta.title || '题库').replace(/[\\/:*?"<>|]/g,'_')}_${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}.json`;
  if(window.AndroidExport && typeof window.AndroidExport.saveJson === 'function'){
    window.AndroidExport.saveJson(filename, text);
    return;
  }
  const blob = new Blob([text], {type: 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('题库已导出');
}

/* ---------------- 启动 ---------------- */
function initApp(){
  state.bank = loadBank();
  state.wrong = load(LS.wrong, []) || [];
  state.history = load(LS.history, []) || [];
  const restored = load(LS.session, null);
  if(restored && Array.isArray(restored.questions) && restored.questions.length){
    restored.questions = restored.questions.map((q, i) => normalizeQuestion(q, i));
    restored.revealedQ = restored.revealedQ || {};
    state.session = restored;
  }
  resetSetup();
  render();
  setInterval(tick, 1000);
  updateTimer();
  if(state.session && state.session.mode === 'exam' && state.session.endsAt && !state.session.submitted && state.session.endsAt <= Date.now()){
    submitPaper(true);
  }
}
initApp();
