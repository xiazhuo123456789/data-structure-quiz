<script>
/* ============================================================
   研题台 —— 多学科本地答题系统 + DeepSeek AI 助教
   题库数据内嵌，答题记录存 localStorage
   ============================================================ */
const BUILTIN_BANK = /*__BANK__*/ null;
const LS = {
  bank: 'dsq.bank.v1',
  session: 'dsq.session.v1',
  wrong: 'dsq.wrong.v1',
  history: 'dsq.history.v1',
  subjects: 'dsq.subjects.v2',
  activeSubject: 'dsq.activeSubject.v2',
  ai: 'dsq.ai.v1',
  aiThread: 'dsq.aiThread.v1'
};
const AI_DEFAULT = {
  apiKey: '',
  baseUrl: 'https://api.deepseek.com',
  model: 'deepseek-chat',
  temperature: 0.35
};
const TYPE_LABEL = {choice:'选择题', blank:'填空题', judge:'判断题', short:'简答计算题', algo:'算法设计题', exercise:'随堂练习'};
const TYPE_ORDER = ['choice','blank','judge','short','algo'];
const TYPE_EN = {choice:'选择', blank:'填空', judge:'判断', short:'简答', algo:'算法', exercise:'随堂'};
const AI_MODES = {
  hint: {label:'只给提示', short:'提示', desc:'不直接给答案，先给关键思路。'},
  solve: {label:'直接解答', short:'解答', desc:'给最终答案、步骤和必要计算。'},
  explain: {label:'讲知识点', short:'讲解', desc:'拆开题目背后的概念，配一个小例子。'}
};
const SUBJECT_COLORS = {
  mint: {a:'#0f765d', b:'#dff4ea', ink:'#0b3d32'},
  amber: {a:'#a7611b', b:'#fbf0dc', ink:'#54300b'},
  blue: {a:'#245c9e', b:'#e6effa', ink:'#163352'},
  rose: {a:'#9c3c58', b:'#fbe9ef', ink:'#4e1928'},
  violet: {a:'#5d4a9e', b:'#eeeafa', ink:'#2e2455'}
};

const state = {
  view: 'home',
  bank: null,
  subjects: [],
  activeSubjectId: null,
  session: null,
  wrong: [],
  history: [],
  setup: {mode:'practice', chapters:[], types:[], count:25, order:'random', minutes:60},
  ui: {index:0, resultFilter:'all', setupReady:false, historyMode:false, prevSession:null, historyRecord:null},
  ai: {
    config: Object.assign({}, AI_DEFAULT),
    messages: [],
    busy: false,
    error: '',
    mode: 'solve',
    draft: '',
    status: 'idle',
    statusText: ''
  }
};

const app = () => document.getElementById('app');

/* ---------------- 工具 ---------------- */
function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ toast('本地存储写入失败，可能是容量不足'); }
}
function shuffle(list){
  const a = list.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function fmtClock(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return (h? String(h)+':':'') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function fmtDate(ts){
  const d = new Date(ts);
  return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function normText(v){
  return String(v === null || v === undefined ? '' : v)
    .trim().toLowerCase()
    .replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[−–—]/g,'-').replace(/[，、]/g,',').replace(/；/g,';').replace(/：/g,':')
    .replace(/[“”‘’"']/g,'').replace(/\s+/g,'');
}

/* ---------------- 题库标准化 ---------------- */
function normalizeQuestion(raw, index){
  const q = Object.assign({}, raw || {});
  q.uid = q.uid || 'q' + index;
  q.stem = String(q.stem || '').trim();
  q.answer = String(q.answer || '').trim();
  q.explanation = String(q.explanation || '').trim();
  q.options = Array.isArray(q.options) ? q.options.map(o => ({key:String(o.key||'').toUpperCase(), text:String(o.text||'').trim()})) : [];
  q.blocks = Array.isArray(q.blocks) ? q.blocks : [];
  q.type = q.type || 'short';
  q.chapter = Number(q.chapter || 0);
  q.no = q.no || (index + 1);
  q.typeTitle = q.typeTitle || TYPE_LABEL[q.type] || '';
  q.answerKey = q.answerKey || '';
  q.answerParts = Array.isArray(q.answerParts) ? q.answerParts : [];
  q.blanks = Number(q.blanks || 0) || 1;
  q.auto = typeof q.auto === 'boolean' ? q.auto : true;

  if(q.type === 'choice'){
    const m = q.answer.match(/[A-Ha-h]/);
    q.answerKey = (m ? m[0] : '').toUpperCase();
  } else if(q.type === 'judge'){
    const s = q.answer;
    q.answerKey = (s.indexOf('√') >= 0 || s.indexOf('对') >= 0 || s.indexOf('正确') >= 0) ? 'T' : 'F';
    if(s.indexOf('×') >= 0 || s.indexOf('错') >= 0) q.answerKey = 'F';
  } else if(q.type === 'blank'){
    let parts = q.answerParts.length ? q.answerParts.map(String) : q.answer.split(/[；;]/).map(t => t.trim()).filter(Boolean);
    const marks = (q.stem.match(/_{3,}/g) || []).length;
    const blankNo = Number(q.blanks) || marks || 1;
    if(parts.length === blankNo && parts.every(t => t.length <= 40)){
      q.blanks = blankNo; q.answerParts = parts; q.auto = true;
    } else {
      q.blanks = 1; q.answerParts = [q.answer]; q.auto = false;
    }
  }
  return q;
}

function normalizeBank(raw){
  const src = Array.isArray(raw) ? {questions: raw} : (raw || {});
  const rawQs = Array.isArray(src.questions) ? src.questions : [];
  if(!rawQs.length) throw new Error('题库里没有识别到题目');
  const questions = rawQs.map(normalizeQuestion);

  const seen = {};
  questions.forEach((q, i) => {
    let base = String(q.uid || ('q' + i));
    let n = 2;
    while(seen[base]){ base = (q.no || 'q') + '-' + n++; }
    seen[base] = 1;
    q.uid = base;
  });

  let chapters = [];
  if(Array.isArray(src.chapters) && src.chapters.length){
    chapters = src.chapters.map(c => ({no:Number(c.no || 0), title:String(c.title || '')})).filter(c => c.title);
  }
  if(!chapters.length){
    const map = {};
    questions.forEach(q => {
      const no = q.chapter || 0;
      if(!map[no]) map[no] = q.chapterTitle || (q.chapter ? '第' + no + '章' : '未分章');
    });
    chapters = Object.keys(map).map(no => ({no:Number(no), title:map[no]}));
  }
  chapters.sort((a,b) => a.no - b.no);
  chapters.forEach(c => {
    const q = questions.find(x => x.chapter === c.no && x.chapterTitle);
    if(!c.title && q) c.title = q.chapterTitle;
  });
  questions.forEach(q => {
    const c = chapters.find(c => c.no === q.chapter);
    if(c) q.chapterTitle = c.title;
  });

  const meta = Object.assign({title:'题库', source:'', count:questions.length}, src.meta || {});
  meta.count = questions.length;

  return {
    meta,
    chapters,
    questions,
    appendix: Array.isArray(src.appendix) ? src.appendix : []
  };
}

function chapterTitle(no){
  const c = state.bank.chapters.find(c => c.no === no);
  return c ? c.title : ('第' + no + '章');
}

/* ---------------- 多学科 ---------------- */
function emptyBank(name){
  return {
    meta: {title:name || '新学科题库', source:'', count:0},
    chapters: [],
    questions: [],
    appendix: []
  };
}
function normalizeSubject(raw, index){
  const src = raw || {};
  const name = String(src.name || src.title || ('学科 ' + (index + 1))).trim();
  const id = String(src.id || ('s' + index));
  let bank;
  try{
    bank = (src.bank && Array.isArray(src.bank.questions) && src.bank.questions.length)
      ? normalizeBank(src.bank)
      : Object.assign(emptyBank(name), src.bank && !Array.isArray(src.bank.questions) ? {} : {});
  }catch(e){
    bank = emptyBank(name);
  }
  return {
    id,
    name,
    code: String(src.code || name.slice(0, 2).toUpperCase() || 'SUB').slice(0, 4),
    desc: String(src.desc || src.description || '').trim(),
    color: String(src.color || 'mint'),
    bank
  };
}
function loadSubjects(){
  const saved = load(LS.subjects, null);
  if(Array.isArray(saved) && saved.length){
    state.subjects = saved.map(normalizeSubject);
  }else{
    const legacy = load(LS.bank, null);
    let bank;
    try{ bank = normalizeBank(legacy || BUILTIN_BANK); }
    catch(e){ bank = normalizeBank(BUILTIN_BANK); }
    state.subjects = [{
      id: 'ds',
      name: '数据结构',
      code: 'DS',
      desc: '严蔚敏《数据结构（C语言版）》第 1—5 章与课堂随堂练习。',
      color: 'mint',
      bank
    }];
  }
  const savedActive = load(LS.activeSubject, null);
  const active = state.subjects.find(s => s.id === savedActive) || state.subjects[0];
  state.activeSubjectId = active ? active.id : null;
  state.bank = active ? active.bank : normalizeBank(BUILTIN_BANK);
}
function activeSubject(){
  return state.subjects.find(s => s.id === state.activeSubjectId) || state.subjects[0] || null;
}
function saveSubjects(){
  try{ localStorage.setItem(LS.subjects, JSON.stringify(state.subjects)); }
  catch(e){ toast('学科题库保存失败，可能是本地空间不足'); }
}
function switchSubject(id){
  const sub = state.subjects.find(s => s.id === id);
  if(!sub) return;
  state.activeSubjectId = sub.id;
  state.bank = sub.bank;
  save(LS.activeSubject, sub.id);
  resetSetup();
  render();
  window.scrollTo(0, 0);
  toast(`已切换到「${sub.name}」`);
}
function subjectCounts(sub){
  const qs = (sub.bank && sub.bank.questions) || [];
  return {
    total: qs.length,
    chapters: (sub.bank && sub.bank.chapters) || [],
    exercise: qs.filter(q => q.set === 'exercise').length
  };
}
function bankTotal(){
  return state.subjects.reduce((n, s) => n + subjectCounts(s).total, 0);
}

function loadBank(){
  const saved = load(LS.bank, null);
  try{ return normalizeBank(saved || BUILTIN_BANK); }
  catch(e){
    if(saved){ localStorage.removeItem(LS.bank); try{ return normalizeBank(BUILTIN_BANK); }catch(e2){} }
    throw e;
  }
}

/* ---------------- 会话 ---------------- */
function availableQuestions(cfg){
  const bank = state.bank;
  return bank.questions.filter(q => {
    if(cfg.chapters.indexOf(q.chapter) < 0) return false;
    if(q.set === 'exercise') return cfg.types.indexOf('exercise') >= 0;
    return cfg.types.indexOf(q.type) >= 0;
  });
}
function createSession(mode, questions, cfg){
  const sub = activeSubject();
  return {
    id: 'p' + Date.now(),
    mode,
    subjectId: sub ? sub.id : 'ds',
    subjectName: sub ? sub.name : '数据结构',
    cfg: clone(cfg),
    questions: questions.map(clone),
    answers: {},
    submittedQ: {},
    revealedQ: {},
    selfEval: {},
    overrides: {},
    submitted: false,
    ended: false,
    index: 0,
    startedAt: Date.now(),
    endsAt: (mode === 'exam' && cfg.minutes) ? Date.now() + cfg.minutes * 60000 : 0,
    finishedAt: null
  };
}
function saveSession(){
  if(state.session) save(LS.session, state.session);
}
function currentQuestion(){
  const s = state.session;
  return s ? s.questions[s.index] : null;
}
function getAnswer(q){
  const s = state.session;
  if(!s) return null;
  return s.answers[q.uid] || null;
}
function setAnswer(q, patch){
  const s = state.session;
  if(!s || s.submitted) return;
  if(s.mode === 'practice' && s.submittedQ[q.uid]) return;
  const cur = Object.assign({}, s.answers[q.uid] || {});
  Object.assign(cur, patch);
  s.answers[q.uid] = cur;
  saveSession();
}
function isAnswered(q, a){
  if(!a) return false;
  if(q.type === 'choice') return !!a.choice;
  if(q.type === 'judge') return !!a.judge;
  if(q.type === 'blank') return !!(a.blanks && a.blanks.some(v => String(v || '').trim()));
  return !!String(a.text || '').trim();
}
function answeredCount(s){
  return s.questions.filter(q => isAnswered(q, s.answers[q.uid])).length;
}

/* ---------------- 判分 ---------------- */
function evaluate(q, s){
  const a = s.answers[q.uid] || null;
  if(s.overrides && s.overrides[q.uid]) return {status:'correct', score:1, manual:false, override:true};
  if(q.type === 'short' || q.type === 'algo') return {status:'manual', score:0, manual:true};
  if(q.type === 'choice'){
    if(!a || !a.choice) return {status:'blank', score:0, manual:false};
    return a.choice === q.answerKey ? {status:'correct', score:1, manual:false} : {status:'wrong', score:0, manual:false};
  }
  if(q.type === 'judge'){
    if(!a || !a.judge) return {status:'blank', score:0, manual:false};
    return a.judge === q.answerKey ? {status:'correct', score:1, manual:false} : {status:'wrong', score:0, manual:false};
  }
  if(q.type === 'blank'){
    if(!q.auto) return {status:'manual', score:0, manual:true};
    const ins = (a && a.blanks) ? a.blanks : [];
    if(!ins.some(v => String(v || '').trim())) return {status:'blank', score:0, manual:false};
    const ok = q.answerParts.every((p, i) => normText(ins[i]) === normText(p));
    return ok ? {status:'correct', score:1, manual:false} : {status:'wrong', score:0, manual:false};
  }
  return {status:'manual', score:0, manual:true};
}
function computeScore(s){
  let score = 0, right = 0, objectiveTotal = 0, manualTotal = 0, manualDone = 0, blank = 0;
  s.questions.forEach(q => {
    const r = evaluate(q, s);
    if(!isAnswered(q, s.answers[q.uid])) blank++;
    if(r.manual){
      manualTotal++;
      const se = s.selfEval[q.uid];
      if(se === 'full'){ score += 1; manualDone++; }
      else if(se === 'partial'){ score += 0.5; manualDone++; }
    } else {
      objectiveTotal++;
      if(r.status === 'correct'){ score += 1; right++; }
    }
  });
  return {
    score,
    right,
    objectiveTotal,
    manualTotal,
    manualDone,
    blank,
    total: s.questions.length,
    rate: s.questions.length ? score / s.questions.length : 0
  };
}
function statusOf(q, s){
  if(s.mode === 'practice' && !s.submittedQ[q.uid] && !s.ended) return 'todo';
  const r = evaluate(q, s);
  if(r.manual){
    const se = s.selfEval[q.uid];
    if(!se) return 'manual';
    return se === 'none' ? 'wrong' : 'manual';
  }
  return r.status;
}
function correctAnswerText(q){
  if(q.type === 'choice'){
    const opt = q.options.find(o => o.key === q.answerKey);
    return q.answerKey + (opt ? '. ' + opt.text : '');
  }
  if(q.type === 'judge') return q.answerKey === 'T' ? '√ 正确' : '× 错误';
  if(q.type === 'blank'){
    if(q.answerParts.length > 1) return q.answerParts.map((p,i) => (i+1) + '. ' + p).join('；');
    return q.answerParts[0] || q.answer;
  }
  return q.answer;
}
function userAnswerText(q, a){
  if(!a) return '未作答';
  if(q.type === 'choice'){
    if(!a.choice) return '未作答';
    const opt = q.options.find(o => o.key === a.choice);
    return a.choice + (opt ? '. ' + opt.text : '');
  }
  if(q.type === 'judge') return a.judge ? (a.judge === 'T' ? '√ 正确' : '× 错误') : '未作答';
  if(q.type === 'blank'){
    const v = (a.blanks || []).map(t => String(t || '').trim());
    if(!v.some(Boolean)) return '未作答';
    return v.map((t,i) => (q.blanks > 1 ? (i+1) + '. ' : '') + (t || '（空）')).join('；');
  }
  return String(a.text || '').trim() || '未作答';
}

/* ---------------- 错题本与记录 ---------------- */
function addWrong(q){
  const sub = activeSubject();
  const sid = sub ? sub.id : 'ds';
  const idx = state.wrong.findIndex(w => (w.subjectId || 'ds') === sid && w.q.uid === q.uid);
  if(idx >= 0){
    state.wrong[idx].count = (state.wrong[idx].count || 1) + 1;
    state.wrong[idx].lastAt = Date.now();
  } else {
    state.wrong.unshift({q: clone(q), subjectId: sid, subjectName: sub ? sub.name : '数据结构', count: 1, at: Date.now(), lastAt: Date.now()});
  }
  state.wrong = state.wrong.slice(0, 400);
  save(LS.wrong, state.wrong);
}
function pushHistory(s){
  const stat = computeScore(s);
  state.history.unshift({
    at: Date.now(),
    sid: s.id,
    mode: s.mode,
    subjectId: s.subjectId || (activeSubject() ? activeSubject().id : 'ds'),
    subjectName: s.subjectName || (activeSubject() ? activeSubject().name : '数据结构'),
    total: s.questions.length,
    score: stat.score,
    correct: stat.right,
    objectiveTotal: stat.objectiveTotal,
    duration: Math.floor((Date.now() - s.startedAt) / 1000),
    snap: {
      id: s.id,
      mode: s.mode,
      subjectId: s.subjectId || '',
      subjectName: s.subjectName || '',
      cfg: clone(s.cfg),
      questions: clone(s.questions),
      answers: clone(s.answers),
      submittedQ: clone(s.submittedQ || {}),
      revealedQ: clone(s.revealedQ || {}),
      selfEval: clone(s.selfEval || {}),
      overrides: clone(s.overrides || {}),
      startedAt: s.startedAt,
      finishedAt: s.finishedAt || Date.now()
    }
  });
  state.history = state.history.slice(0, 30);
  save(LS.history, state.history);
}
function syncHistory(s){
  if(!s || !s.id) return;
  const h = state.history.find(x => x.sid === s.id || (x.snap && x.snap.id === s.id));
  if(!h) return;
  const stat = computeScore(s);
  h.score = stat.score;
  h.correct = stat.right;
  h.objectiveTotal = stat.objectiveTotal;
  h.duration = Math.floor(((s.finishedAt || Date.now()) - s.startedAt) / 1000);
  if(h.snap){
    h.snap.selfEval = clone(s.selfEval || {});
    h.snap.overrides = clone(s.overrides || {});
    h.snap.answers = clone(s.answers || {});
    h.snap.submittedQ = clone(s.submittedQ || {});
  }
  save(LS.history, state.history);
}

/* ---------------- 开始 / 交卷 ---------------- */
function startSession(mode, questions, cfg){
  if(!questions.length){ toast('没有可用的题目'); return false; }
  state.session = createSession(mode, questions, cfg);
  saveSession();
  state.view = 'quiz';
  state.ui.index = 0;
  render();
  window.scrollTo(0, 0);
  return true;
}
async function startFromSetup(){
  const cfg = state.setup;
  const pool = availableQuestions(cfg);
  if(!pool.length){ toast('当前筛选条件下没有题目'); return; }
  const list = cfg.order === 'random' ? shuffle(pool) : pool.slice();
  const count = cfg.count === 'all' ? list.length : Math.min(Number(cfg.count) || 10, list.length);
  const picked = list.slice(0, count);
  if(state.session && !state.session.ended && state.view !== 'quiz'){
    const ok = await dialog({title:'开始新的一套？', message:'当前有一套未完成的练习，开始新试卷会覆盖它。', ok:'覆盖并开始'});
    if(!ok) return;
  }
  startSession(cfg.mode, picked, cfg);
}
async function submitPaper(auto){
  const s = state.session;
  if(!s || s.submitted) return;
  if(!auto){
    const un = s.questions.filter(q => !isAnswered(q, s.answers[q.uid])).length;
    if(un > 0){
      const ok = await dialog({title:'确认交卷？', message:`还有 ${un} 道题未作答。交卷后才能看到答案，之后不能再修改。`, ok:'确认交卷'});
      if(!ok) return;
    }
  }
  s.submitted = true;
  s.ended = true;
  s.finishedAt = Date.now();
  s.questions.forEach(q => {
    const r = evaluate(q, s);
    if(!r.manual && r.status === 'wrong') addWrong(q);
  });
  pushHistory(s);
  saveSession();
  state.view = 'result';
  state.ui.resultFilter = 'all';
  render();
  if(auto) toast('作答时间已到，系统已自动交卷');
}
async function endPractice(){
  const s = state.session;
  if(!s) return;
  const un = s.questions.filter(q => !s.submittedQ[q.uid]).length;
  const ok = await dialog({title:'结束本次练习？', message: un ? `还有 ${un} 道题没有提交过。结束后可以查看整卷结果。` : '所有题目都已提交，可以查看整卷结果。', ok:'结束练习'});
  if(!ok) return;
  s.ended = true;
  s.finishedAt = Date.now();
  pushHistory(s);
  saveSession();
  state.view = 'result';
  state.ui.resultFilter = 'all';
  render();
}

/* ---------------- 题目渲染 ---------------- */
function tableHTML(rows){
  if(!rows || !rows.length) return '';
  let html = '<div class="tbl-wrap"><table>';
  rows.forEach((row, ri) => {
    html += '<tr>';
    row.forEach(cell => {
      html += ri === 0 ? `<th>${esc(cell)}</th>` : `<td>${esc(cell)}</td>`;
    });
    html += '</tr>';
  });
  return html + '</table></div>';
}
function blocksHTML(q){
  return (q.blocks || []).map((b, i) => {
    if(b.type === 'code') return `<pre class="code">${esc(b.text)}</pre>`;
    if(b.type === 'table') return tableHTML(b.rows);
    return '';
  }).join('');
}
function renderFlow(text, q){
  const raw = String(text || '');
  const parts = raw.split(/\[BLOCK:(\d+)\]/g);
  let html = '';
  for(let i=0;i<parts.length;i++){
    if(i % 2 === 1){
      const b = (q.blocks || [])[Number(parts[i])];
      if(b){ html += b.type === 'code' ? `<pre class="code">${esc(b.text)}</pre>` : tableHTML(b.rows); }
    } else {
      html += esc(parts[i]).replace(/\n/g, '<br>');
    }
  }
  return html;
}
function stemParts(q, a, interactive){
  const raw = String(q.stem || '');
  const segments = raw.split(/\[BLOCK:(\d+)\]/g);
  let out = '';
  let blankIndex = 0;
  for(let i=0;i<segments.length;i++){
    if(i % 2 === 1){
      const b = (q.blocks || [])[Number(segments[i])];
      if(b){ out += b.type === 'code' ? `<pre class="code">${esc(b.text)}</pre>` : tableHTML(b.rows); }
      continue;
    }
    let h = esc(segments[i]);
    if(q.type === 'blank' && interactive){
      h = h.replace(/_{3,}/g, () => {
        const bi = blankIndex++;
        const v = (a && a.blanks && a.blanks[bi]) ? a.blanks[bi] : '';
        const len = q.auto && q.answerParts[bi] ? q.answerParts[bi].length : 6;
        const w = Math.max(110, Math.min(340, len * 16 + 40));
        return `<input class="blank-input" data-field="blank" data-bi="${bi}" value="${esc(v)}" placeholder="第${bi+1}空" style="width:${w}px" autocomplete="off" spellcheck="false">`;
      });
    } else if(q.type === 'blank'){
      h = h.replace(/_{3,}/g, () => {
        const bi = blankIndex++;
        const v = (a && a.blanks && a.blanks[bi]) || '';
        return `<span class="blank-fill">${v ? esc(v) : '________'}</span>`;
      });
    }
    const slot = a && a.choice ? a.choice : (a && a.judge ? (a.judge === 'T' ? '√' : '×') : '　');
    h = h.replace(/（\s*[　\s]\s*）/g, `（<b class="slot">${esc(slot)}</b>）`);
    h = h.replace(/\n/g, '<br>');
    out += h;
  }
  return out;
}
function optionsHTML(q, a, locked){
  return '<div class="options">' + q.options.map(o => {
    const on = a && a.choice === o.key;
    return `<button class="opt ${on ? 'on' : ''}" ${locked ? 'disabled' : ''} data-act="pick" data-key="${esc(o.key)}"><span class="key">${esc(o.key)}</span><span class="text">${esc(o.text)}</span></button>`;
  }).join('') + '</div>';
}
function judgeHTML(a, locked){
  const t = a && a.judge === 'T', f = a && a.judge === 'F';
  return `<div class="judge-row">
    <button class="jbtn ${t ? 'on' : ''}" ${locked ? 'disabled' : ''} data-act="judge" data-v="T"><span class="sym">√</span><span>正确</span></button>
    <button class="jbtn ${f ? 'on' : ''}" ${locked ? 'disabled' : ''} data-act="judge" data-v="F"><span class="sym">×</span><span>错误</span></button>
  </div>`;
}
function selfEvalHTML(q, s){
  const se = s.selfEval[q.uid] || '';
  return `<div class="selfeval">
    <span>主观题自评：</span>
    <button data-act="selfeval" data-uid="${esc(q.uid)}" data-v="full" class="${se === 'full' ? 'on' : ''}">完全掌握</button>
    <button data-act="selfeval" data-uid="${esc(q.uid)}" data-v="partial" class="${se === 'partial' ? 'on' : ''}">部分掌握</button>
    <button data-act="selfeval" data-uid="${esc(q.uid)}" data-v="none" class="${se === 'none' ? 'on' : ''}">未掌握</button>
  </div>`;
}
function feedbackHTML(q, s){

  } else {

  const burst = [

    <section class="feedback ${cls}">

        <button class="btn primary" data-act="next">下一题</button>

          <path d="M60 8C66 34 84 52 112 60C84 68 66 86 60 112C54 86 36 68 8 60C36 52 54 34 60 8Z" stroke="white" stroke-width="1.4" stroke-opacity=".75"/>
          <path d="M60 24C64 42 78 56 96 60C78 64 64 78 60 96C56 78 42 64 24 60C42 56 56 42 60 24Z" stroke="white" stroke-opacity=".32"/>
          <g class="seal-face">
            <circle cx="55" cy="58" r="2.4" fill="white" fill-opacity=".86"/>
            <circle cx="65" cy="58" r="2.4" fill="white" fill-opacity=".86"/>
            <path d="M56 66Q60 70 64 66" stroke="white" stroke-width="2" stroke-opacity=".78" fill="none"/>
          </g>
        </svg>
      </div>
      <div class="cover-copy">
        <small>ANSWER SEALED</small>
        <b>答案被封住了</b>
        <span>按住封条向下拖动 · 松手会回弹</span>
        <div class="cover-arrow"></div>
      </div>
      <div class="cover-tape bottom"></div>
    </div>
    <div class="tear-grip" data-grip aria-hidden="true"><span>向下撕开</span><b>⌄</b></div>`}
    <div class="reveal-burst" aria-hidden="true">${burst}</div>
  </div>`;
}
function questionCardHTML(q, i, s){
  const a = s.answers[q.uid] || null;
  const practice = s.mode === 'practice';
  const submitted = practice && s.submittedQ[q.uid];
  const locked = s.submitted || (practice && submitted);
  const interactive = !locked;
  const showFeedback = practice && submitted;

  let body = '';
  if(q.type === 'choice') body = optionsHTML(q, a, locked);
  else if(q.type === 'judge') body = judgeHTML(a, locked);
  else if(q.type === 'blank') body = '';
  else body = `<textarea class="answer${locked ? ' locked' : ''}" data-field="text" ${locked ? 'readonly' : ''} placeholder="在这里写下你的思路或答案，提交后可对照参考答案与解析…">${esc(a && a.text || '')}</textarea>`;

  const prevDisabled = i === 0 ? 'disabled' : '';
  const nextLabel = i === s.questions.length - 1 ? '已是最后一题' : '下一题';

  return `<article class="qcard" data-uid="${esc(q.uid)}">
    <div class="qmeta">
      <span class="tag">${esc(q.chapterTitle || chapterTitle(q.chapter))}</span>
      <span class="tag ghost">${esc(q.set === 'exercise' ? '随堂练习 · ' + (TYPE_LABEL[q.type] || q.typeTitle || '题目') : (TYPE_LABEL[q.type] || q.typeTitle || '题目'))}</span>
      <span class="qno">题号 ${esc(q.no)} · 第 ${i+1} / ${s.questions.length} 题</span>

function aiEndpoint(){

function aiSystemPrompt(){
  const sub = activeSubject();
  const mode = AI_MODES[state.ai.mode] || AI_MODES.solve;
  const modeRule = state.ai.mode === 'hint'
    ? '先给 1—2 个关键提示，不要直接报最终答案；最后用一个问题引导用户自己往下做。'
    : state.ai.mode === 'explain'

      : '给出明确的最终答案，再按步骤解释；计算题写清关键中间量，代码题给伪代码或 C 语言代码。';
  return [

    `当前学科：${sub ? sub.name : '通用学科'}。`,
    `回答方式：${mode.label}。${modeRule}`,
    '要求：用中文，先给结论，再展开；句子短，少用空话；公式用普通文本写清楚。',
    '如果题目条件不足、题意有歧义或你无法确定，就直接说明缺少什么，不要编造答案。',
    '不要重复用户原题，不要输出与解题无关的长篇背景。'
  ].join('\n');
}
function mdLite(text){
  const raw = String(text === null || text === undefined ? '' : text);
  return raw.split(/(```[\s\S]*?```)/g).map(part => {
    if(/^```/.test(part)){
      const body = part.replace(/^```[^\n]*\n?/,'').replace(/```$/,'');
      return `<pre class="ai-code"><code>${esc(body)}</code></pre>`;
    }
    let h = esc(part);
    h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\n/g, '<br>');
    return h;
  }).join('');
}
async function aiRequest(messages, opts){
  opts = opts || {};
  const key = String(state.ai.config.apiKey || '').trim();
  if(!key) throw new Error('请先在设置里填入 DeepSeek API Key');
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), opts.timeout || 90000) : null;
  let res;
  try{
    res = await fetch(aiEndpoint(), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify({
        model: String(state.ai.config.model || 'deepseek-chat').trim() || 'deepseek-chat',
        messages,
        temperature: typeof opts.temperature === 'number' ? opts.temperature : Number(state.ai.config.temperature || 0.35),
        max_tokens: opts.maxTokens || 1600,
        stream: false
      }),
      signal: ctrl ? ctrl.signal : undefined
    });
  }catch(err){
    if(timer) clearTimeout(timer);
    if(err && err.name === 'AbortError') throw new Error('DeepSeek 响应超时，请检查网络后再试');
    throw new Error('连不上 DeepSeek，请检查网络或 API 地址');
  }
  if(timer) clearTimeout(timer);
  const raw = await res.text();
  let data = null;
  try{ data = raw ? JSON.parse(raw) : null; }catch(e){}
  if(!res.ok){
    const msg = data && data.error && data.error.message ? data.error.message : ('HTTP ' + res.status);
    if(res.status === 401) throw new Error('API Key 无效，请到设置里重新填写');
    if(res.status === 402) throw new Error('DeepSeek 账户余额不足');
    if(res.status === 429) throw new Error('请求太频繁，请稍后再试');
    throw new Error('DeepSeek 返回错误：' + msg);
  }
  const content = data && data.choices && data.choices[0] && data.choices[0].message
    ? data.choices[0].message.content
    : '';
  if(!content) throw new Error('DeepSeek 没有返回内容');
  return String(content).trim();
}

  try{

  const chaptersPresent = state.bank.chapters;
  const typesPresent = (exerciseCount ? ['exercise'] : []).concat(TYPE_ORDER.filter(t => typeCounts[t]));

  const countOptions = [10, 15, 25, 50, 'all'];
  const isExam = s.mode === 'exam';

  return `<div class="wrap">

/* ---------------- 视图：结果 ---------------- */
function reviewItemHTML(q, s){
  const a = s.answers[q.uid] || null;
  const r = evaluate(q, s);
  const st = statusOf(q, s);
  let pill = '';
  if(r.manual){
    const se = s.selfEval[q.uid];
    pill = state.ui.historyMode ? '<span class="pill manual">参考答案</span>' : se === 'full' ? '<span class="pill right">已掌握</span>' : se === 'partial' ? '<span class="pill manual">部分掌握</span>' : se === 'none' ? '<span class="pill wrong">未掌握</span>' : '<span class="pill manual">待自评</span>';
  } else if(st === 'correct'){
    pill = '<span class="pill right">正确</span>';
  } else if(isAnswered(q, a)){
    pill = '<span class="pill wrong">错误</span>';
  } else {
    pill = '<span class="pill blank">未答</span>';
  }
  const opts = q.type === 'choice' ? '<div style="margin:6px 0 8px">' + q.options.map(o =>
    `<div class="rev-opt ${o.key === q.answerKey ? 'right' : ''} ${a && a.choice === o.key ? 'mine' : ''}">${esc(o.key)}. ${esc(o.text)}</div>`).join('') + '</div>' : '';

  return `<article class="rev ${state.ui.historyMode ? 'open' : ''}" data-uid="${esc(q.uid)}">
    <div class="rev-top" data-act="toggle-rev">
      <span class="no">${esc(q.no)}</span>
      <span class="tt">${esc((q.set === 'exercise' ? '随堂 · ' : '') + (TYPE_LABEL[q.type] || ''))}</span>
      <span class="stemline">${esc(String(q.stem).replace(/\[BLOCK:\d+\]/g,'').replace(/\s+/g,' ').replace(/_{3,}/g,'____'))}</span>
      ${pill}
      <span style="color:var(--muted);font-size:12px;transform:rotate(90deg)">›</span>
    </div>
    <div class="rev-body">
      <div class="rev-stem">${stemParts(q, a, false)}</div>
      ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ''}
      ${opts}
      <div class="rev-ans">
        <span>你的答案：<b>${esc(userAnswerText(q, a))}</b></span>
        <span>参考答案：<b class="ok">${esc(correctAnswerText(q))}</b></span>
      </div>
      ${r.manual && !state.ui.historyMode ? selfEvalHTML(q, s) : ''}
      <div class="exp"><div class="exp-title">解　析</div><div class="exp-body">${renderFlow(q.explanation, q)}</div></div>
    </div>
  </article>`;
}
function resultView(){
  const s = state.session;
  if(!s) return homeView();
  const stat = computeScore(s);
  const hAt = state.ui.historyMode ? (state.history[state.ui.historyIndex] && state.history[state.ui.historyIndex].at) || s.finishedAt || Date.now() : 0;
  const filter = state.ui.resultFilter;
  const minutes = Math.floor((s.finishedAt || Date.now()) - s.startedAt) / 60000;
  const items = s.questions.filter(q => {
    const r = evaluate(q, s);
    if(filter === 'all') return true;
    if(filter === 'wrong'){
      if(r.manual) return s.selfEval[q.uid] === 'none' || !isAnswered(q, s.answers[q.uid]);
      return r.status === 'wrong' || r.status === 'blank';
    }
    if(filter === 'blank') return !isAnswered(q, s.answers[q.uid]);
    if(filter === 'manual') return r.manual;
    return true;
  });
  const wrongInPaper = s.questions.filter(q => {
    const r = evaluate(q, s);
    if(r.manual) return s.selfEval[q.uid] === 'none' || !isAnswered(q, s.answers[q.uid]);
    return r.status === 'wrong' || r.status === 'blank';
  });
  const scoreText = Number.isInteger(stat.score) ? stat.score : stat.score.toFixed(1);

  return `<div class="wrap">
    ${topbar('home')}
    <div class="page-head">
      <div><h2>${state.ui.historyMode ? '历史练习记录' : (s.mode === 'exam' ? '考试结果' : '练习结果')}</h2>
      <p>${state.ui.historyMode
        ? `回看 ${fmtDate(hAt)} 完成的${s.mode === 'exam' ? '考试' : '练习'}，只读模式。用时 ${fmtClock(Math.floor(((s.finishedAt || Date.now()) - s.startedAt) / 1000))}`
        : `${s.mode === 'exam' ? '整卷已批改，答案与解析现已解锁。' : '本次练习已结束，可以逐题核对。'}用时 ${fmtClock(Math.floor((s.finishedAt - s.startedAt) / 1000))}`}</p></div>
      <div class="chips">
        ${state.ui.historyMode
          ? `<button class="btn" data-act="close-history">返回练习记录</button>`
          : `<button class="btn" data-act="go" data-view="home">返回首页</button>
             <button class="btn primary" data-act="again" data-mode="${s.mode}">再来一套</button>`}
      </div>
    </div>

    <div class="result-grid">
      <div class="score-card">
        <div class="lbl">SCORE</div>
        <div class="big"><b>${scoreText}</b><span>/ ${s.questions.length}</span></div>
        <div class="sub">得分率 ${Math.round(stat.rate * 100)}% · 主观题按自评计分（完全 1 分 / 部分 0.5 分）</div>
        <div class="ring"></div>
      </div>
      <div class="mini-grid">
        <div class="mini-card"><b>${stat.right}/${stat.objectiveTotal}</b><span>客观题正确</span></div>
        <div class="mini-card"><b>${stat.manualDone}/${stat.manualTotal}</b><span>主观题已自评</span></div>
        <div class="mini-card"><b>${stat.blank}</b><span>未作答</span></div>
        <div class="mini-card"><b>${Math.round(minutes)}</b><span>用时（分钟）</span></div>
      </div>
    </div>

    ${!state.ui.historyMode && stat.manualTotal > stat.manualDone ? `<div class="panel" style="padding:14px 18px;margin-bottom:14px"><div class="hint">还有 <b>${stat.manualTotal - stat.manualDone}</b> 道主观题（简答、算法或需要人工判断的填空题）没有自评。展开题目后可选择「完全掌握 / 部分掌握 / 未掌握」，得分会随之更新。</div></div>` : ''}

    <div class="section-head"><h2>逐题回顾</h2><span>${items.length} 题</span></div>
    <div class="filters">
      ${[['all','全部'],['wrong','错题与未答'],['blank','未作答'],['manual','主观题']].map(([v,l]) =>
        `<button class="chip small ${filter === v ? 'on' : ''}" data-act="result-filter" data-v="${v}">${l}</button>`).join('')}
    </div>
    <div class="rev-list">
      ${items.length ? items.map(q => reviewItemHTML(q, s)).join('') : '<div class="panel empty">这一栏没有题目。</div>'}
    </div>

    <div class="result-actions">
      ${state.ui.historyMode
        ? `<button class="btn primary" data-act="close-history">返回练习记录</button>`
        : `${wrongInPaper.length ? `<button class="btn primary" data-act="retry-paper-wrong">再练这套的错题（${wrongInPaper.length} 题）</button>` : ''}
           <button class="btn" data-act="go" data-view="wrong">打开错题本</button>
           <button class="btn" data-act="go" data-view="home">返回首页</button>`}
    </div>
  </div>`;
}

function render(){
  let html = '';
  switch(state.view){
    case 'home': html = homeView(); break;
    case 'library': html = libraryView(); break;
    case 'ai': html = aiView(); break;
    case 'settings': html = settingsView(); break;
    case 'setup': html = setupView(); break;
    case 'quiz': html = quizView(); break;
    case 'result': html = resultView(); break;
    case 'history': html = historyView(); break;
    case 'wrong': html = wrongView(); break;
    case 'bank': html = bankView(); break;
    case 'formula': html = formulaView(); break;
    default: html = homeView();
  }
  app().innerHTML = html;
  document.documentElement.dataset.view = state.view;
  document.body.dataset.view = state.view;
  updateTimer();
  if(state.view === 'quiz') requestAnimationFrame(initRevealCards);
}
function updateTimer(){
  const el = document.getElementById('timer');
  const s = state.session;
  if(!el || state.view !== 'quiz' || !s) return;
  const now = Date.now();
  if(s.mode === 'exam' && s.endsAt && !s.submitted){
    const rem = Math.max(0, s.endsAt - now);
    el.textContent = fmtClock(rem / 1000);
    el.classList.toggle('warn', rem < 300000);
  } else {
    el.textContent = fmtClock((now - s.startedAt) / 1000);
    el.classList.remove('warn');
  }
}
function updateAnsweredBadges(){
  const s = state.session;
  if(!s) return;
  const n = answeredCount(s);
  document.querySelectorAll('[data-answered]').forEach(el => { el.textContent = n; });
}

/* ---------------- 撕封条 ---------------- */
let foilCtx = null;
function foilCrackle(volume = .06, frequency = 3200){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!foilCtx) foilCtx = new AC();
    if(foilCtx.state === 'suspended') foilCtx.resume();
    const dur = .055;
    const len = Math.max(1, Math.floor(foilCtx.sampleRate * dur));
    const buffer = foilCtx.createBuffer(1, len, foilCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < len; i++){
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.4);
    }
    const src = foilCtx.createBufferSource();
    src.buffer = buffer;
    const bp = foilCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = frequency;
    bp.Q.value = .72;
    const gain = foilCtx.createGain();
    gain.gain.value = volume;
    src.connect(bp); bp.connect(gain); gain.connect(foilCtx.destination);
    src.start();
  }catch(e){}
}
function initRevealCards(){
  const shell = document.querySelector('.reveal-shell.sealed');
  if(!shell) return;
  const cover = shell.querySelector('[data-cover]');
  if(!cover) return;

  let dragging = false, startY = 0, base = 0, moved = false, lastY = 0, lastSoundY = 0;
  const set = p => shell.style.setProperty('--peel', String(Math.max(0, Math.min(1, p))));
  const get = () => {
    const v = parseFloat(shell.style.getPropertyValue('--peel') || '0');
    return Number.isFinite(v) ? v : 0;
  };
  const complete = () => {
    if(!shell.classList.contains('sealed')) return;
    shell.classList.remove('dragging', 'springback');
    shell.classList.add('snap');
    set(1);
    const s = state.session;
    if(s){
      s.revealedQ = s.revealedQ || {};
      s.revealedQ[shell.dataset.uid] = true;
      saveSession();
    }
    foilCrackle(.1, 4400);
    setTimeout(() => {
      shell.classList.remove('sealed', 'snap');
      shell.classList.add('revealed', 'celebrate');
      setTimeout(() => shell.classList.remove('celebrate'), 1300);
    }, 340);
  };
  const springBack = () => {
    shell.classList.remove('dragging');
    shell.classList.add('springback');
    set(0);
    setTimeout(() => shell.classList.remove('springback'), 520);
  };

  cover.addEventListener('pointerdown', e => {
    if(!shell.classList.contains('sealed')) return;
    dragging = true; moved = false;
    startY = lastY = lastSoundY = e.clientY;
    base = get();
    shell.classList.remove('springback', 'snap');
    shell.classList.add('dragging');
    cover.setPointerCapture(e.pointerId);
    foilCrackle(.075, 2500);
    e.preventDefault();
  });
  cover.addEventListener('pointermove', e => {
    if(!dragging) return;
    const h = Math.max(150, shell.offsetHeight);
    const dy = e.clientY - startY;
    if(Math.abs(dy) > 7) moved = true;
    set(base + dy / h * 1.28);
    if(Math.abs(e.clientY - lastSoundY) > 42){
      lastSoundY = e.clientY;
      foilCrackle(.045, 3600 + Math.random() * 900);
    }
    e.preventDefault();
  });
  const finish = e => {
    if(!dragging) return;
    dragging = false;
    try{ cover.releasePointerCapture(e.pointerId); }catch(err){}
    shell.classList.remove('dragging');
    if(get() > .54 || (moved && e.clientY - startY > 78)) complete();
    else springBack();
  };
  cover.addEventListener('pointerup', finish);
  cover.addEventListener('pointercancel', finish);
  cover.addEventListener('click', () => { if(!moved) complete(); });
  cover.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); complete(); }
  });
}

function dialog({title, message, ok = '确定', cancel = '取消', danger = false}){

    mask.className = 'modal';
    mask.innerHTML = `<div class="modal-card">
      <h3>${esc(title)}</h3>

function leaveHistory(){
  if(!state.ui.historyMode) return;
  state.session = state.ui.prevSession || null;
  state.ui.prevSession = null;
  state.ui.historyMode = false;
  state.ui.historyRecord = null;
  state.ui.historyIndex = null;
}
function openHistory(index){
  const h = state.history[index];
  if(!h) return;
  leaveHistory();
  state.ui.prevSession = state.session;
  state.ui.historyMode = true;
  state.ui.historyIndex = index;
  state.ui.historyRecord = h;
  if(h.snap && Array.isArray(h.snap.questions) && h.snap.questions.length){
    const snap = clone(h.snap);
    const sub = state.subjects.find(s => s.id === (h.subjectId || snap.subjectId));
    if(sub){ state.activeSubjectId = sub.id; state.bank = sub.bank; }
    const s = {
      id: 'h' + (h.at || Date.now()),
      mode: snap.mode || h.mode || 'practice',
      subjectId: h.subjectId || snap.subjectId || (sub ? sub.id : ''),
      subjectName: h.subjectName || snap.subjectName || (sub ? sub.name : ''),
      cfg: snap.cfg || {chapters: [], types: [], count: h.total, order: 'random', minutes: 0},
      questions: snap.questions.map((q, i) => normalizeQuestion(q, i)),
      answers: snap.answers || {},
      submittedQ: snap.submittedQ || {},
      revealedQ: snap.revealedQ || {},
      selfEval: snap.selfEval || {},
      overrides: snap.overrides || {},
      submitted: true,
      ended: true,
      index: 0,
      startedAt: snap.startedAt || (h.at - (h.duration || 0) * 1000),
      endsAt: 0,
      finishedAt: snap.finishedAt || h.at
    };
    state.session = s;
    state.ui.resultFilter = 'all';
    state.view = 'result';
  } else {
    state.session = null;
    state.view = 'history';

function closeHistory(){

  state.view = 'history';

}
function go(view){

function jumpTo(i){

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const s = state.session;

  switch(act){
    case 'go': {
      const view = el.dataset.view;
      const mode = el.dataset.mode;
      if(view === 'setup' && mode) state.setup.mode = mode;
      go(view);
      break;
    }
    case 'resume':
      if(state.session){ state.view = 'quiz'; render(); window.scrollTo(0, 0); }
      break;
    case 'open-history':
      openHistory(Number(el.dataset.i));
      break;
    case 'close-history':
      closeHistory();
      break;
    case 'open-exercise': {
      state.setup.mode = 'practice';
      state.setup.chapters = [0];
      state.setup.types = ['exercise'];
      state.setup.count = 'all';
      state.setup.order = 'seq';
      state.view = 'setup';
      render();
      window.scrollTo(0, 0);
      break;
    }
    case 'pick': {
      if(!s || s.submitted) return;
      const q = currentQuestion();
      if(!q || q.type !== 'choice') return;
      if(s.mode === 'practice' && s.submittedQ[q.uid]) return;
      setAnswer(q, {choice: el.dataset.key});
      updateAnsweredBadges();
      render();
      break;
    }
    case 'judge': {
      if(!s || s.submitted) return;

      break;
    }

      jumpTo(Number(el.dataset.i));

    }
    case 'prev': {
      if(s) jumpTo(s.index - 1);
      break;
    }
    case 'next': {

/* ---------------- 导入 / 导出实现 ---------------- */
const SECTION_MAP = {'选择题':'choice','填空题':'blank','判断题':'judge','简答与计算分析题':'short','简答计算题':'short','简答题':'short','算法设计题':'algo','算法题':'algo'};
function parseTextBank(text){
  const lines = String(text).replace(/\r/g,'').split('\n');
  const questions = [];
  let chapters = [];
  let chapter = {no: 0, title: '导入题库'};
  let type = 'short';
  let q = null;
  let zone = 'stem';

  function push(){
    if(!q) return;
    if(String(q.stem || '').trim() || String(q.answer || '').trim()) questions.push(q);
    q = null;
  }

  for(const rawLine of lines){
    const line = rawLine.trim();
    if(!line) continue;
    if(line.startsWith('#')){
      push();
      const title = line.replace(/^#+\s*/, '');
      const cm = title.match(/第\s*(\d+)\s*章/);
      if(cm && !SECTION_MAP[title.replace(/^[一二三四五六七八九十]+、\s*/,'')]){
        chapter = {no: Number(cm[1]), title};
        if(!chapters.some(c => c.no === chapter.no)) chapters.push(chapter);
      } else {
        const name = title.replace(/^[一二三四五六七八九十]+、\s*/, '');
        type = SECTION_MAP[name] || type;
      }
      continue;
    }
    const mq = line.match(/^(\d+(?:\.\d+)?)\s*[.、．]?\s+(.*)$/);
    if(mq){
      push();
      q = {
        chapter: chapter.no,
        chapterTitle: chapter.title,
        type,
        no: mq[1].replace(/\s/g,''),
        stem: mq[2],
        options: [],
        answer: '',
        explanation: '',
        blocks: []
      };
      zone = 'stem';
      continue;
    }
    if(!q) continue;
    const ma = line.match(/^答案\s*[：:]\s*(.*)$/);
    if(ma){ q.answer = ma[1].trim(); zone = 'answer'; continue; }
    const me = line.match(/^解析\s*[：:]\s*(.*)$/);
    if(me){ q.explanation = me[1].trim(); zone = 'exp'; continue; }
    const mo = line.match(/^([A-H])\s*[.、．]\s+(.*)$/);
    if(mo && zone === 'stem'){ q.options.push({key: mo[1], text: mo[2].trim()}); continue; }
    if(zone === 'exp') q.explanation += '\n' + line;
    else if(zone === 'stem' && !q.answer) q.stem += '\n' + line;
    else q.explanation = (q.explanation ? q.explanation + '\n' : '') + line;
  }
  push();
  if(!questions.length) throw new Error('没有识别到题目，请检查格式');
  return {meta: {title: '导入的文本题库', source: '文本粘贴'}, chapters, questions};
}
async function applyImportedBank(raw, label, textarea){
  let bank;
  try{ bank = normalizeBank(raw); }
  catch(err){ toast(err.message || '题库格式不正确'); return; }
  const ok = await dialog({
    title: '导入题库？',
    message: `识别到「${bank.meta.title || label}」共 ${bank.questions.length} 道题、${bank.chapters.length} 个章节。导入后会替换当前学科「${activeSubject() ? activeSubject().name : '未命名'}」的题库（原题库可先导出备份）。`,
    ok: '导入并替换'
  });
  if(!ok) return;
  const sub = activeSubject();
  if(sub){ sub.bank = bank; }
  state.bank = bank;
  saveSubjects();
  if(textarea) textarea.value = '';
  resetSetup();
  state.view = 'library';
  render();
  toast(`已导入 ${bank.questions.length} 道题`);
}
function exportBank(){
  const bank = state.bank;
  const text = JSON.stringify(bank, null, 1);
  const date = new Date();
  const filename = `${(bank.meta.title || '题库').replace(/[\\/:*?"<>|]/g,'_')}_${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}.json`;
  if(window.AndroidExport && typeof window.AndroidExport.saveJson === 'function'){
    window.AndroidExport.saveJson(filename, text);
    return;
  }
  const blob = new Blob([text], {type: 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('题库已导出');
}

/* ---------------- 开场题卡轮 / 点击特效 ---------------- */
let introClosed = false;
let introOpening = false;
let introWheelState = null;
function initIntroDust(){
  const dust = document.getElementById('intro-dust');
  if(!dust || dust.childElementCount) return;
  for(let i = 0; i < 30; i++){
    const dot = document.createElement('span');
    dot.style.setProperty('--x', (4 + Math.random() * 92).toFixed(2) + '%');
    dot.style.setProperty('--y', (8 + Math.random() * 84).toFixed(2) + '%');
    dot.style.setProperty('--d', (2.2 + Math.random() * 4.2).toFixed(2) + 's');
    dot.style.setProperty('--dl', (-Math.random() * 6).toFixed(2) + 's');
    dot.style.setProperty('--s', (1 + Math.random() * 2.4).toFixed(2) + 'px');
    dust.appendChild(dot);
  }
}
function introCardData(){
  const bank = state.bank || {chapters: [], questions: []};
  let chapters = Array.isArray(bank.chapters) ? bank.chapters.slice(0, 6) : [];
  if(!chapters.length) chapters = [{no: 0, title: '随堂练习'}];
  return chapters.map(c => {
    const count = (bank.questions || []).filter(q => String(q.chapter) === String(c.no)).length;
    let pre = 'ARCHIVE', name = String(c.title || '');
    if(String(c.no) === '0'){
      pre = 'BONUS SET'; name = '随堂练习';
    }else{
      const m = name.match(/^第\s*(\d+)\s*章\s*(.*)$/);
      if(m){ pre = '第 ' + m[1] + ' 章'; name = m[2] || '章节题'; }
    }
    return {no: String(c.no), pre, name, count, title: String(c.title || name)};
  });
}
function introMarkSVG(){
  return '<svg class="wc-mark" viewBox="0 0 120 120" fill="none" aria-hidden="true">'
    + '<circle cx="60" cy="62" r="46" stroke="rgba(244,207,134,.38)" stroke-width="1"/>'
    + '<path d="M60 28V62M60 62L28 88M60 62L92 88M60 62L60 94" stroke="#f4cf86" stroke-width="1.4" stroke-opacity=".86"/>'
    + '<g fill="#0b211a" stroke="#8ef0c7" stroke-width="1.5">'
    + '<circle cx="60" cy="28" r="7"/><circle cx="60" cy="62" r="6"/>'
    + '<circle cx="28" cy="88" r="6"/><circle cx="92" cy="88" r="6"/><circle cx="60" cy="94" r="4.5"/>'
    + '</g><path d="M56 24h8M24 84h8M88 84h8M56 90h8" stroke="#eaf9f1" stroke-width="1" stroke-opacity=".62"/></svg>';
}
function introRender(){
  const ws = introWheelState;
  if(!ws || !ws.cards.length) return;
  const N = ws.cards.length;
  const mobile = window.innerWidth <= 760;
  const x1 = mobile ? 96 : 150;
  const x2 = mobile ? 150 : 298;
  ws.cards.forEach((card, i) => {
    let off = ((i - ws.pos + N / 2) % N + N) % N - N / 2;
    const a = Math.abs(off);
    const sign = off < 0 ? -1 : 1;
    const x = a <= 1 ? sign * a * x1 : sign * (x1 + Math.min(a - 1, 1) * (x2 - x1) + (a > 2 ? (a - 2) * (mobile ? 18 : 26) : 0));
    const y = (mobile ? -26 : -30) + a * a * (mobile ? 3.2 : 4.4);
    const z = 48 - a * 100;
    const rot = -sign * a * 17;
    const tiltZ = sign * a * 1.3;
    const scale = Math.max(.47, 1.03 - a * .155);
    const op = a >= 2.55 ? 0 : Math.max(.28, 1 - a * .25);
    card.style.transform = 'translate(-50%,-50%) translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,' + z.toFixed(1) + 'px) rotateX(-1.8deg) rotateY(' + rot.toFixed(1) + 'deg) rotateZ(' + tiltZ.toFixed(2) + 'deg) scale(' + scale.toFixed(3) + ')';
    card.style.opacity = op.toFixed(3);
    card.style.zIndex = String(40 - Math.round(a * 4));
    card.style.pointerEvents = op < .06 ? 'none' : '';
    const focus = a < .45;
    if(card.classList.contains('is-focus') !== focus) card.classList.toggle('is-focus', focus);
  });
}
function introUpdateMeter(){
  const ws = introWheelState;
  if(!ws) return;
  const N = ws.cards.length;
  const idx = ((Math.round(ws.pos) % N) + N) % N;
  ws.active = idx;
  if(ws.lastMeter === idx) return;
  ws.lastMeter = idx;
  const ticks = document.querySelectorAll('#introTicks i');
  ticks.forEach((t, i) => t.classList.toggle('on', i === idx));
  const count = document.getElementById('introCount');
  if(count) count.textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0');
}
let introFloatTimer = 0;
function introPauseFloat(ms){
  const ws = introWheelState;
  if(!ws) return;
  ws.el.classList.add('moving');
  clearTimeout(introFloatTimer);
  introFloatTimer = setTimeout(() => ws.el.classList.remove('moving'), ms || 700);
}
function introStep(dir){
  const ws = introWheelState;
  if(!ws || introClosed || introOpening) return;
  const N = ws.cards.length;
  ws.active = ((ws.active + dir) % N + N) % N;
  ws.pos = ws.active;
  introPauseFloat(700);
  introRender();
  introUpdateMeter();
}
function introSelect(i){
  const ws = introWheelState;
  if(!ws || introClosed || introOpening) return;
  const N = ws.cards.length;
  const idx = ((i % N) + N) % N;
  if(idx !== ws.active){
    ws.active = idx; ws.pos = idx;
    introPauseFloat(700);
    introRender(); introUpdateMeter();
    setTimeout(() => {
      if(!introClosed && !introOpening && ws.active === idx) openIntroCard();
    }, 380);
  }else{
    openIntroCard();
  }
}
function closeIntro(){
  if(introClosed) return;
  introClosed = true;
  const el = document.getElementById('intro');
  if(!el) return;
  el.classList.add('gone');
  document.body.classList.remove('intro-open');
  setTimeout(() => { if(el.parentNode) el.remove(); }, 560);
}
function openIntroCard(){
  if(introClosed || introOpening) return;
  const el = document.getElementById('intro');
  const ws = introWheelState;
  if(!el || !ws) return;
  introOpening = true;
  const d = ws.data[ws.active];
  const num = String(ws.active + 1).padStart(2, '0');
  ws.cards.forEach((card, i) => card.classList.toggle('sel', i === ws.active));
  el.classList.add('open');
  const kicker = el.querySelector('.rev-kicker');
  const title = el.querySelector('.rev-title');
  const meta = el.querySelector('.rev-meta');
  if(kicker) kicker.textContent = "TODAY'S CARD · " + num;
  if(title){
    const small = title.querySelector('small'), b = title.querySelector('b');
    if(small) small.textContent = d.pre;
    if(b) b.textContent = d.name;
  }
  if(meta){
    const b = meta.querySelector('b'), s = meta.querySelector('span');
    if(b) b.textContent = d.count;
    if(s) s.textContent = '道题 · ' + (d.no === '0' ? '课堂原题' : '章节精题');
  }
  const copy = el.querySelector('.intro-copy');
  if(copy) copy.innerHTML = '<b>已抽到</b> · ' + d.count + ' 题';
  setTimeout(closeIntro, 1750);
}
function initIntroWheel(el){
  const wheel = document.getElementById('introWheel');
  if(!wheel) return;
  const data = introCardData();
  const cap = el.querySelector('.intro-cap i');
  if(cap) cap.textContent = String(data.length).padStart(2,'0') + ' SETS';
  wheel.innerHTML = data.map((d, i) => {
    const num = String(i + 1).padStart(2, '0');
    return '<button class="wheel-card t' + (i % 6) + '" type="button" data-i="' + i + '" aria-label="打开' + esc(d.title) + '">'
      + '<span class="wc-tape"></span>'
      + '<span class="wc-kicker">SEALED · ' + num + '</span>'
      + '<span class="wc-num">' + num + '</span>'
      + introMarkSVG()
      + '<span class="wc-title"><small>' + esc(d.pre) + '</small><b>' + esc(d.name) + '</b></span>'
      + '<span class="wc-meta"><b>' + d.count + '</b> 题</span>'
      + '<span class="wc-foot">STUDY ARCHIVE · 研题台</span>'
      + '<i class="wc-seal"></i></button>';
  }).join('');
  const ticks = document.getElementById('introTicks');
  if(ticks) ticks.innerHTML = data.map((_, i) => '<i data-i="' + i + '"></i>').join('');
  const cards = Array.from(wheel.querySelectorAll('.wheel-card'));
  cards.forEach((card, i) => {
    card.style.setProperty('--bob-dur', (5.8 + i * .18).toFixed(2) + 's');
    card.style.setProperty('--bob-delay', (-i * .85).toFixed(2) + 's');
  });
  const ws = {
    el: wheel, cards, data, pos: 0, active: 0, lastMeter: -1, frame: 0,
    dragging: false, startX: 0, startY: 0, startPos: 0, moved: false, suppress: false
  };
  introWheelState = ws;
  introUpdateMeter();
  setTimeout(() => { introRender(); }, 60);

  wheel.addEventListener('pointerdown', (e) => {
    if(introClosed || introOpening) return;
    if(e.button !== undefined && e.button !== 0) return;
    if(ws.frame){ cancelAnimationFrame(ws.frame); ws.frame = 0; }
    ws.dragging = true; ws.moved = false; ws.suppress = false;
    ws.startX = e.clientX; ws.startY = e.clientY; ws.startPos = ws.pos;
    wheel.classList.add('dragging');
  });
  const onMove = (e) => {
    if(!ws.dragging) return;
    const dx = e.clientX - ws.startX, dy = e.clientY - ws.startY;
    if(!ws.moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.15) ws.moved = true;
    if(!ws.moved) return;
    if(e.cancelable) e.preventDefault();
    const step = window.innerWidth <= 760 ? 94 : 136;
    ws.pos = ws.startPos - dx / step;
    ws.suppress = true;
    if(!ws.frame){
      ws.frame = requestAnimationFrame(() => {
        ws.frame = 0;
        if(!ws.dragging) return;
        introRender();
        introUpdateMeter();
      });
    }
  };
  const onEnd = () => {
    if(!ws.dragging) return;
    ws.dragging = false;
    wheel.classList.remove('dragging');
    if(ws.frame){ cancelAnimationFrame(ws.frame); ws.frame = 0; }
    if(ws.moved){
      ws.pos = Math.round(ws.pos);
      const N = ws.cards.length;
      ws.active = ((ws.pos % N) + N) % N;
      introPauseFloat(650);
      introRender();
      introUpdateMeter();
      setTimeout(() => { ws.suppress = false; }, 260);
    }else{
      ws.pos = ws.active;
      introRender();
    }
  };
  window.addEventListener('pointermove', onMove, {passive: false});
  window.addEventListener('pointerup', onEnd);
  window.addEventListener('pointercancel', onEnd);
  window.addEventListener('resize', () => { if(!introClosed) introRender(); });
  window.addEventListener('keydown', (e) => {
    if(introClosed || introOpening) return;
    if(e.key === 'ArrowLeft'){ e.preventDefault(); introStep(-1); }
    if(e.key === 'ArrowRight'){ e.preventDefault(); introStep(1); }
  });
  wheel.addEventListener('click', (e) => {
    const card = e.target.closest && e.target.closest('.wheel-card');
    if(!card) return;
    e.preventDefault();
    if(ws.suppress) return;
    introSelect(Number(card.dataset.i));
  });
  const prev = el.querySelector('.intro-arrow.prev');
  const next = el.querySelector('.intro-arrow.next');
  if(prev) prev.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); introStep(-1); });
  if(next) next.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); introStep(1); });
}
function initIntro(){
  const el = document.getElementById('intro');
  if(!el) return;
  document.body.classList.add('intro-open');
  initIntroDust();
  initIntroWheel(el);
  const skip = el.querySelector('.intro-skip');
  if(skip) skip.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); closeIntro(); });
}
function initClickFX(){
  let last = 0;
  document.addEventListener('pointerdown', (e) => {
    if(e.button !== undefined && e.button !== 0) return;
    const now = Date.now();
    if(now - last < 90) return;
    last = now;
    let x = e.clientX, y = e.clientY;
    if((!x && !y) && e.target && e.target.getBoundingClientRect){
      const r = e.target.getBoundingClientRect();
      x = r.left + r.width / 2; y = r.top + r.height / 2;
    }
    const fx = document.createElement('div');
    fx.className = 'click-fx';
    fx.style.left = x + 'px';
    fx.style.top = y + 'px';
    const colors = ['#6ee7b7', '#f1b45b', '#a9f5d4', '#f7cf7d'];
    let sparks = '<span class="click-ring"></span>';
    for(let i = 0; i < 6; i++){
      const angle = (Math.PI * 2 * i / 6) + (Math.random() - .5) * .5;
      const dist = 17 + Math.random() * 20;
      sparks += `<i style="--dx:${(Math.cos(angle) * dist).toFixed(1)}px;--dy:${(Math.sin(angle) * dist).toFixed(1)}px;--c:${colors[i % colors.length]}"></i>`;
    }
    fx.innerHTML = sparks;
    document.body.appendChild(fx);
    setTimeout(() => fx.remove(), 700);
  }, {passive:true});
}

/* ---------------- 启动 ---------------- */
function initApp(){
  loadSubjects();
  state.ai.config = Object.assign({}, AI_DEFAULT, load(LS.ai, {}) || {});
  const savedThread = load(LS.aiThread, []);
  state.ai.messages = Array.isArray(savedThread) ? savedThread.filter(m => m && m.role && m.content).slice(-40) : [];
  initIntro();
  initClickFX();
  state.wrong = load(LS.wrong, []) || [];
  state.history = load(LS.history, []) || [];
  const restored = load(LS.session, null);
  if(restored && Array.isArray(restored.questions) && restored.questions.length){
    restored.questions = restored.questions.map((q, i) => normalizeQuestion(q, i));
    restored.revealedQ = restored.revealedQ || {};
    const sub = state.subjects.find(s => s.id === restored.subjectId);
    if(sub){ state.activeSubjectId = sub.id; state.bank = sub.bank; }
    if(!restored.subjectId){
      const cur = activeSubject();
      restored.subjectId = cur ? cur.id : 'ds';
      restored.subjectName = cur ? cur.name : '数据结构';
    }
    state.session = restored;
  }
  resetSetup();
  render();
  setInterval(tick, 1000);
  updateTimer();
  if(state.session && state.session.mode === 'exam' && state.session.endsAt && !state.session.submitted && state.session.endsAt <= Date.now()){
    submitPaper(true);
  }
}
initApp();
